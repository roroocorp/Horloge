<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:manipulation;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
}

/* =========================
   PAGES
========================= */

.page{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:92px;

  padding:42px 28px 30px;

  overflow-y:auto;
  overflow-x:hidden;

  display:none;

  background:#000;
}

.page.show{
  display:block;
}

.content{
  width:100%;
  max-width:700px;
  margin:auto;
}

h1{
  margin:0;
  font-size:38px;
  font-weight:700;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:8px;
  color:#777;
  font-size:18px;
}

/* =========================
   NAVIGATION
========================= */

#nav{
  position:absolute;
  z-index:5000;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  width:100%;
  max-width:728px;
  height:92px;

  background:#111;

  display:flex;

  padding:5px 3px;
}

.nav{
  flex:1;

  height:82px;

  background:transparent;
  border:0;

  color:#666;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:6px;

  font-size:13px;

  cursor:pointer;

  padding:0;
  margin:0;

  position:relative;

  z-index:6000;
}

.nav.active{
  color:#20e879;
}

.nav svg{
  width:31px;
  height:31px;

  stroke:currentColor;
  fill:none;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;

  pointer-events:none;
}

.nav span{
  pointer-events:none;
}

/* =========================
   RÉVEILS
========================= */

.empty{
  text-align:center;
  margin-top:76px;
}

.plus{
  width:82px;
  height:82px;

  border-radius:50%;
  border:0;

  background:#20e879;
  color:#06130b;

  font-size:42px;
  font-weight:300;

  display:block;
  margin:auto;
}

.plus:active{
  transform:scale(.94);
}

.add-text{
  margin-top:14px;
  color:#777;
  font-size:20px;
}

.alarm-list{
  margin-top:30px;
}

.alarm{
  min-height:90px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:1px solid #181818;
}

.alarm-time{
  font-size:39px;
  font-weight:300;
}

.alarm-days{
  margin-top:4px;
  color:#777;
  font-size:14px;
}

.alarm-right{
  display:flex;
  align-items:center;
  gap:13px;
}

.delete{
  background:none;
  border:0;
  color:#666;
  font-size:27px;
}

.switch{
  width:51px;
  height:30px;

  border:0;
  border-radius:20px;

  background:#333;

  position:relative;
}

.switch:after{
  content:"";

  position:absolute;

  width:24px;
  height:24px;

  left:3px;
  top:3px;

  border-radius:50%;

  background:#aaa;

  transition:.2s;
}

.switch.on{
  background:#20e879;
}

.switch.on:after{
  left:24px;
  background:#06130b;
}

/* =========================
   HORLOGE
========================= */

.clock-page{
  text-align:center;
}

.clock-content{
  margin-top:110px;
}

.clock{
  font-size:clamp(55px,15vw,105px);
  font-weight:300;
  white-space:nowrap;
  letter-spacing:1px;
}

.clock-sec{
  color:#20e879;
}

.date{
  margin-top:15px;
  color:#777;
  font-size:20px;
  text-transform:capitalize;
}

/* =========================
   OUTILS
========================= */

.tool-page{
  text-align:center;
}

.tool{
  margin-top:90px;
}

.display{
  font-size:clamp(55px,15vw,100px);
  font-weight:300;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.green{
  color:#20e879;
}

.buttons{
  margin-top:45px;

  display:flex;
  justify-content:center;
  gap:20px;
}

.round{
  width:78px;
  height:78px;

  border:0;
  border-radius:50%;

  background:#181818;
  color:#fff;

  font-size:15px;
}

.round.green-btn{
  background:#20e879;
  color:#06130b;
  font-weight:bold;
}

.round:active{
  transform:scale(.93);
}

/* =========================
   TOURS
========================= */

.laps{
  max-width:430px;
  margin:35px auto 0;

  text-align:left;

  max-height:180px;
  overflow:auto;
}

.lap{
  display:flex;
  justify-content:space-between;

  padding:11px 4px;

  color:#aaa;

  border-bottom:1px solid #181818;
}

/* =========================
   MINUTEUR
========================= */

.timer{
  margin-top:70px;
}

.timer-inputs{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:7px;

  margin-top:35px;
}

.input-time{
  width:76px;
  height:58px;

  background:#111;
  color:#fff;

  border:1px solid #292929;
  border-radius:12px;

  text-align:center;

  font-size:24px;
  outline:none;
}

.input-time:focus{
  border-color:#20e879;
}

.colon{
  color:#777;
  font-size:25px;
}

/* =========================
   MODALE
========================= */

#modal{
  position:fixed;
  z-index:10000;

  inset:0;

  background:rgba(0,0,0,.72);

  display:none;
  align-items:flex-end;
}

#modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;

  margin:auto auto 0;

  background:#151515;

  border-radius:25px 25px 0 0;

  padding:25px 22px 32px;
}

.modal-title{
  text-align:center;
  font-size:22px;
  margin-bottom:22px;
}

.alarm-time-input{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.alarm-time-input input{
  width:105px;
  height:70px;

  background:#080808;
  color:#fff;

  border:1px solid #333;
  border-radius:15px;

  text-align:center;

  font-size:38px;
  outline:none;
}

.days{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;

  margin:25px 0;
}

.day{
  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:#252525;
  color:#aaa;
}

.day.selected{
  background:#20e879;
  color:#06130b;
  font-weight:bold;
}

.modal-buttons{
  display:flex;
  gap:12px;
}

.modal-buttons button{
  flex:1;
  height:52px;

  border:0;
  border-radius:30px;

  font-size:16px;
}

.cancel{
  background:#292929;
  color:#fff;
}

.save{
  background:#20e879;
  color:#06130b;
  font-weight:bold;
}

/* =========================
   ALERTE
========================= */

#ring{
  position:fixed;
  z-index:20000;

  inset:0;

  background:#000;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;
}

#ring.show{
  display:flex;
}

#ring h2{
  font-size:40px;
}

.ring-time{
  color:#20e879;
  font-size:70px;
  margin:25px 0 40px;
}

.stop{
  border:0;
  border-radius:40px;

  background:#20e879;
  color:#06130b;

  padding:17px 45px;

  font-size:18px;
  font-weight:bold;
}

@media(max-width:500px){

  .page{
    padding:32px 20px 25px;
  }

  h1{
    font-size:34px;
  }

  #nav{
    height:91px;
  }

  .nav{
    height:82px;
    font-size:12px;
  }

  .nav svg{
    width:30px;
    height:30px;
  }

}
</style>
</head>

<body>

<div id="app">

<h1>Réveils</h1>

<div id="alarmList" class="alarm-list"></div>

<div id="empty" class="empty">

<button class="plus" onclick="openModal()">+</button>

<div class="add-text">
Ajouter un réveil
</div>

</div>

</div>

<!-- =================================================
     HORLOGE
================================================= -->

<section class="page clock-page" id="clock">

<h1>Horloge</h1>
<div class="subtitle">Heure actuelle</div>

<div class="clock">

Tour

<!-- =================================================
     MODALE
================================================= -->

<div id="modal">

<div class="modal-box">

<div class="modal-title">

<input
id="alarmHour"
type="number"
min="0"
max="23"
value="07">

id="alarmMinute"
type="number"
min="0"
max="59"
value="00">

<button class="day" data-day="2" onclick="selectDay(this)">Mar</button>

<button class="day" data-day="4" onclick="selectDay(this)">Jeu</button>
<button class="day" data-day="5" onclick="selectDay(this)">Ven</button>
<button class="day" data-day="6" onclick="selectDay(this)">Sam</button>

<!-- =================================================
     SONNERIE
================================================= -->

<div id="ring">

<div>

<h2>Réveil</h2>

<div class="ring-time" id="ringTime">
00:00
</div>

<button class="stop" onclick="stopRing()">
Arrêter
</button>

<script>

/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page,id){

  /*
    C'est volontairement très simple :
    une seule page visible à la fois.
  */

  document.querySelectorAll(".page").forEach(function(p){
    p.classList.remove("show");
  });

  document.getElementById(page).classList.add("show");

  document.querySelectorAll(".nav").forEach(function(n){
    n.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

}


/* =====================================================
   HORLOGE
===================================================== */

const days=[
"dimanche",
"lundi",
"mardi",
"mercredi",
"jeudi",
"vendredi",
"samedi"
];

const months=[
"janvier",
"février",
"mars",
"avril",
"mai",
"juin",
"juillet",
"août",
"septembre",
"octobre",
"novembre",
"décembre"
];

function pad(n){
  return String(n).padStart(2,"0");
}

function clockUpdate(){

  const d=new Date();

  document.getElementById("hh").textContent=pad(d.getHours());
  document.getElementById("mm").textContent=pad(d.getMinutes());
  document.getElementById("ss").textContent=pad(d.getSeconds());

  document.getElementById("date").textContent=
    days[d.getDay()]+" "+
    d.getDate()+" "+
    months[d.getMonth()]+" "+
    d.getFullYear();

  checkAlarms();

}

setInterval(clockUpdate,1000);
clockUpdate();


/* =====================================================
   RÉVEILS
===================================================== */

let alarms=[];

try{
  alarms=JSON.parse(localStorage.getItem("clock_alarms"))||[];
}catch(e){
  alarms=[];
}

let selectedDays=[];

function openModal(){

  selectedDays=[];

  document.querySelectorAll(".day").forEach(function(d){
    d.classList.remove("selected");
  });

  document.getElementById("modal").classList.add("show");

}

function closeModal(){

  document.getElementById("modal").classList.remove("show");

}

function selectDay(button){

  const day=Number(button.dataset.day);

  if(selectedDays.includes(day)){

    selectedDays=selectedDays.filter(function(x){
      return x!==day;
    });

    button.classList.remove("selected");

  }else{

    selectedDays.push(day);

    button.classList.add("selected");

  }

}

function saveAlarm(){

  let h=Number(document.getElementById("alarmHour").value)||0;
  let m=Number(document.getElementById("alarmMinute").value)||0;

  h=Math.max(0,Math.min(23,h));
  m=Math.max(0,Math.min(59,m));

  alarms.push({
    id:Date.now(),
    hour:h,
    minute:m,
    days:[...selectedDays],
    enabled:true,
    last:""
  });

  localStorage.setItem(
    "clock_alarms",
    JSON.stringify(alarms)
  );

  renderAlarms();
  closeModal();

}

function renderAlarms(){

  const list=document.getElementById("alarmList");
  const empty=document.getElementById("empty");

  list.innerHTML="";

  empty.style.display=
    alarms.length===0 ? "block":"none";

  const names={
    0:"Dim",
    1:"Lun",
    2:"Mar",
    3:"Mer",
    4:"Jeu",
    5:"Ven",
    6:"Sam"
  };

  alarms.forEach(function(a){

    let text="Tous les jours";

    if(a.days.length){
      text=a.days.map(function(d){
        return names[d];
      }).join(" • ");
    }

    const row=document.createElement("div");

    row.className="alarm";

    row.innerHTML=`
      <div>
        <div class="alarm-time">
          ${pad(a.hour)}:${pad(a.minute)}
        </div>
        <div class="alarm-days">
          ${text}
        </div>
      </div>

      <div class="alarm-right">

        <button
          class="delete"
          onclick="deleteAlarm(${a.id})">
          ×
        </button>

        <button
          class="switch ${a.enabled?"on":""}"
          onclick="toggleAlarm(${a.id})">
        </button>

      </div>
    `;

    list.appendChild(row);

  });

}

function deleteAlarm(id){

  alarms=alarms.filter(function(a){
    return a.id!==id;
  });

  localStorage.setItem(
    "clock_alarms",
    JSON.stringify(alarms)
  );

  renderAlarms();

}

function toggleAlarm(id){

  const a=alarms.find(function(x){
    return x.id===id;
  });

  if(!a)return;

  a.enabled=!a.enabled;

  localStorage.setItem(
    "clock_alarms",
    JSON.stringify(alarms)
  );

  renderAlarms();

}

renderAlarms();


/* =====================================================
   ALARME
===================================================== */

let ringing=false;

function checkAlarms(){

  if(ringing)return;

  const d=new Date();

  if(d.getSeconds()!==0)return;

  alarms.forEach(function(a){

    if(!a.enabled)return;

    if(a.hour!==d.getHours())return;

    if(a.minute!==d.getMinutes())return;

    if(
      a.days.length &&
      !a.days.includes(d.getDay())
    ){
      return;
    }

    const key=
      d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();

    if(a.last===key)return;

    a.last=key;

    localStorage.setItem(
      "clock_alarms",
      JSON.stringify(alarms)
    );

    startRing(
      pad(a.hour)+":"+pad(a.minute)
    );

  });

}

function startRing(time){

  ringing=true;

  document.getElementById("ringTime").textContent=time;

  document.getElementById("ring").classList.add("show");

  if(navigator.vibrate){
    navigator.vibrate([500,300,500,300,800]);
  }

}

function stopRing(){

  ringing=false;

  document.getElementById("ring").classList.remove("show");

  if(navigator.vibrate){
    navigator.vibrate(0);
  }

}


/* =====================================================
   CHRONOMÈTRE
===================================================== */

let chronoRunning=false;
let chronoElapsed=0;
let chronoStartTime=0;
let chronoInterval=null;
let lastLap=0;

function chronoUpdate(){

  let elapsed=chronoElapsed;

  if(chronoRunning){
    elapsed+=Date.now()-chronoStartTime;
  }

  const total=Math.floor(elapsed/1000);

  const min=Math.floor(total/60);
  const sec=total%60;
  const ms=Math.floor((elapsed%1000)/10);

  document.getElementById("cm").textContent=pad(min);
  document.getElementById("cs").textContent=pad(sec);
  document.getElementById("cml").textContent=pad(ms);

}

function chronoToggle(){

  if(!chronoRunning){

    chronoRunning=true;
    chronoStartTime=Date.now();

    chronoInterval=setInterval(chronoUpdate,20);

    document.getElementById("chronoButton").textContent="Pause";

  }else{

    chronoElapsed+=Date.now()-chronoStartTime;

    chronoRunning=false;

    clearInterval(chronoInterval);

    document.getElementById("chronoButton").textContent="Démarrer";

    chronoUpdate();

  }

}

function chronoReset(){

  chronoRunning=false;

  clearInterval(chronoInterval);

  chronoElapsed=0;
  chronoStartTime=0;
  lastLap=0;

  document.getElementById("chronoButton").textContent="Démarrer";

  document.getElementById("laps").innerHTML="";

  chronoUpdate();

}

function chronoLap(){

  let elapsed=chronoElapsed;

  if(chronoRunning){
    elapsed+=Date.now()-chronoStartTime;
  }

  if(elapsed<=0)return;

  const difference=elapsed-lastLap;

  lastLap=elapsed;

  const total=Math.floor(difference/1000);

  const min=Math.floor(total/60);
  const sec=total%60;
  const ms=Math.floor((difference%1000)/10);

  const row=document.createElement("div");

  row.className="lap";

  const number=
    document.querySelectorAll(".lap").length+1;

  row.innerHTML=
    "<span>Tour "+number+"</span>"+
    "<span>"+
    pad(min)+":"+pad(sec)+"."+pad(ms)+
    "</span>";

  document.getElementById("laps").prepend(row);

}

chronoUpdate();


/* =====================================================
   MINUTEUR
===================================================== */

let timerRunning=false;
let timerRemaining=0;
let timerEnd=0;
let timerInterval=null;

function getTimerValue(){

  const h=Math.max(
    0,
    Number(docum
