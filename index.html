<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horloge</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at top, #252525 0%, #101010 45%, #050505 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 500px;
    min-height: 700px;
    background: rgba(20,20,20,.92);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 35px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    overflow: hidden;
    backdrop-filter: blur(20px);
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

header h1 {
    font-size: 26px;
    font-weight: 700;
}

header p {
    color: #888;
    margin-top: 6px;
    font-size: 14px;
}

.tabs {
    display: flex;
    margin: 10px 18px 25px;
    padding: 5px;
    background: #111;
    border-radius: 18px;
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: #777;
    padding: 13px 5px;
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    transition: .25s;
}

.tab.active {
    background: #2a2a2a;
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,.3);
}

.screen {
    display: none;
    padding: 10px 25px 35px;
}

.screen.active {
    display: block;
}

.clock {
    text-align: center;
    padding: 45px 0;
}

.time {
    font-size: clamp(55px, 16vw, 92px);
    font-weight: 200;
    letter-spacing: -4px;
    font-variant-numeric: tabular-nums;
}

.date {
    color: #999;
    margin-top: 12px;
    font-size: 16px;
}

.circle {
    width: 270px;
    height: 270px;
    margin: 20px auto 35px;
    border-radius: 50%;
    background: conic-gradient(
        #ff9f0a var(--progress, 0%),
        #292929 var(--progress, 0%)
    );
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.circle::before {
    content: "";
    position: absolute;
    inset: 10px;
    background: #151515;
    border-radius: 50%;
}

.circle-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.timer-display {
    font-size: 48px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
}

.label {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.inputs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 25px;
}

.inputs input {
    width: 90px;
    padding: 14px 5px;
    background: #242424;
    border: 1px solid #333;
    border-radius: 14px;
    color: white;
    font-size: 24px;
    text-align: center;
    outline: none;
}

.inputs input:focus {
    border-color: #ff9f0a;
}

.input-labels {
    display: flex;
    justify-content: center;
    gap: 44px;
    color: #777;
    font-size: 11px;
    margin-top: -17px;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 14px;
}

button.action {
    border: none;
    border-radius: 50%;
    width: 68px;
    height: 68px;
    background: #292929;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: transform .15s, background .2s;
}

button.action:hover {
    background: #383838;
}

button.action:active {
    transform: scale(.92);
}

button.primary {
    background: #ff9f0a;
    color: #111;
    font-weight: 700;
}

button.primary:hover {
    background: #ffb52e;
}

.stopwatch {
    text-align: center;
    padding: 75px 0 50px;
}

.stopwatch-display {
    font-size: clamp(55px, 15vw, 82px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
}

.laps {
    margin-top: 30px;
    max-height: 190px;
    overflow-y: auto;
    border-top: 1px solid #292929;
}

.lap {
    display: flex;
    justify-content: space-between;
    padding: 12px 5px;
    border-bottom: 1px solid #242424;
    color: #aaa;
}

.status {
    text-align: center;
    color: #777;
    font-size: 13px;
    min-height: 20px;
    margin-top: 18px;
}

@media(max-width:400px) {
    .app {
        min-height: 650px;
        border-radius: 28px;
    }

    .circle {
        width: 240px;
        height: 240px;
    }

    .inputs input {
        width: 78px;
    }

    .input-labels {
        gap: 32px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>Horloge</h1>
    <p>Simple • Élégante • Précise</p>
</header>

<div class="tabs">
    <button class="tab active" onclick="showScreen('clock', this)">Horloge</button>
    <button class="tab" onclick="showScreen('timer', this)">Minuteur</button>
    <button class="tab" onclick="showScreen('stopwatch', this)">Chrono</button>
</div>

<!-- HORLOGE -->
<section id="clock" class="screen active">

    <div class="clock">
        <div id="currentTime" class="time">00:00:00</div>
        <div id="currentDate" class="date">Chargement...</div>
    </div>

</section>

<!-- MINUTEUR -->
<section id="timer" class="screen">

    <div class="circle" id="timerCircle">

        <div class="circle-content">
            <div id="timerDisplay" class="timer-display">00:00:00</div>
            <div class="label">MINUTEUR</div>
        </div>

    </div>

    <div class="inputs">

        <input id="hours" type="number" min="0" max="99" value="0">
        <input id="minutes" type="number" min="0" max="59" value="5">
        <input id="seconds" type="number" min="0" max="59" value="0">

    </div>

    <div class="input-labels">
        <span>HEURES</span>
        <span>MIN</span>
        <span>SEC</span>
    </div>

    <div class="buttons">

        <button class="action" onclick="resetTimer()">Reset</button>

        <button id="timerButton"
                class="action primary"
                onclick="toggleTimer()">Démarrer</button>

    </div>

    <div id="timerStatus" class="status"></div>

</section>

<!-- CHRONOMÈTRE -->
<section id="stopwatch" class="screen">

    <div class="stopwatch">

        <div id="stopwatchDisplay" class="stopwatch-display">
            00:00:00.00
        </div>

        <div class="buttons">

            <button class="action" onclick="resetStopwatch()">
                Reset
            </button>

            <button id="chronoButton"
                    class="action primary"
                    onclick="toggleStopwatch()">
                Démarrer
            </button>

        </div>

        <div class="laps" id="laps"></div>

    </div>

</section>

</div>

<script>

/* =========================
   CHANGEMENT D'ONGLET
========================= */

function showScreen(id, button) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
    button.classList.add("active");
}


/* =========================
   HORLOGE
========================= */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    const date = now.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("currentTime").textContent = time;

    document.getElementById("currentDate").textContent =
        date.charAt(0).toUpperCase() + date.slice(1);
}

setInterval(updateClock, 1000);
updateClock();


/* =========================
   MINUTEUR
========================= */

let timerInterval = null;
let timerRunning = false;
let timerRemaining = 0;
let timerTotal = 0;

function getInputSeconds() {

    const h = Math.max(
        0,
        parseInt(document.getElementById("hours").value) || 0
    );

    const m = Math.max(
        0,
        parseInt(document.getElementById("minutes").value) || 0
    );

    const s = Math.max(
        0,
        parseInt(document.getElementById("seconds").value) || 0
    );

    return h * 3600 + m * 60 + s;
}

function formatTime(totalSeconds) {

    totalSeconds = Math.max(0, Math.floor(totalSeconds));

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    return [
        String(h).padStart(2, "0"),
        String(m).padStart(2, "0"),
        String(s).padStart(2, "0")
    ].join(":");
}

function updateTimerDisplay() {

    document.getElementById("timerDisplay").textContent =
        formatTime(timerRemaining);

    let progress = 0;

    if (timerTotal > 0) {
        progress = ((timerTotal - timerRemaining) / timerTotal) * 100;
    }

    document.getElementById("timerCircle")
        .style.setProperty("--progress", progress + "%");
}

function toggleTimer() {

    if (timerRunning) {

        clearInterval(timerInterval);

        timerRunning = false;

        document.getElementById("timerButton").textContent =
            "Reprendre";

        return;
    }

    if (timerRemaining <= 0) {

        timerRemaining = getInputSeconds();
        timerTotal = timerRemaining;

        if (timerRemaining <= 0) {
            document.getElementById("timerStatus").textContent =
                "Choisis une durée.";
            return;
        }
    }

    timerRunning = true;

    document.getElementById("timerButton").textContent =
        "Pause";

    document.getElementById("timerStatus").textContent = "";

    const start = Date.now();
    const initialRemaining = timerRemaining;

    timerInterval = setInterval(() => {

        const elapsed = Math.floor(
            (Date.now() - start) / 1000
        );

        timerRemaining = Math.max(
            0,
            initialRemaining - elapsed
        );

        updateTimerDisplay();

        if (timerRemaining <= 0) {

            clearInterval(timerInterval);

            timerRunning = false;

            document.getElementById("timerButton").textContent =
                "Démarrer";

            document.getElementById("timerStatus").textContent =
                "⏰ Temps écoulé !";

            playAlarm();
        }

    }, 100);

    updateTimerDisplay();
}

function resetTimer() {

    clearInterval(timerInterval);

    timerRunning = false;
    timerRemaining = 0;
    timerTotal = 0;

    document.getElementById("timerButton").textContent =
        "Démarrer";

    document.getElementById("timerStatus").textContent = "";

    updateTimerDisplay();
}

function playAlarm() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        for (let i = 0; i < 4; i++) {

            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();

            oscillator.frequency.value =
                i % 2 === 0 ? 880 : 660;

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            const start = ctx.currentTime + i * .35;

            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(.25, start + .02);
            gain.gain.exponentialRampToValueAtTime(.001, start + .28);

            oscillator.start(start);
            oscillator.stop(start + .3);
        }

    } catch (error) {
        console.log("Son non disponible.");
    }
}


/* =========================
   CHRONOMÈTRE
========================= */

let stopwatchInterval = null;
let stopwatchRunning = false;
let stopwatchStart = 0;
let stopwatchElapsed = 0;
let lapNumber = 0;

function formatStopwatch(ms) {

    const centiseconds =
        Math.floor((ms % 1000) / 10);

    const seconds =
        Math.floor(ms / 1000) % 60;

    const minutes =
        Math.floor(ms / 60000) % 60;

    const hours =
        Math.floor(ms / 3600000);

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") + "." +
        String(centiseconds).padStart(2, "0")
    );
}

function updateStopwatch() {

    let current = stopwatchElapsed;

    if (stopwatchRunning) {
        current += Date.now() - stopwatchStart;
    }

    document.getElementById("stopwatchDisplay")
        .textContent = formatStopwatch(current);
}

function toggleStopwatch() {

    if (stopwatchRunning) {

        stopwatchElapsed +=
            Date.now() - stopwatchStart;

        clearInterval(stopwatchInterval);

        stopwatchRunning = false;

        document.getElementById("chronoButton").textContent =
            "Démarrer";

    } else {

        stopwatchStart = Date.now();

        stopwatchRunning = true;

        document.getElementById("chronoButton").textContent =
            "Pause";

        stopwatchInterval =
            setInterval(updateStopwatch, 20);
    }

    updateStopwatch();
}

function resetStopwatch() {

    clearInterval(stopwatchInterval);

    stopwatchRunning = false;
    stopwatchElapsed = 0;
    stopwatchStart = 0;
    lapNumber = 0;

    document.getElementById("chronoButton").textContent =
        "Démarrer";

    document.getElementById("laps").innerHTML = "";

    updateStopwatch();
}

updateTimerDisplay();
updateStopwatch();

</script>

</body>
</html>
