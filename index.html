<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:100px;
}

header{padding:30px 24px 15px}

h1{
font-size:34px;
margin:0;
font-weight:700;
}

.subtitle{
color:#777;
margin-top:5px;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:3px;
}

.alarm-days{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.day{
font-size:12px;
color:#666;
font-weight:600;
}

.day.active{
color:#32d47a;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
flex-shrink:0;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#32d47a;
}

.switch input:checked+.slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
gap:10px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

/* =========================
   HORLOGE
========================= */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* =========================
   CHRONO
========================= */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

/* =========================
   MINUTEUR STYLE HORLOGE
========================= */

.timer-picker{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:30px;
}

.timer-column{
height:180px;
overflow:hidden;
position:relative;
background:#111;
border-radius:20px;
border:1px solid #222;
}

.timer-column::before,
.timer-column::after{
content:"";
position:absolute;
left:0;
right:0;
height:65px;
z-index:2;
pointer-events:none;
}

.timer-column::before{
top:0;
background:linear-gradient(#111,transparent);
}

.timer-column::after{
bottom:0;
background:linear-gradient(transparent,#111);
}

.timer-scroll{
height:100%;
overflow-y:auto;
scrollbar-width:none;
scroll-snap-type:y mandatory;
padding:58px 0;
}

.timer-scroll::-webkit-scrollbar{
display:none;
}

.timer-option{
height:64px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:#555;
scroll-snap-align:center;
font-variant-numeric:tabular-nums;
}

.timer-option.selected{
color:#fff;
font-size:34px;
font-weight:500;
}

.timer-selection{
position:absolute;
left:5px;
right:5px;
top:58px;
height:64px;
border-top:1px solid #333;
border-bottom:1px solid #333;
pointer-events:none;
z-index:3;
}

.timer-labels{
display:grid;
grid-template-columns:repeat(3,1fr);
text-align:center;
margin-top:8px;
color:#777;
font-size:11px;
font-weight:600;
}

.timer-display{
font-size:56px;
font-weight:200;
text-align:center;
letter-spacing:-3px;
margin:45px 0 20px;
font-variant-numeric:tabular-nums;
}

.timer-running-picker{
display:none;
}

.timer-running-picker.show{
display:block;
}

.timer-inputs{
display:none;
}

.timer-button-area{
margin-top:20px;
}

/* =========================
   NAV
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
padding:0;
}

nav button.active{
color:#32d47a;
}

.icon{
width:26px;
height:26px;
display:flex;
align-items:center;
justify-content:center;
color:currentColor;
}

.icon svg{
width:25px;
height:25px;
display:block;
stroke:currentColor;
fill:none;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}

/* =========================
   MODAL REVEIL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
max-height:90vh;
overflow-y:auto;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
}

.days-title{
margin-top:20px;
font-size:14px;
color:#aaa;
}

.days-selector{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:10px;
}

.day-button{
height:42px;
border-radius:50%;
background:#222;
border:1px solid #333;
color:#777;
font-size:12px;
font-weight:700;
}

.day-button.selected{
background:#32d47a;
border-color:#32d47a;
color:#001b0d;
}

.every-day{
margin-top:10px;
width:100%;
height:45px;
background:#222;
border:0;
border-radius:14px;
color:#aaa;
font-size:14px;
}

.every-day.selected{
background:#245c40;
color:#fff;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- =========================
     REVEILS
========================= -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button class="add" onclick="openAlarm()">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>

<!-- =========================
     HORLOGE
========================= -->

<section id="clock" class="page">

<div class="clock">

<div id="clockTime" class="clock-time">
00:00:00
</div>

<div id="clockDate" class="clock-date"></div>

</div>

</section>

<!-- =========================
     CHRONO
========================= -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button class="dark" onclick="lap()">
Tour
</button>

<button id="chronoStart" class="green" onclick="startChrono()">
Démarrer
</button>

</div>

<button class="dark full" onclick="resetChrono()">
Réinitialiser
</button>

<div id="laps"></div>

</section>

<!-- =========================
     MINUTEUR
========================= -->

<section id="timer" class="page">

<div id="timerDisplay" class="timer-display">
00:05:00
</div>

<div id="timerPicker" class="timer-running-picker show">

<div class="timer-picker">

<div class="timer-column">

<div class="timer-selection"></div>

<div id="hoursScroll" class="timer-scroll"></div>

</div>

<div class="timer-column">

<div class="timer-selection"></div>

<div id="minutesScroll" class="timer-scroll"></div>

</div>

<div class="timer-column">

<div class="timer-selection"></div>

<div id="secondsScroll" class="timer-scroll"></div>

</div>

</div>

<div class="timer-labels">
<div>HEURES</div>
<div>MINUTES</div>
<div>SECONDES</div>
</div>

</div>

<div class="timer-button-area">

<button
id="timerStart"
class="green full"
onclick="startTimer()">

Démarrer

</button>

<button
class="dark full"
onclick="resetTimer()">

Réinitialiser

</button>

</div>

</section>

<!-- =========================
     NAVIGATION
========================= -->

<nav>

<button id="navAlarms" class="active" onclick="page('alarms')">

<span class="icon">
<svg viewBox="0 0 24 24">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>
</span>

Réveils

</button>

<button id="navClock" onclick="page('clock')">

<span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</span>

Horloge

</button>

<button id="navChrono" onclick="page('chrono')">

<span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="13" r="8"/>
<path d="M9 3h6"/>
<path d="M12 13V9"/>
<path d="M12 13l3 2"/>
<path d="M17 5l2 2"/>
</svg>
</span>

Chrono

</button>

<button id="navTimer" onclick="page('timer')">

<span class="icon">
<svg viewBox="0 0 24 24">
<path d="M9 3h6"/>
<path d="M12 3v3"/>
<path d="M7 7l-2-2"/>
<path d="M17 7l2-2"/>
<circle cx="12" cy="13" r="7"/>
<path d="M12 9v4l2 1"/>
</svg>
</span>

Minuteur

</button>

</nav>

</div>

<!-- =========================
     MODAL REVEIL
========================= -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input id="alarmTime" type="time" value="07:00">

<div class="days-title">
Répéter
</div>

<div class="days-selector">

<button class="day-button" data-day="1" onclick="toggleDay(1)">L</button>
<button class="day-button" data-day="2" onclick="toggleDay(2)">M</button>
<button class="day-button" data-day="3" onclick="toggleDay(3)">M</button>
<button class="day-button" data-day="4" onclick="toggleDay(4)">J</button>
<button class="day-button" data-day="5" onclick="toggleDay(5)">V</button>
<button class="day-button" data-day="6" onclick="toggleDay(6)">S</button>
<button class="day-button" data-day="0" onclick="toggleDay(0)">D</button>

</div>

<button id="everyDayButton" class="every-day" onclick="toggleEveryDay()">
Tous les jours
</button>

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button class="dark" onclick="closeAlarm()">
Annuler
</button>

<button class="green" onclick="createAlarm()">
Ajouter
</button>

</div>

</div>

</div>

<script>

/* =========================
   NAVIGATION
========================= */

const pageNames={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function page(name){

const target=document.getElementById(name);

if(!target)return;

document.querySelectorAll(".page").forEach(function(x){
x.classList.remove("active");
});

target.classList.add("active");

document.querySelectorAll("nav button").forEach(function(x){
x.classList.remove("active");
});

const navButton=document.getElementById(
"nav"+name.charAt(0).toUpperCase()+name.slice(1)
);

if(navButton){
navButton.classList.add("active");
}

document.getElementById("title").textContent=
pageNames[name][0];

document.getElementById("subtitle").textContent=
pageNames[name][1];

try{
localStorage.setItem("lastPage",name);
}catch(e){}

}

/* =========================
   HORLOGE
========================= */

function clock(){

const d=new Date();

document.getElementById("clockTime").textContent=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

let date=d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

document.getElementById("clockDate").textContent=
date.charAt(0).toUpperCase()+date.slice(1);

}

setInterval(clock,1000);
clock();

/* =========================
   REVEILS
========================= */

let alarms=[];

try{

alarms=JSON.parse(
localStorage.getItem("myAlarms")||"[]"
);

if(!Array.isArray(alarms)){
alarms=[];
}

}catch(e){
alarms=[];
}

const dayNames={
0:"D",
1:"L",
2:"M",
3:"M",
4:"J",
5:"V",
6:"S"
};

const dayFullNames={
0:"Dimanche",
1:"Lundi",
2:"Mardi",
3:"Mercredi",
4:"Jeudi",
5:"Vendredi",
6:"Samedi"
};

let selectedDays=[];

function saveAlarms(){

try{
localStorage.setItem(
"myAlarms",
JSON.stringify(alarms)
);
}catch(e){}

}

function openAlarm(){

selectedDays=[];

document.querySelectorAll(".day-button").forEach(function(btn){
btn.classList.remove("selected");
});

document.getElementById("everyDayButton")
.classList.remove("selected");

document.getElementById("modal")
.classList.add("show");

}

function closeAlarm(){

document.getElementById("modal")
.classList.remove("show");

}

function toggleDay(day){

const index=selectedDays.indexOf(day);

if(index===-1){

selectedDays.push(day);

}else{

selectedDays.splice(index,1);

}

document.querySelectorAll(".day-button").forEach(function(btn){

const value=Number(btn.dataset.day);

btn.classList.toggle(
"selected",
selectedDays.includes(value)
);

});

document.getElementById("everyDayButton")
.classList.toggle(
"selected",
selectedDays.length===7
);

}

function toggleEveryDay(){

if(selectedDays.length===7){

selectedDays=[];

}else{

selectedDays=[0,1,2,3,4,5,6];

}

document.querySelectorAll(".day-button").forEach(function(btn){

btn.classList.toggle(
"selected",
selectedDays.includes(Number(btn.dataset.day))
);

});

document.getElementById("everyDayButton")
.classList.toggle(
"selected",
selectedDays.length===7
);

}

function createAlarm(){

const time=
document.getElementById("alarmTime").value;

const youtube=
document.getElementById("youtube").value.trim();

if(!time)return;

alarms.push({

id:Date.now(),
time:time,
enabled:true,
youtube:youtube,
days:selectedDays.slice(),
lastRing:""

});

saveAlarms();
renderAlarms();

document.getElementById("youtube").value="";

selectedDays=[];

closeAlarm();

}

function removeAlarm(id){

alarms=alarms.filter(function(a){
return a.id!==id;
});

saveAlarms();
renderAlarms();

}

function switchAlarm(id){

const a=alarms.find(function(x){
return x.id===id;
});

if(!a)return;

a.enabled=!a.enabled;

saveAlarms();
renderAlarms();

}

function getDaysText(a){

if(!a.days || a.days.length===0){
return "Une fois";
}

if(a.days.length===7){
return "Tous les jours";
}

return a.days
.slice()
.sort(function(a,b){
return a-b;
})
.map(function(d){
return dayNames[d];
})
.join(" · ");

}

function renderDays(a){

if(!a.days || a.days.length===0){

return `
<div class="alarm-days">
<span class="day active">Une fois</span>
</div>
`;

}

return `
<div class="alarm-days">
${[1,2,3,4,5,6,0].map(function(d){

return `
<span class="day ${a.days.includes(d)?"active":""}">
${dayNames[d]}
</span>
`;

}).join("")}
</div>
`;

}

function renderAlarms(){

const box=document.getElementById("alarmList");

box.innerHTML="";

if(alarms.length===0){

box.innerHTML=`
<div class="empty">
Aucun réveil<br><br>
Appuie sur + pour créer ton premier réveil.
</div>
`;

return;

}

alarms.sort(function(a,b){
return a.time.localeCompare(b.time);
});

alarms.forEach(function(a){

if(!Array.isArray(a.days)){
a.days=[];
}

const div=document.createElement("div");

div.className="alarm";

div.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">${a.time}</div>

<div class="alarm-name">

${a.enabled?"Réveil activé":"Réveil désactivé"}

${a.youtube?" · Musique":""}

</div>

${renderDays(a)}

</div>

<label class="switch">

<input
type="checkbox"
${a.enabled?"checked":""}
onchange="switchAlarm(${a.id})">

<span class="slider"></span>

</label>

</div>

<div class="alarm-actions">

${
a.youtube
?
`
<button
class="dark"
style="height:40px;padding:0 15px"
onclick="openMusic('${a.youtube.replace(/'/g,"\\'")}')">
Tester la musique
</button>
`
:""
}

<button
class="delete"
onclick="removeAlarm(${a.id})">
Supprimer
</button>

</div>

`;

box.appendChild(div);

});

}

renderAlarms();

/* =========================
   SON
========================= */

let audioCtx=null;

function ring(){

try{

audioCtx=
audioCtx||
new (window.AudioContext||
window.webkitAudioContext)();

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const now=audioCtx.currentTime;

for(let i=0;i<6;i++){

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=
i%2===0?880:660;

osc.type="sine";

gain.gain.setValueAtTime(
.001,
now+i*.35
);

gain.gain.exponentialRampToValueAtTime(
.45,
now+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.35+.3
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(now+i*.35);
osc.stop(now+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700,
300,500
]);

}

}

/* =========================
   NOTIFICATION
========================= */

function notify(title,text){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(title,{
body:text,
tag:"horloge-"+Date.now(),
requireInteraction:true
});

}catch(e){}

}

}

/* =========================
   YOUTUBE
========================= */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;

}

function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}

/* =========================
   VERIFICATION REVEILS
========================= */

setInterval(function(){

const now=new Date();

const hh=String(now.getHours()).padStart(2,"0");
const mm=String(now.getMinutes()).padStart(2,"0");

const current=hh+":"+mm;
const today=now.getDay();

alarms.forEach(function(a){

let dayOK=false;

if(!a.days || a.days.length===0){

dayOK=true;

}else{

dayOK=a.days.includes(today);

}

if(
a.enabled &&
a.time===current &&
dayOK &&
a.lastRing!==current+"-"+today
){

a.lastRing=current+"-"+today;

saveAlarms();

ring();

notify(
"Réveil",
"Il est "+current
);

if(a.youtube){

setTimeout(function(){
openMusic(a.youtube);
},1000);

}

}

});

},1000);

/* =========================
   CHRONOMETRE
   PAS DE SAUVEGARDE
========================= */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;

function chronoFormat(ms){

const m=Math.floor(ms/60000);
const s=Math.floor((ms%60000)/1000);
const c=Math.floor((ms%1000)/10);

return(
String(m).padStart(2,"0")+":"+
