<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Horloge</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button {
    font-family: inherit;
}

.app {
    width: 100%;
    height: 100dvh;
    max-width: 700px;
    margin: auto;
    background: #000;
    position: relative;
    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    height: 55px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    padding: 0 25px;
}

.menu {
    font-size: 29px;
    line-height: 1;
    cursor: pointer;
}


/* =====================================================
   CONTENU
===================================================== */

.content {
    position: absolute;

    top: 55px;
    left: 0;
    right: 0;

    bottom: 82px;

    overflow: hidden;
}


/* =====================================================
   PAGES
===================================================== */

.page {
    width: 100%;
    height: 100%;

    padding: 10px 22px;

    overflow-y: auto;
}

.hidden {
    display: none !important;
}


/* =====================================================
   MINUTEUR
===================================================== */

.timer-page {
    display: flex;
    flex-direction: column;

    height: 100%;
}


/* Roulettes */

.picker {
    flex: 0 0 auto;

    height: min(48vh, 390px);

    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    position: relative;

    margin: 0 5px;
}


/*
   Zone centrale du sélecteur
*/

.picker::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    transform:
        translateY(-50%);

    height: 76px;

    pointer-events: none;

    border-top:
        1px solid transparent;

    border-bottom:
        1px solid transparent;
}


/* Colonnes */

.column {
    height: 100%;

    overflow-y: scroll;

    scroll-snap-type:
        y mandatory;

    scrollbar-width: none;

    text-align: center;
}

.column::-webkit-scrollbar {
    display: none;
}


/* Liste */

.list {
    padding-top: calc(
        (min(48vh, 390px) - 76px) / 2
    );

    padding-bottom: calc(
        (min(48vh, 390px) - 76px) / 2
    );
}


/* Titres */

.title {
    height: 76px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 20px;

    color: #a1a1a5;

    scroll-snap-align: center;
}


/* Chiffres */

.number {
    height: 76px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: clamp(
        42px,
        12vw,
        60px
    );

    font-weight: 300;

    color: #252529;

    scroll-snap-align: center;

    transition:
        color .15s ease;
}

.number.active {
    color: #fff;
}


/* =====================================================
   BOUTONS RAPIDES
===================================================== */

.presets {
    display: flex;

    justify-content:
        center;

    gap: 14px;

    margin-top: 8px;

    flex-shrink: 0;
}

.preset {
    width: clamp(
        95px,
        28vw,
        150px
    );

    aspect-ratio: 1;

    border-radius: 50%;

    border: none;

    background: #202022;

    color: #ddd;

    font-size:
        clamp(14px, 4vw, 22px);

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.preset:active {
    transform: scale(.94);

    background: #303034;
}


/* =====================================================
   BOUTON DÉMARRER
===================================================== */

.start-area {
    flex: 1;

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    min-height: 75px;
}

.start {
    border: none;

    min-width: 205px;

    padding: 16px 35px;

    border-radius: 50px;

    background: #635bff;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}

.start:active {
    transform: scale(.96);
}

.start.pause {
    background: #393997;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 82px;

    background: #000;

    border-top:
        1px solid #171717;

    display: flex;

    align-items:
        center;

    z-index: 20;
}

.navigation button {
    flex: 1;

    height: 100%;

    border: none;

    background: none;

    color: #858589;

    font-size:
        clamp(11px, 3.5vw, 17px);

    cursor: pointer;

    position: relative;

    padding: 0 3px;
}

.navigation button.active {
    color: white;

    font-weight: bold;
}

.navigation button.active::after {
    content: "";

    position: absolute;

    bottom: 7px;

    left: 25%;
    right: 25%;

    height: 3px;

    border-radius: 5px;

    background: white;
}


/* =====================================================
   TITRES DES AUTRES PAGES
===================================================== */

.page-title {
    font-size: 34px;

    margin:
        10px 0 25px;
}


/* =====================================================
   ALARME
===================================================== */

.add-alarm-button {
    width: 100%;

    border: none;

    background: #635bff;

    color: white;

    border-radius: 18px;

    padding: 16px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    margin-bottom: 20px;
}


.alarm-card {
    background: #171719;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 12px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;
}


.alarm-time {
    font-size: 38px;

    font-weight: 300;
}


.alarm-days {
    color: #888;

    margin-top: 5px;

    font-size: 14px;
}


/* Interrupteur */

.switch {
    width: 52px;
    height: 31px;

    border-radius: 20px;

    background: #39393d;

    position: relative;

    cursor: pointer;

    flex-shrink: 0;
}

.switch::after {
    content: "";

    position: absolute;

    width: 27px;
    height: 27px;

    top: 2px;
    left: 2px;

    border-radius: 50%;

    background: white;

    transition: .2s;
}

.switch.on {
    background: #635bff;
}

.switch.on::after {
    left: 23px;
}


/* Ajouter alarme */

.alarm-form {
    background: #171719;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 15px;
}

.alarm-form input {
    width: 100%;

    background: #252527;

    color: white;

    border: none;

    border-radius: 14px;

    padding: 15px;

    font-size: 30px;

    text-align: center;

    margin-bottom: 15px;
}

.form-buttons {
    display: flex;

    gap: 10px;
}

.form-buttons button {
    flex: 1;

    border: none;

    border-radius: 14px;

    padding: 13px;

    font-size: 16px;

    cursor: pointer;
}

.save {
    background: #635bff;
    color: white;
}

.cancel {
    background: #29292b;
    color: white;
}


/* =====================================================
   HORLOGE MONDIALE
===================================================== */

.city-card {
    background: #171719;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 13px;
}

.city-name {
    font-size: 22px;
}

.city-country {
    color: #888;

    margin-top: 4px;
}

.city-time {
    font-size: 40px;

    margin-top: 10px;

    font-weight: 300;

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   CHRONOMÈTRE
===================================================== */

.stopwatch-page {
    text-align: center;

    padding-top: 70px;
}

.stopwatch-display {
    font-size:
        clamp(50px, 14vw, 76px);

    font-weight: 300;

    letter-spacing: -3px;

    font-variant-numeric:
        tabular-nums;
}


.stopwatch-buttons {
    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 55px;
}


.round {
    width: 78px;
    height: 78px;

    border-radius: 50%;

    border: none;

    background: #202022;

    color: white;

    cursor: pointer;

    font-size: 13px;
}

.round.start {
    background: #173b23;

    color: #30d158;
}

.round.stop {
    background: #421c1c;

    color: #ff453a;
}


.laps {
    margin-top: 30px;

    text-align: left;
}

.lap {
    display: flex;

    justify-content:
        space-between;

    padding: 14px 5px;

    border-bottom:
        1px solid #29292b;
}

.lap span {
    color: #888;
}


/* =====================================================
   PETITS ÉCRANS
===================================================== */

@media (max-height: 700px) {

    .header {
        height: 45px;
    }

    .content {
        top: 45px;
    }

    .picker {
        height: 320px;
    }

    .list {
        padding-top: 122px;
        padding-bottom: 122px;
    }

    .number,
    .title {
        height: 64px;
    }

    .number {
        font-size: 47px;
    }

    .presets {
        margin-top: 3px;
    }

    .preset {
        width: 105px;
    }

    .start-area {
        min-height: 65px;
    }

    .navigation {
        height: 70px;
    }

}


/* =====================================================
   TRÈS PETITS ÉCRANS
===================================================== */

@media (max-width: 360px) {

    .page {
        padding-left: 12px;
        padding-right: 12px;
    }

    .picker {
        margin: 0;
    }

    .preset {
        width: 92px;
    }

    .navigation button {
        font-size: 10px;
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="menu">
            ⋮
        </div>

    </header>


    <!-- =================================================
         CONTENU
    ================================================== -->

    <main class="content">


        <!-- =============================================
             MINUTEUR
        ============================================== -->

        <section
            id="timerPage"
            class="page timer-page">


            <div class="picker">


                <!-- HEURES -->

                <div
                    class="column"
                    id="hoursColumn">

                    <div
                        class="list"
                        id="hoursList">
                    </div>

                </div>


                <!-- MINUTES -->

                <div
                    class="column"
                    id="minutesColumn">

                    <div
                        class="list"
                        id="minutesList">
                    </div>

                </div>


                <!-- SECONDES -->

                <div
                    class="column"
                    id="secondsColumn">

                    <div
                        class="list"
                        id="secondsList">
                    </div>

                </div>


            </div>


            <!-- BOUTONS RAPIDES -->

            <div class="presets">

                <button
                    class="preset"
                    onclick="setTimer(0,10,0)">

                    00:10:00

                </button>


                <button
                    class="preset"
                    onclick="setTimer(0,15,0)">

                    00:15:00

                </button>


                <button
                    class="preset"
                    onclick="setTimer(0,30,0)">

                    00:30:00

                </button>

            </div>


            <!-- DÉMARRER -->

            <div class="start-area">

                <button
                    id="timerButton"
                    class="start"
                    onclick="toggleTimer()">

                    Démarrer

                </button>

            </div>


        </section>


        <!-- =============================================
             ALARME
        ============================================== -->

        <section
            id="alarmPage"
            class="page hidden">


            <h1 class="page-title">
                Alarme
            </h1>


            <button
                class="add-alarm-button"
                onclick="showAlarmForm()">

                + Ajouter une alarme

            </button>


            <!-- FORMULAIRE -->

            <div
                id="alarmForm"
                class="alarm-form hidden">

                <input
                    id="alarmTime"
                    type="time"
                    value="07:00">

                <div class="form-buttons">

                    <button
                        class="cancel"
                        onclick="hideAlarmForm()">

                        Annuler

                    </button>

                    <button
                        class="save"
                        onclick="addAlarm()">

                        Enregistrer

                    </button>

                </div>

            </div>


            <!-- LISTE -->

            <div id="alarmList">

                <!-- Les alarmes apparaissent ici -->

            </div>


        </section>


        <!-- =============================================
             HORLOGE MONDIALE
        ============================================== -->

        <section
            id="worldPage"
            class="page hidden">


            <h1 class="page-title">
                Horloge mondiale
            </h1>


            <div class="city-card">

                <div class="city-name">
                    🇫🇷 Paris
                </div>

                <div class="city-country">
                    France
                </div>

                <div
                    id="parisTime"
                    class="city-time">

                    --:--:--

                </div>

            </div>


            <div class="city-card">

                <div class="city-name">
                    🇺🇸 New York
                </div>

                <div class="city-country">
                    États-Unis
                </div>

                <div
                    id="newYorkTime"
                    class="city-time">

                    --:--:--

                </div>

            </div>


            <div class="city-card">

                <div class="city-name">
                    🇯🇵 Tokyo
                </div>

                <div class="city-country">
                    Japon
                </div>

                <div
                    id="tokyoTime"
                    class="city-time">

                    --:--:--

                </div>

            </div>


        </section>


        <!-- =============================================
             CHRONOMÈTRE
        ============================================== -->

        <section
            id="stopwatchPage"
            class="page stopwatch-page hidden">


            <div
                id="stopwatchDisplay"
                class="stopwatch-display">

                00:00:00.00

            </div>


            <div class="stopwatch-buttons">


                <button
                    class="round"
                    onclick="addLap()">

                    Tour

                </button>


                <button
                    id="stopwatchButton"
                    class="round start"
                    onclick="toggleStopwatch()">

                    Démarrer

                </button>


                <button
                    class="round"
                    onclick="resetStopwatch()">

                    Reset

                </button>


            </div>


            <div
                id="laps"
                class="laps">
            </div>


        </section>


    </main>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <nav class="navigation">


        <button
            onclick="openPage('alarmPage',this)">

            Alarme

        </button>


        <button
            onclick="openPage('worldPage',this)">

            Horloge mondiale

        </button>


        <button
            onclick="openPage('stopwatchPage',this)">

            Chronomètre

        </button>


        <button
            class="active"
            onclick="openPage('timerPage',this)">

            Minuteur

        </button>


    </nav>


</div>



<script>

/* =====================================================
   NAVIGATION
===================================================== */

function openPage(pageId, button) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.add("hidden");

        });


    document
        .getElementById(pageId)
        .classList.remove("hidden");


    document
        .querySelectorAll(".navigation button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");

}


/* =====================================================
   CRÉATION DES ROULETTES
===================================================== */

function createWheel(
    listId,
    title,
    maximum
) {

    const list =
        document.getElementById(
            listId
        );


    /* Titre */

    const titleElement =
        document.createElement(
            "div"
        );

    titleElement.className =
        "title";

    titleElement.textContent =
        title;

    list.appendChild(
        titleElement
    );


    /* Chiffres */

    for (
        let i = 0;
        i <= maximum;
        i++
    ) {

        const number =
            document.createElement(
                "div"
            );


        number.className =
            "number";


        number.dataset.value =
            i;


        number.textContent =
            String(i).padStart(
                2,
                "0"
            );


        list.appendChild(
            number
        );

    }

}


/*
    IMPORTANT :

    Tout commence à 00:00:00
*/

createWheel(
    "hoursList",
    "Heures",
    23
);

createWheel(
    "minutesList",
    "Minutes",
    59
);

createWheel(
    "secondsList",
    "Secondes",
    59
);


/* =====================================================
   VALEUR SÉLECTIONNÉE
===================================================== */

function getValue(columnId) {

    const column =
        document.getElementById(
            columnId
        );


    const itemHeight =
        column
            .querySelector(".number")
            .offsetHeight;


    /*
       +1 car le premier élément
       est le titre.
    */

    const position =
        Math.round(
            column.scrollTop /
            itemHeight
        );


    return Math.max(
        0,
        position
    );

}


/* =====================================================
   SÉLECTION VISUELLE
===================================================== */

function updateSelection() {

    document
        .querySelectorAll(".column")
        .forEach(column => {

            const number =
                column.querySelector(
                    ".number"
                );

            if (!number) return;


            const height =
                number.offsetHeight;


            const position =
                Math.round(
                    column.scrollTop /
                    height
                );


            column
                .querySelectorAll(".number")
                .forEach((item, index) => {

                    item.classList.toggle(
                        "active",
                        index === position
                    );

                });

        });

}


document
    .querySelectorAll(".column")
    .forEach(column => {

        column.addEventListener(
            "scroll",
            () => {

                requestAnimationFrame(
                    updateSelection
                );

            }
        );

    });


/* =====================================================
   CHOISIR UNE DURÉE
===================================================== */

function setTimer(
    hours,
    minutes,
    seconds
) {

    const hourColumn =
        document.getElementById(
            "hoursColumn"
        );

    const minuteColumn =
        document.getElementById(
            "minutesColumn"
        );

    const secondColumn =
        document.getElementById(
            "secondsColumn"
        );


    const height =
        hourColumn
            .querySelector(".number")
            .offsetHeight;


    hourColumn.scrollTop =
        hours * height;


    minuteColumn.scrollTop =
        minutes * height;


    secondColumn.scrollTop =
        seconds * height;


    updateSelection();

}


/* =====================================================
   MINUTEUR
===================================================== */

let timerRunning =
    false;

let timerRemaining =
    0;

let timerEnd =
    0;

let timerInterval =
    null;


function getSelectedTime() {

    const hours =
        getValue(
            "hoursColumn"
        );


    const minutes =
        getValue(
            "minutesColumn"
        );


    const seconds =
        getValue(
            "secondsColumn"
        );


    return (
        hours * 3600000 +
        minutes * 60000 +
        seconds * 1000
    );

}


function toggleTimer() {

    const button =
        document.getElementById(
            "timerButton"
        );


    /* DÉMARRER */

    if (!timerRunning) {


        if (
            timerRemaining <= 0
        ) {

            timerRemaining =
                getSelectedTime();

        }


        if (
            timerRemaining <= 0
        ) {

            alert(
                "Choisis une durée avant de démarrer."
            );

            return;

        }


        timerEnd =
            Date.now() +
            timerRemaining;


        timerRunning =
            true;


        button.textContent =
            "Pause";


        button.classList.add(
            "pause"
        );


        timerInterval =
            setInterval(
                updateTimer,
                100
            );

    }


    /* PAUSE */

    else {

        timerRemaining =
            Math.max(
                0,
                timerEnd -
                Date.now()
            );


        timerRunning =
            false;


        clearInterval(
            timerInterval
        );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "pause"
        );

    }

}


function updateTimer() {

    timerRemaining =
        timerEnd -
        Date.now();


    if (
        timerRemaining <= 0
    ) {

        timerRemaining =
            0;


        timerRunning =
            false;


        clearInterval(
            timerInterval
        );


        const button =
            document.getElementById(
                "timerButton"
            );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "pause"
        );


        if (
            navigator.vibrate
        ) {

            navigator.vibrate([
                300,
                150,
                300,
                150,
                500
            ]);

        }


        playSound();


        alert(
            "⏰ Temps écoulé !"
        );

    }

}


/* =====================================================
   SON
===================================================== */

function playSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audio =
            new AudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.25;


        oscillator.connect(
            gain
        );


        gain.connect(
            audio.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.stop();

            },
            800
        );

    }

    catch (error) {

        console.log(
            "Son indisponible"
        );

    }

}


/* =====================================================
   HORLOGE MONDIALE
===================================================== */

function updateWorldClocks() {

    const now =
        new Date();


    function time(
        timezone
    ) {

        return new Intl.DateTimeFormat(
            "fr-FR",
            {
                timeZone:
                    timezone,

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"
            }
        ).format(now);

    }


    document.getElementById(
        "parisTime"
    ).textContent =
        time(
            "Europe/Paris"
        );


    document.getElementById(
        "newYorkTime"
    ).textContent =
        time(
            "America/New_York"
        );


    document.getElementById(
        "tokyoTime"
    ).textContent =
        time(
            "Asia/Tokyo"
        );

}


setInterval(
    updateWorldClocks,
    1000
);

updateWorldClocks();


/* =====================================================
   ALARMES
===================================================== */

let alarms = [];


/*
   Afficher le formulaire
*/

function showAlarmForm() {

    document
        .getElementById(
            "alarmForm"
        )
        .classList.remove(
            "hidden"
        );

}


/*
   Cacher le formulaire
*/

function hideAlarmForm() {

    document
        .getElementById(
            "alarmForm"
        )
        .classList.add(
            "hidden"
        );

}


/*
   Ajouter une alarme
*/

function addAlarm() {

    const input =
        document.getElementById(
            "alarmTime"
        );


    if (!input.value) {

        return;

    }


    const alarm = {

        id:
            Date.now(),

        time:
            input.value,

        enabled:
            true

    };


    alarms.push(
        alarm
    );


    renderAlarms();


    hideAlarmForm();


    checkAlarms();

}


/*
   Afficher les alarmes
*/

function renderAlarms() {

    const list =
        document.getElementById(
            "alarmList"
        );


    list.innerHTML =
        "";


    if (
        alarms.length === 0
    ) {

        list.innerHTML =

            `<div class="alarm-card">
                <div>
                    <div style="font-size:18px">
                        Aucune alarme
                    </div>

                    <div class="alarm-days">
                        Ajoute une heure de réveil.
                    </div>
                </div>
            </div>`;

        return;

    }


    alarms.forEach(
        alarm => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "alarm-card";


            card.innerHTML = `

                <div>

                    <div class="alarm-time">
                        ${alarm.time}
                    </div>

                    <div class="alarm-days">
                        Tous les jours
                    </div>

                </div>

                <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                ">

                    <div
                        class="switch
                        ${alarm.enabled ? "on" : ""}"
                        onclick="
                            toggleAlarm(${alarm.id})
                        ">
                    </div>

                    <button
                        onclick="
                            deleteAlarm(${alarm.id})
                        "
                        style="
                            border:none;
                            background:none;
                            color:#777;
                            font-size:20px;
                            cursor:pointer;
                        ">

                        ×

                    </button>

                </div>
            `;


            list.appendChild(
                card
            );

        }
    );

}


/*
   Activer / désactiver
*/

function toggleAlarm(id) {

    const alarm =
        alarms.find(
            a => a.id === id
        );


    if (!alarm) return;


    alarm.enabled =
        !alarm.enabled;


    renderAlarms();

}


/*
   Supprimer
*/

function deleteAlarm(id) {

    alarms =
        alarms.filter(
            alarm =>
                alarm.id !== id
        );


    renderAlarms();

}


/*
   Vérifier les alarmes
*/

let lastAlarm =
    "";


function checkAlarms() {

    const now =
        new Date();


    const hour =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minute =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const current =
        hour +
        ":" +
        minute;


    if (
        current === lastAlarm
    ) {

        return;

    }


    lastAlarm =
        current;


    alarms.forEach(
        alarm => {

            if (
                alarm.enabled &&
                alarm.time === current
            ) {

                playSound();

                if (
                    navigator.vibrate
                ) {

                    navigator.vibrate([
                        500,
                        200,
                        500,
                        200,
                        800
                    ]);

                }


                alert(
                    "⏰ Réveil !"
                );

            }

        }
    );

}


setInterval(
    checkAlarms,
    1000
);


/* =====================================================
   CHRONOMÈTRE
===================================================== */

let stopwatchRunning =
    false;

let stopwatchStart =
    0;

let stopwatchElapsed =
    0;

let stopwatchInterval =
    null;

let lapNumber =
    0;


function updateStopwatch() {

    let elapsed =
        stopwatchElapsed;


    if (
        stopwatchRunning
    ) {

        elapsed +=
            performance.now() -
            stopwatchStart;

    }


    const hours =
        Math.floor(
            elapsed / 3600000
        );


    const minutes =
        Math.floor(
            elapsed / 60000
        ) % 60;


    const seconds =
        Math.floor(
            elapsed / 1000
        ) % 60;


    const centiseconds =
        Math.floor(
            elapsed / 10
        ) % 100;


    document.getElementById(
        "stopwatchDisplay"
    ).textContent =

        String(hours)
            .padStart(2, "0")

        + ":" +

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0")

        + "." +

        String(centiseconds)
            .padStart(2, "0");

}


function toggleStopwatch() {

    const button =
        document.getElementById(
            "stopwatchButton"
        );


    if (
        !stopwatchRunning
    ) {

        stopwatchStart =
            performance.now();


        stopwatchRunning =
            true;


        button.textContent =
            "Pause";


        button.classList.remove(
            "start"
        );


        button.classList.add(
            "stop"
        );


        stopwatchInterval =
            setInterval(
                updateStopwatch,
                20
            );

    }


    else {

        stopwatchElapsed +=
            performance.now() -
            stopwatchStart;


        stopwatchRunning =
            false;


        clearInterval(
            stopwatchInterval
        );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "stop"
        );


        button.classList.add(
            "start"
        );


        updateStopwatch();

    }

}


function resetStopwatch() {

    stopwatchRunning =
        false;


    clearInterval(
        stopwatchInterval
    );


    stopwatchElapsed =
        0;


    lapNumber =
        0;


    document.getElementById(
        "laps"
    ).innerHTML =
        "";


    const button =
        document.getElementById(
            "stopwatchButton"
        );


    button.textContent =
        "Démarrer";


    button.classList.remove(
        "stop"
    );


    button.classList.add(
        "start"
    );


    updateStopwatch();

}


function addLap() {

    if (
        !stopwatchRunning
    ) {

        return;

    }


    lapNumber++;


    const lap =
        document.createElement(
            "div"
        );


    lap.className =
        "lap";


    lap.innerHTML = `

        <span>
            Tour ${lapNumber}
        </span>

        <strong>
            ${
                document
                .getElementById(
                    "stopwatchDisplay"
                )
                .textContent
            }
        </strong>

    `;


    document.getElementById(
        "laps"
    ).prepend(
        lap
    );

}


/* =====================================================
   INITIALISATION
===================================================== */


/*
   IMPORTANT :
   Le minuteur commence bien à :

   00 : 00 : 00
*/

setTimer(
    0,
    0,
    0
);


renderAlarms();


updateStopwatch();

</script>
