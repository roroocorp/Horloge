<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Waveify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <span class="brand-mark">W</span>
        <span>Waveify</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-page="home">
          <span>⌂</span> Accueil
        </button>

        <button class="nav-item" data-page="recommendations">
          <span>✦</span> Recommandations
        </button>

        <button class="nav-item" data-page="liked">
          <span>♥</span> J'aime
        </button>

        <button class="nav-item" data-page="disliked">
          <span>👎</span> Pas aimé
        </button>

        <button class="nav-item" data-page="playlist">
          <span>♫</span> Ma playlist
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="secondary-btn" id="resetData">
          ↻ Réinitialiser mes données
        </button>

        <p>
          Tes préférences sont sauvegardées
          dans ce navigateur.
        </p>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <header class="topbar">

        <button class="icon-btn mobile-menu" id="menuBtn">
          ☰
        </button>

        <div class="search-wrap">
          <span>⌕</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Rechercher une musique..."
            autocomplete="off"
          >
        </div>

        <button class="avatar" id="profileBtn">
          W
        </button>

      </header>


      <!-- APP CONTENT -->
      <section id="page" class="content"></section>

    </main>

  </div>


  <!-- YOUTUBE PLAYER -->
  <div id="youtube-player"></div>


  <!-- BOTTOM PLAYER -->
  <div class="player">

    <div class="now-playing">

      <img id="playerCover" src="" alt="">

      <div class="now-text">
        <strong id="playerTitle">
          Choisis une musique
        </strong>

        <span id="playerArtist">
          Waveify
        </span>
      </div>

    </div>


    <div class="player-center">

      <div class="controls">

        <button
          class="control-btn"
          id="shuffleBtn"
          title="Lecture aléatoire"
        >
          🔀
        </button>

        <button
          class="control-btn"
          id="prevBtn"
          title="Précédent"
        >
          ⏮
        </button>

        <button
          class="play-btn"
          id="playBtn"
          title="Lecture"
        >
          ▶
        </button>

        <button
          class="control-btn"
          id="nextBtn"
          title="Suivant"
        >
          ⏭
        </button>

        <button
          class="control-btn"
          id="repeatBtn"
          title="Répéter"
        >
          🔁
        </button>

      </div>


      <div class="progress-row">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <div class="player-actions">

      <button
        class="small-action"
        id="infiniteBtn"
        title="Mode infini"
      >
        ♾️
      </button>

      <button
        class="small-action"
        id="likeBtn"
        title="J'aime"
      >
        ♡
      </button>

      <button
        class="small-action"
        id="dislikeBtn"
        title="Pas aimé"
      >
        👎
      </button>

      <button
        class="small-action"
        id="playlistBtn"
        title="Ma playlist"
      >
        ＋
      </button>

      <div class="volume">
        <span>🔊</span>

        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="70"
        >
      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div class="toast" id="toast"></div>


  <!-- YOUTUBE API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- WAVEIFY -->
  <script src="script.js"></script>

</body>
</html>
