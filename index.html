<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waveify</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar">

        <div class="logo">
            <span>W</span> Waveify
        </div>

        <nav class="navigation">
            <button class="nav-btn active" data-page="home">
                🏠 <span>Accueil</span>
            </button>

            <button class="nav-btn" data-page="library">
                ➕ <span>Bibliothèque</span>
            </button>

            <button class="nav-btn" data-page="favorites">
                ❤️ <span>Favori</span>
            </button>
        </nav>

    </aside>


    <!-- =========================
         CONTENU PRINCIPAL
    ========================== -->
    <main class="main-content">

        <!-- ACCUEIL -->
        <section id="home-page" class="page active">

            <header class="page-header">
                <h1>Bienvenue sur Waveify</h1>
                <p>Écoute tes musiques préférées.</p>
            </header>

            <div class="section-title">
                <h2>🎵 Tes musiques</h2>
            </div>

            <div id="home-music-grid" class="music-grid">
                <!-- Les musiques seront ajoutées automatiquement par JavaScript -->
            </div>

        </section>


        <!-- BIBLIOTHÈQUE -->
        <section id="library-page" class="page">

            <header class="page-header">
                <h1>Bibliothèque</h1>
                <p>Retrouve toutes tes musiques.</p>
            </header>

            <div id="library-music-grid" class="music-grid">
                <!-- Les musiques seront ajoutées automatiquement par JavaScript -->
            </div>

        </section>


        <!-- FAVORIS -->
        <section id="favorites-page" class="page">

            <header class="page-header">
                <h1>❤️ Favoris</h1>
                <p>Tes musiques préférées.</p>
            </header>

            <div id="favorites-music-grid" class="music-grid">
                <!-- Les favoris seront ajoutés automatiquement par JavaScript -->
            </div>

            <div id="empty-favorites" class="empty-state">
                <div class="empty-icon">❤️</div>
                <h2>Aucun favori</h2>
                <p>Ajoute des musiques à tes favoris pour les retrouver ici.</p>
            </div>

        </section>

    </main>


    <!-- =========================
         LECTEUR
    ========================== -->
    <div class="player">

        <div class="player-info">

            <img
                id="player-thumbnail"
                src=""
                alt="Miniature"
            >

            <div class="player-text">
                <strong id="player-title">Aucune musique</strong>
                <span id="player-artist">Waveify</span>
            </div>

        </div>


        <div class="player-controls">

            <div class="main-controls">

                <button
                    id="previous-btn"
                    class="control-btn"
                    aria-label="Musique précédente"
                >
                    ⏮️
                </button>

                <button
                    id="play-btn"
                    class="play-btn"
                    aria-label="Lecture"
                >
                    ▶️
                </button>

                <button
                    id="next-btn"
                    class="control-btn"
                    aria-label="Musique suivante"
                >
                    ⏭️
                </button>

            </div>

            <div class="progress-container">

                <span id="current-time">0:00</span>

                <input
                    id="progress-bar"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">0:00</span>

            </div>

        </div>


        <div class="player-volume">

            <span>🔊</span>

            <input
                id="volume-bar"
                type="range"
                min="0"
                max="100"
                value="100"
            >

        </div>

    </div>


    <!-- =========================
         YOUTUBE PLAYER INVISIBLE
    ========================== -->
    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>


    <!-- =========================
         SCRIPT YOUTUBE
    ========================== -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- SCRIPT WAVEIFY -->
    <script src="script.js"></script>

</body>
</html>
