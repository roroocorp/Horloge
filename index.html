<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
min-height:100vh;
}

.app{
width:100%;
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:95px;
}

header{
padding:30px 24px 12px;
}

h1{
font-size:34px;
margin:0;
font-weight:700;
}

.subtitle{
color:#777;
margin-top:5px;
font-size:15px;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
font-variant-numeric:tabular-nums;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:3px;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
flex-shrink:0;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked + .slider{
background:#32d47a;
}

.switch input:checked + .slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
padding:8px;
}

.music-button{
background:#222;
color:#fff;
border:0;
border-radius:12px;
height:40px;
padding:0 14px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
line-height:1.6;
}

/* =========================
   HORLOGE
========================= */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
font-variant-numeric:tabular-nums;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* =========================
   CHRONO
========================= */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

.lap{
padding:13px 5px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
color:#aaa;
}

/* =========================
   MINUTEUR
========================= */

.inputs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.inputs input{
width:100%;
height:60px;
background:#171717;
color:#fff;
border:1px solid #292929;
border-radius:17px;
text-align:center;
font-size:22px;
outline:none;
}

.label{
text-align:center;
font-size:11px;
color:#777;
margin-top:5px;
}

/* =========================
   NAVIGATION
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
}

nav button.active{
color:#32d47a;
}

.icon{
font-size:25px;
}

/* =========================
   MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type="time"]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type="text"]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
color:#fff;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

@media(max-width:380px){
.clock-time{font-size:64px}
.big-number{font-size:58px}
.alarm-time{font-size:46px}
}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>


<!-- REVEILS -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button class="add" onclick="openAlarm()">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>


<!-- HORLOGE -->

<section id="clock" class="page">

<div class="clock">

<div id="clockTime" class="clock-time">
00:00:00
</div>

<div id="clockDate" class="clock-date"></div>

</div>

</section>


<!-- CHRONO -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button class="dark" onclick="lap()">
Tour
</button>

<button id="chronoStart" class="green" onclick="startChrono()">
Démarrer
</button>

</div>

<button class="dark full" onclick="resetChrono()">
Réinitialiser
</button>

<div id="laps"></div>

</section>


<!-- MINUTEUR -->

<section id="timer" class="page">

<div id="timerDisplay" class="big-number">
00:05:00
</div>

<div class="inputs">

<div>
<input id="hours" type="number" min="0" value="0">
<div class="label">HEURES</div>
</div>

<div>
<input id="minutes" type="number" min="0" max="59" value="5">
<div class="label">MINUTES</div>
</div>

<div>
<input id="seconds" type="number" min="0" max="59" value="0">
<div class="label">SECONDES</div>
</div>

</div>

<button id="timerStart" class="green full" onclick="startTimer()">
Démarrer
</button>

<button class="dark full" onclick="resetTimer()">
Réinitialiser
</button>

</section>


<!-- NAVIGATION -->

<nav>

<button id="navAlarms" class="active" onclick="showPage('alarms')">
<span class="icon">⏰</span>
Réveils
</button>

<button id="navClock" onclick="showPage('clock')">
<span class="icon">🕐</span>
Horloge
</button>

<button id="navChrono" onclick="showPage('chrono')">
<span class="icon">⏱️</span>
Chrono
</button>

<button id="navTimer" onclick="showPage('timer')">
<span class="icon">⌛</span>
Minuteur
</button>

</nav>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input id="alarmTime" type="time" value="07:00">

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button class="dark" onclick="closeAlarm()">
Annuler
</button>

<button class="green" onclick="createAlarm()">
Ajouter
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   NAVIGATION
===================================================== */

const pageNames = {
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function showPage(name){

document.querySelectorAll(".page")
.forEach(el=>el.classList.remove("active"));

document.getElementById(name)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(el=>el.classList.remove("active"));

const navButton =
document.getElementById(
"nav"+
name.charAt(0).toUpperCase()+
name.slice(1)
);

if(navButton){
navButton.classList.add("active");
}

document.getElementById("title")
.textContent=pageNames[name][0];

document.getElementById("subtitle")
.textContent=pageNames[name][1];

localStorage.setItem("lastPage",name);
}


/* =====================================================
   HORLOGE
===================================================== */

function updateClock(){

const d=new Date();

const time=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

document.getElementById("clockTime")
.textContent=time;

let date=d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

date=date.charAt(0).toUpperCase()+date.slice(1);

document.getElementById("clockDate")
.textContent=date;
}

updateClock();
setInterval(updateClock,1000);


/* =====================================================
   NOTIFICATIONS
===================================================== */

function askNotification(){

if(
"Notification" in window &&
Notification.permission==="default"
){

Notification.requestPermission().catch(()=>{});

}

}


/* =====================================================
   REVEILS
===================================================== */

let alarms=[];

try{

alarms=JSON.parse(
localStorage.getItem("myAlarms")||"[]"
);

if(!Array.isArray(alarms)){
alarms=[];
}

}catch(e){

alarms=[];

}


function saveAlarms(){

localStorage.setItem(
"myAlarms",
JSON.stringify(alarms)
);

}


function openAlarm(){

askNotification();

document.getElementById("modal")
.classList.add("show");

}


function closeAlarm(){

document.getElementById("modal")
.classList.remove("show");

}


function createAlarm(){

const time=
document.getElementById("alarmTime").value;

if(!time)return;

const youtube=
document.getElementById("youtube").value.trim();

alarms.push({

id:Date.now(),

time:time,

enabled:true,

youtube:youtube,

lastRing:""

});

saveAlarms();

renderAlarms();

document.getElementById("youtube").value="";

closeAlarm();

}


function removeAlarm(id){

alarms=alarms.filter(a=>a.id!==id);

saveAlarms();

renderAlarms();

}


function switchAlarm(id){

const alarm=
alarms.find(a=>a.id===id);

if(!alarm)return;

alarm.enabled=!alarm.enabled;

saveAlarms();

renderAlarms();

}


function renderAlarms(){

const list=
document.getElementById("alarmList");

list.innerHTML="";

if(alarms.length===0){

list.innerHTML=`
<div class="empty">
Aucun réveil<br><br>
Appuie sur + pour créer ton premier réveil.
</div>
`;

return;
}

alarms.sort((a,b)=>
a.time.localeCompare(b.time)
);

alarms.forEach(alarm=>{

const div=document.createElement("div");

div.className="alarm";

div.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">
${alarm.time}
</div>

<div class="alarm-name">
${alarm.enabled
?"Réveil activé"
:"Réveil désactivé"}

${alarm.youtube
?" · 🎵 Musique YouTube"
:""}
</div>

</div>

<label class="switch">

<input
type="checkbox"
${alarm.enabled?"checked":""}
onchange="switchAlarm(${alarm.id})">

<span class="slider"></span>

</label>

</div>

<div class="alarm-actions">

${
alarm.youtube
?
`<button
class="music-button"
onclick="openMusic('${escapeJS(alarm.youtube)}')">
🎵 Tester
</button>`
:""
}

<button
class="delete"
onclick="removeAlarm(${alarm.id})">
Supprimer
</button>

</div>
`;

list.appendChild(div);

});

}


function escapeJS(text){

return text
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


renderAlarms();


/* =====================================================
   MUSIQUE YOUTUBE
===================================================== */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;
}


function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}


/* =====================================================
   SON
===================================================== */

let audioContext=null;

function playAlarmSound(){

try{

audioContext=
audioContext||
new(window.AudioContext||
window.webkitAudioContext)();

if(audioContext.state==="suspended"){
audioContext.resume();
}

const now=audioContext.currentTime;

for(let i=0;i<8;i++){

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.value=
i%2===0?880:660;

gain.gain.setValueAtTime(
0.001,
now+i*0.4
);

gain.gain.exponentialRampToValueAtTime(
0.45,
now+i*0.4+0.04
);

gain.gain.exponentialRampToValueAtTime(
0.001,
now+i*0.4+0.32
);

oscillator.connect(gain);
gain.connect(audioContext.destination);

oscillator.start(now+i*0.4);
oscillator.stop(now+i*0.4+0.34);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700
]);

}

}


function notifyAlarm(time){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(
"⏰ Réveil",
{
body:"Il est "+time,
tag:"alarm-"+time,
requireInteraction:true
}
);

}catch(e){}

}

}


/* =====================================================
   VERIFICATION DES REVEILS
===================================================== */

setInterval(()=>{

const now=new Date();

const current=
String(now.getHours()).padStart(2,"0")+
":"+
String(now.getMinutes()).padStart(2,"0");

const day=
now.getFullYear()+"-"+
now.getMonth()+"-"+
now.getDate();

let changed=false;

alarms.forEach(alarm=>{

if(
alarm.enabled &&
alarm.time===current &&
alarm.lastRing!==day
){

alarm.lastRing=day;

changed=true;

playAlarmSound();

notifyAlarm(current);

if(alarm.youtube){

setTimeout(()=>{
openMusic(alarm.youtube);
},1000);

}

}

});

if(changed){
saveAlarms();
}

},1000);


/* =====================================================
   CHRONOMETRE
===================================================== */

let chronoRunning=false;
let chronoElapsed=0;
let chronoStartTime=0;
let chronoInterval=null;


function chronoFormat(ms){

ms=Math.max(0,ms);

const minutes=
Math.floor(ms/60000);

const seconds=
Math.floor((ms%60000)/1000);

const centiemes=
Math.floor((ms%1000)/10);

return(
String(minutes).padStart(2,"0")+
":"+
String(seconds).padStart(2,"0")+
"."+
String(centiemes).padStart(2,"0")
);

}


function getChronoTime(){

if(chronoRunning){

return chronoElapsed+
(Date.now()-chronoStartTime);

}

return chronoElapsed;

}


function saveChrono(){

/*
IMPORTANT :
quand le chrono tourne, on sauvegarde
le temps déjà écoulé au moment exact
de la sauvegarde.
*/

const current=getChronoTime();

const data={

running:chronoRunning,

elapsed:current,

savedAt:Date.now()

};

/*
On remet le point de départ à maintenant.
Cela évite les problèmes après fermeture
et réouverture du navigateur.
*/

if(chronoRunning){

chronoElapsed=current;

chronoStartTime=Date.now();

data.elapsed=chronoElapsed;

data.startTime=chronoStartTime;

}else{

data.elapsed=chronoElapsed;

data.startTime=0;

}

localStorage.setItem(
"horlogeChrono",
JSON.stringify(data)
);

}


function updateChrono(){

document.getElementById("chronoDisplay")
.textContent=
chronoFormat(getChronoTime());

}


function startChrono(){

if(!chronoRunning){

chronoStartTime=Date.now();

chronoRunning=true;

document.getElementById("chronoStart")
.textContent="Pause";

clearInterval(chronoInterval);

chronoInterval=
setInterval(updateChrono,30);

}else{

chronoElapsed=getChronoTime();

chronoRunning=false;

clearInterval(chronoInterval);

chronoInterval=null;

document.getElementById("chronoStart")
.textContent="Démarrer";

}

saveChrono();

updateChrono();

}


function lap(){

if(!chronoRunning)return;

const value=getChronoTime();

const div=document.createElement("div");

div.className="lap";

div.innerHTML=`
<span>Tour</span>
<span>${chronoFormat(value)}</span>
`;

document.getElementById("laps")
.prepend(div);

}


function resetChrono(){

clearInterval(chronoInterval);

chronoInterval=null;

chronoRunning=false;

chronoElapsed=0;

chronoStartTime=0;

document.getElementById("chronoDisplay")
.textContent="00:00.00";

document.getElementById("chronoStart")
.textContent="Démarrer";

document.getElementById("laps")
.innerHTML="";

localStorage.removeItem("horlogeChrono");

}


/* =====================================================
   CHARGEMENT DU CHRONO
===================================================== */

function loadChrono(){

try{

const saved=
localStorage.getItem("horlogeChrono");

if(!saved){

updateChrono();
return;
}

const data=JSON.parse(saved);

chronoElapsed=
Number(data.elapsed)||0;

chronoRunning=
data.running===true;

/*
Si le chrono était en marche :
le temps enregistré est le dernier
temps connu.
On repart maintenant.
*/

if(chronoRunning){

chronoStartTime=Date.now();

document.getElementById("chronoStart")
.textContent="Pause";

clearInterval(chronoInterval);

chronoInterval=
setInterval(updateChrono,30);

}else{

chronoStartTime=0;

document.getElementById("chronoStart")
.textContent="Démarrer";

}

updateChrono();

}catch(e){

chronoRunning=false;
chronoElapsed=0;
chronoStartTime=0;

updateChrono();

}

}


/*
Sauvegarde régulièrement.
Même si Android suspend la page,
le dernier état reste enregistré.
*/

setInterval(()=>{

if(chronoRunning){
saveChrono();
}

},1000);


/*
Sauvegarde avant de quitter.
*/

window.addEventListener("pagehide",saveChrono);

window.addEventListener("beforeunload",saveChrono);

document.addEventListener(
"visibilitychange",
()=>{
saveChrono();
}
);


/* =====================================================
   MINUTEUR
===================================================== */

let timerRunning=false;
let timerRemaining=300;
let timerEnd=0;
let timerInterval=null;


function timerFormat(seconds){

seconds=Math.max(0,seconds);

const h=
Math.floor(seconds/3600);

const m=
Math.floor((seconds%3600)/60);

const s=
seconds%60;

return(
String(h).padStart(2,"0")+
":"+
String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0")
);

}


function saveTimer(){

localStorage.setItem(
"timerState",
JSON.stringify({

running:timerRunning,

remaining:timerRunning
?
Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
)
:
timerRemaining,

end:timerEnd

})
);

}


function updateTimer(){

if(timerRunning){

timerRemaining=
Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

}

document.getElementById("timerDisplay")
.textContent=
timerFormat(timerRemaining);

}


function startTimer(){

if(timerRunning){

timerRemaining=
Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

timerRunning=false;

clearInterval(timerInterval);

timerInterval=null;

document.getElementById("timerStart")
.textContent="Reprendre";

saveTimer();

return;

}


if(timerRemaining<=0){

const h=
Number(document.getElementById("hours").value)||0;

const m=
Number(document.getElementById("minutes").value)||0;

const s=
Number(document.getElementById("seconds").value)||0;

timerRemaining=
h*3600+m*60+s;

}


if(timerRemaining<=0)return;


timerEnd=
Date.now()+
timerRemaining*1000;

timerRunning=true;

document.getElementById("timerStart")
.textContent="Pause";

clearInterval(timerInterval);

timerInterval=
setInterval(()=>{

updateTimer();

if(timerRemaining<=0){

clearInterval(timerInterval);

timerInterval=null;

timerRunning=false;

document.getElementById("timerStart")
.textContent="Démarrer";

playAlarmSound();

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(
"⌛ Minuteur terminé",
{
body:"Le temps est écoulé.",
requireInteraction:true
}
);

}catch(e){}

}

saveTimer();

}

},250);

saveTimer();

}


function resetTimer(){

clearInterval(timerInterval);

timerInterval=null;

timerRunning=false;

t
