<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#000;
}

/* =========================
   CONTENU
========================= */

.content{
    flex:1;
    position:relative;
    overflow:hidden;
}

.page{
    position:absolute;
    inset:0;
    display:none;
    overflow-y:auto;
    padding:42px 24px 125px;
}

.page.active{
    display:block;
}

.container{
    width:min(700px,100%);
    margin:0 auto;
}

h1{
    margin:0;
    font-size:38px;
    font-weight:700;
    letter-spacing:-1px;
}

.subtitle{
    color:#777;
    font-size:18px;
    margin-top:8px;
}

/* =========================
   BOUTONS VERTS
========================= */

.green{
    color:#20e879;
}

.primary-btn{
    background:#20e879;
    color:#06130b;
    font-weight:700;
    border-radius:50px;
    padding:15px 28px;
    font-size:17px;
    transition:.15s;
}

.primary-btn:active{
    transform:scale(.94);
}

.circle-plus{
    width:82px;
    height:82px;
    border-radius:50%;
    background:#20e879;
    color:#06200f;
    font-size:42px;
    line-height:82px;
    margin:auto;
    display:block;
}

.add-area{
    text-align:center;
    margin-top:78px;
}

.add-text{
    color:#777;
    font-size:20px;
    margin-top:14px;
}

/* =========================
   RÉVEILS
========================= */

.alarms{
    margin-top:35px;
}

.alarm{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 4px;
    border-bottom:1px solid #171717;
}

.alarm-left{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.alarm-time{
    font-size:38px;
    font-weight:400;
    letter-spacing:1px;
}

.alarm-days{
    color:#777;
    font-size:14px;
}

.alarm-actions{
    display:flex;
    align-items:center;
    gap:15px;
}

.delete-btn{
    background:transparent;
    color:#777;
    font-size:22px;
    padding:8px;
}

.delete-btn:active{
    color:#fff;
}

/* interrupteur */

.switch{
    width:52px;
    height:30px;
    border-radius:20px;
    background:#333;
    position:relative;
    transition:.2s;
}

.switch::after{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#aaa;
    top:3px;
    left:3px;
    transition:.2s;
}

.switch.on{
    background:#20e879;
}

.switch.on::after{
    left:25px;
    background:#06200f;
}

/* =========================
   HORLOGE
========================= */

.clock-page{
    text-align:center;
}

.clock-box{
    margin-top:110px;
}

.clock-time{
    font-size:clamp(55px,15vw,115px);
    font-weight:300;
    letter-spacing:2px;
    white-space:nowrap;
}

.clock-seconds{
    color:#20e879;
}

.clock-date{
    color:#777;
    font-size:20px;
    margin-top:16px;
    text-transform:capitalize;
}

/* =========================
   CHRONO
========================= */

.tool-page{
    text-align:center;
}

.tool-title{
    margin-bottom:10px;
}

.tool-subtitle{
    color:#777;
    font-size:17px;
}

.stopwatch{
    margin-top:100px;
}

.stopwatch-display{
    font-size:clamp(55px,15vw,100px);
    font-weight:300;
    letter-spacing:2px;
    font-variant-numeric:tabular-nums;
}

.milliseconds{
    color:#20e879;
}

.controls{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:50px;
}

.round-btn{
    width:76px;
    height:76px;
    border-radius:50%;
    background:#171717;
    color:#fff;
    font-size:16px;
}

.round-btn.green-btn{
    background:#20e879;
    color:#06200f;
    font-weight:700;
}

.round-btn:active{
    transform:scale(.93);
}

.laps{
    width:min(420px,100%);
    margin:40px auto 0;
    text-align:left;
    max-height:190px;
    overflow-y:auto;
}

.lap{
    display:flex;
    justify-content:space-between;
    padding:12px 5px;
    border-bottom:1px solid #171717;
    color:#aaa;
}

/* =========================
   MINUTEUR
========================= */

.timer{
    margin-top:75px;
}

.timer-display{
    font-size:clamp(60px,17vw,105px);
    font-weight:300;
    font-variant-numeric:tabular-nums;
}

.timer-inputs{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:35px;
}

.time-input{
    width:80px;
    height:60px;
    border:1px solid #282828;
    background:#111;
    color:#fff;
    border-radius:12px;
    text-align:center;
    font-size:25px;
    outline:none;
}

.time-input:focus{
    border-color:#20e879;
}

.colon{
    color:#777;
    font-size:25px;
}

.timer-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:35px;
}

/* =========================
   NAVIGATION
========================= */

.bottom-nav{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(730px,calc(100% - 20px));
    height:94px;
    background:#111;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:8px 4px 7px;
    border-radius:2px 2px 0 0;
    z-index:50;
}

.nav-btn{
    background:transparent;
    color:#666;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:14px;
    transition:.2s;
}

.nav-btn.active{
    color:#20e879;
}

.nav-icon{
    width:31px;
    height:31px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* icônes simples */

.icon-bell{
    width:20px;
    height:22px;
    border:2px solid currentColor;
    border-radius:11px 11px 6px 6px;
    position:relative;
}

.icon-bell::after{
    content:"";
    position:absolute;
    width:7px;
    height:3px;
    background:currentColor;
    border-radius:5px;
    bottom:-5px;
    left:5px;
}

.icon-clock{
    width:27px;
    height:27px;
    border:3px solid currentColor;
    border-radius:50%;
    position:relative;
}

.icon-clock::before{
    content:"";
    position:absolute;
    width:2px;
    height:8px;
    background:currentColor;
    left:11px;
    top:4px;
}

.icon-clock::after{
    content:"";
    position:absolute;
    width:7px;
    height:2px;
    background:currentColor;
    left:11px;
    top:12px;
    transform:rotate(30deg);
    transform-origin:left;
}

.icon-stopwatch{
    width:24px;
    height:24px;
    border:3px solid currentColor;
    border-radius:50%;
    position:relative;
}

.icon-stopwatch::before{
    content:"";
    position:absolute;
    width:8px;
    height:3px;
    background:currentColor;
    top:-7px;
    left:5px;
}

.icon-stopwatch::after{
    content:"";
    position:absolute;
    width:2px;
    height:8px;
    background:currentColor;
    left:10px;
    top:4px;
}

.icon-timer{
    width:24px;
    height:24px;
    border:3px solid currentColor;
    border-radius:50%;
    position:relative;
}

.icon-timer::before{
    content:"";
    position:absolute;
    width:9px;
    height:3px;
    background:currentColor;
    top:-7px;
    left:5px;
}

.icon-timer::after{
    content:"";
    position:absolute;
    width:3px;
    height:7px;
    background:currentColor;
    left:-5px;
    top:2px;
    transform:rotate(-45deg);
}

/* =========================
   MODALE RÉVEIL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    background:#151515;
    border-radius:25px 25px 0 0;
    padding:25px 22px 35px;
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-title{
    text-align:center;
    font-size:22px;
    margin-bottom:22px;
}

.alarm-picker{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

.alarm-picker input{
    width:110px;
    height:75px;
    background:#080808;
    border:1px solid #333;
    color:#fff;
    border-radius:15px;
    text-align:center;
    font-size:40px;
    outline:none;
}

.alarm-picker input:focus{
    border-color:#20e879;
}

.day-picker{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin:25px 0;
}

.day{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#252525;
    color:#aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.day.selected{
    background:#20e879;
    color:#06200f;
    font-weight:bold;
}

.modal-actions{
    display:flex;
    gap:12px;
}

.modal-actions button{
    flex:1;
    height:52px;
    border-radius:30px;
    font-size:16px;
}

.cancel{
    background:#282828;
    color:#fff;
}

.save{
    background:#20e879;
    color:#06200f;
    font-weight:bold;
}

/* =========================
   ALERTE
========================= */

.ringing{
    position:fixed;
    inset:0;
    background:#000;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.ringing.show{
    display:flex;
}

.ringing-content h2{
    font-size:38px;
    margin:0 0 15px;
}

.ringing-time{
    color:#20e879;
    font-size:70px;
    margin-bottom:40px;
}

.stop-alarm{
    background:#20e879;
    color:#06200f;
    padding:17px 45px;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
}

/* =========================
   PETITS ÉCRANS
========================= */

@media(max-width:500px){

    .page{
        padding:32px 20px 120px;
    }

    h1{
        font-size:34px;
    }

    .bottom-nav{
        width:100%;
        height:88px;
    }

    .nav-btn{
        font-size:12px;
    }

    .clock-box{
        margin-top:100px;
    }

    .stopwatch{
        margin-top:85px;
    }

    .timer{
        margin-top:60px;
    }

    .time-input{
        width:72px;
        height:58px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="content">

<!-- ================= RÉVEILS ================= -->

<section class="page active" id="page-alarms">
    <div class="container">

        <h1>Réveils</h1>
        <div class="subtitle">Vos alarmes</div>

        <div class="alarms" id="alarmsList"></div>

        <div class="add-area">
            <button class="circle-plus" onclick="openAlarmModal()">+</button>
            <div class="add-text">Ajouter un réveil</div>
        </div>

    </div>
</section>

<!-- ================= HORLOGE ================= -->

<section class="page clock-page" id="page-clock">

    <div class="container">

        <h1>Horloge</h1>
        <div class="subtitle">Heure actuelle</div>

        <div class="clock-box">
            <div class="clock-time">
                <span id="clockHours">00</span>:<span id="clockMinutes">00</span>:<span class="clock-seconds" id="clockSeconds">00</span>
            </div>

            <div class="clock-date" id="clockDate"></div>
        </div>

    </div>

</section>

<!-- ================= CHRONO ================= -->

<section class="page tool-page" id="page-chrono">

    <div class="container">

        <h1 class="tool-title">Chrono</h1>
        <div class="tool-subtitle">Chronomètre</div>

        <div class="stopwatch">

            <div class="stopwatch-display">
                <span id="chronoMinutes">00</span>:<span id="chronoSeconds">00</span><span class="milliseconds">.<span id="chronoMs">00</span></span>
            </div>

            <div class="controls">
                <button class="round-btn" onclick="chronoReset()">Reset</button>
                <button class="round-btn green-btn" id="chronoStart" onclick="chronoToggle()">Démarrer</button>
                <button class="round-btn" onclick="chronoLap()">Tour</button>
            </div>

            <div class="laps" id="laps"></div>

        </div>

    </div>

</section>

<!-- ================= MINUTEUR ================= -->

<section class="page tool-page" id="page-timer">

    <div class="container">

        <h1 class="tool-title">Minuteur</h1>
        <div class="tool-subtitle">Compte à rebours</div>

        <div class="timer">

            <div class="timer-display" id="timerDisplay">
                00:00:00
            </div>

            <div class="timer-inputs">

                <input
                    id="timerHours"
                    class="time-input"
                    type="number"
                    min="0"
                    max="99"
                    value="0"
                    inputmode="numeric"
                    aria-label="Heures">

                <span class="colon">:</span>

                <input
                    id="timerMinutes"
                    class="time-input"
                    type="number"
                    min="0"
                    max="59"
                    value="5"
                    inputmode="numeric"
                    aria-label="Minutes">

                <span class="colon">:</span>

                <input
                    id="timerSeconds"
                    class="time-input"
                    type="number"
                    min="0"
                    max="59"
                    value="0"
                    inputmode="numeric"
                    aria-label="Secondes">

            </div>

            <div class="timer-buttons">
                <button class="round-btn" onclick="timerReset()">Reset</button>
                <button class="round-btn green-btn" id="timerStart" onclick="timerToggle()">Démarrer</button>
            </div>

        </div>

    </div>

</section>

</div>

<!-- ================= NAVIGATION ================= -->

<nav class="bottom-nav">

    <button class="nav-btn active" onclick="showPage('alarms',this)">
        <div class="nav-icon">
            <div class="icon-bell"></div>
        </div>
        <span>Réveils</span>
    </button>

    <button class="nav-btn" onclick="showPage('clock',this)">
        <div class="nav-icon">
            <div class="icon-clock"></div>
        </div>
        <span>Horloge</span>
    </button>

    <button class="nav-btn" onclick="showPage('chrono',this)">
        <div class="nav-icon">
            <div class="icon-stopwatch"></div>
        </div>
        <span>Chrono</span>
    </button>

    <button class="nav-btn" onclick="showPage('timer',this)">
        <div class="nav-icon">
            <div class="icon-timer"></div>
        </div>
        <span>Minuteur</span>
    </button>

</nav>

</div>


<!-- ================= MODALE AJOUT RÉVEIL ================= -->

<div class="modal" id="alarmModal">

    <div class="modal-box">

        <div class="modal-title">Nouveau réveil</div>

        <div class="alarm-picker">

            <input
                id="alarmHour"
                type="number"
                min="0"
                max="23"
                value="07"
                inputmode="numeric">

            <span class="colon">:</span>

            <input
                id="alarmMinute"
                type="number"
                min="0"
                max="59"
                value="00"
                inputmode="numeric">

        </div>

        <div class="day-picker">

            <button class="day" data-day="1">Lun</button>
            <button class="day" data-day="2">Mar</button>
            <button class="day" data-day="3">Mer</button>
            <button class="day" data-day="4">Jeu</button>
            <button class="day" data-day="5">Ven</button>
            <button class="day" data-day="6">Sam</button>
            <button class="day" data-day="0">Dim</button>

        </div>

        <div class="modal-actions">

            <button class="cancel" onclick="closeAlarmModal()">
                Annuler
            </button>

            <button class="save" onclick="saveAlarm()">
                Enregistrer
            </button>

        </div>

    </div>

</div>


<!-- ================= ALARME QUI SONNE ================= -->

<div class="ringing" id="ringing">

    <div class="ringing-content">

        <h2>Réveil</h2>

        <div class="ringing-time" id="ringingTime">
            00:00
        </div>

        <button class="stop-alarm" onclick="stopRinging()">
            Arrêter
        </button>

    </div>

</div>


<script>

/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page, button){

    document.querySelectorAll(".page").forEach(function(p){
        p.classList.remove("active");
    });

    document.getElementById("page-" + page).classList.add("active");

    document.querySelectorAll(".nav-btn").forEach(function(btn){
        btn.classList.remove("active");
    });

    button.classList.add("active");
}


/* =========================================================
   HORLOGE
========================================================= */

const jours = [
    "dimanche",
    "lundi",
    "mardi",
    "mercredi",
    "jeudi",
    "vendredi",
    "samedi"
];

const mois = [
    "janvier",
    "février",
    "mars",
    "avril",
    "mai",
    "juin",
    "juillet",
    "août",
    "septembre",
    "octobre",
    "novembre",
    "décembre"
];

function pad(n){
    return String(n).padStart(2,"0");
}

function updateClock(){

    const now = new Date();

    document.getElementById("clockHours").textContent =
        pad(now.getHours());

    document.getElementById("clockMinutes").textContent =
        pad(now.getMinutes());

    document.getElementById("clockSeconds").textContent =
        pad(now.getSeconds());

    document.getElementById("clockDate").textContent =
        jours[now.getDay()] + " " +
        now.getDate() + " " +
        mois[now.getMonth()] + " " +
        now.getFullYear();

    checkAlarms();
}

setInterval(updateClock,1000);
updateClock();


/* =========================================================
   RÉVEILS
========================================================= */

let alarms = [];

try{
    alarms = JSON.parse(localStorage.getItem("myAlarms")) || [];
}catch(e){
    alarms = [];
}

let selectedDays = [];

function saveAlarmsStorage(){
    localStorage.setItem("myAlarms",JSON.stringify(alarms));
}

function openAlarmModal(){

    document.getElementById("alarmModal").classList.add("open");

    selectedDays = [];

    document.querySelectorAll(".day").forEach(function(day){
        day.classList.remove("selected");
    });
}

function closeAlarmModal(){
    document.getElementById("alarmModal").classList.remove("open");
}

document.querySelectorAll(".day").forEach(function(day){

    day.addEventListener("click",function(){

        const value = Number(this.dataset.day);

        if(selectedDays.includes(value)){

            selectedDays = selectedDays.filter(function(d){
                return d !== value;
            });

            this.classList.remove("selected");

        }else{

            selectedDays.push(value);
            this.classList.add("selected");

        }

    });

});


function saveAlarm(){

    let hour = Number(document.getElementById("alarmHour").value);
    let minute = Number(document.getElementById("alarmMinute").value);

    if(hour < 0) hour = 0;
    if(hour > 23) hour = 23;

    if(minute < 0) minute = 0;
    if(minute > 59) minute = 59;

    /*
       Si aucun jour n'est sélectionné :
       l'alarme sonnera tous les jours.
    */

    alarms.push({
        id:Date.now(),
        hour:hour,
        minute
