<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waveify - Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barre latérale -->
    <aside class="sidebar">
        <div class="logo">W<span>♪</span> Waveify</div>

        <nav>
            <a href="#" class="active">🏠 Accueil</a>
            <a href="#search">🔎 Rechercher</a>
            <a href="#library">📚 Bibliothèque</a>
        </nav>

        <div class="playlist-title">
            <span>Tes playlists</span>
            <button onclick="createPlaylist()">+</button>
        </div>

        <div id="playlists" class="playlists">
            <p>Aucune playlist</p>
        </div>
    </aside>

    <!-- Contenu principal -->
    <main class="main">

        <header>
            <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

            <div class="navigation">
                <button onclick="history.back()">‹</button>
                <button onclick="history.forward()">›</button>
            </div>

            <div class="user">
                <div class="avatar">W</div>
                <span>Utilisateur</span>
            </div>
        </header>

        <!-- Accueil -->
        <section class="hero">
            <div>
                <p class="small-title">BIENVENUE SUR</p>
                <h1>Waveify</h1>
                <p>Écoute tes musiques préférées directement depuis ton navigateur.</p>
            </div>
        </section>

        <!-- Recherche -->
        <section id="search" class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Rechercher une musique..."
                oninput="searchMusic()"
            >
        </section>

        <!-- Musiques -->
        <section id="library">
            <div class="section-header">
                <h2>Nos musiques</h2>
            </div>

            <div id="musicGrid" class="music-grid"></div>
        </section>

    </main>

    <!-- Lecteur -->
    <footer class="player">

        <div class="current-song">
            <div id="currentCover" class="mini-cover">♪</div>

            <div>
                <strong id="currentTitle">Aucune musique</strong>
                <span id="currentArtist">Sélectionne un morceau</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="previousSong()">⏮</button>
            <button id="playButton" class="play-button" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <div class="volume">
            🔊
            <input type="range" min="0" max="100" value="100">
        </div>

    </footer>

    <!-- YouTube caché dans le lecteur -->
    <div id="youtubePlayer"></div>

    <script src="script.js"></script>
</body>
</html>
