<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Horloge</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

button {
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: 100%;
    max-width: 700px;
    height: 100dvh;
    margin: auto;
    background: #000;
    position: relative;
    overflow: hidden;
}


/* ================================
   CONTENU
================================ */

.content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 82px;
    overflow: hidden;
}

.page {
    width: 100%;
    height: 100%;
    padding: 15px 20px;
    overflow: hidden;
}

.hidden {
    display: none !important;
}


/* ================================
   MINUTEUR
================================ */

.timer-page {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
}


/* Roulettes */

.picker {
    width: 100%;
    height: 390px;
    flex-shrink: 0;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    position: relative;
}


/* Zone de sélection centrale */

.picker::after {
    content: "";
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;
    transform: translateY(-50%);

    height: 76px;

    pointer-events: none;
}


/* Colonnes */

.column {
    height: 390px;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;

    scrollbar-width: none;

    overscroll-behavior-y: contain;
    touch-action: pan-y;

    text-align: center;
}

.column::-webkit-scrollbar {
    display: none;
}


/* Liste */

.list {
    padding-top: 157px;
    padding-bottom: 157px;
}


/* Heures / minutes / secondes */

.title {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #a1a1a5;
    font-size: 20px;

    scroll-snap-align: center;
}

.number {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #242428;

    font-size: 58px;
    font-weight: 300;

    scroll-snap-align: center;

    transition: color .12s;
}

.number.active {
    color: #fff;
}


/* ================================
   PRESETS
================================ */

.presets {
    display: flex;
    justify-content: center;
    gap: 16px;

    margin-top: 5px;

    flex-shrink: 0;
}

.preset {
    width: 145px;
    height: 145px;

    border: none;
    border-radius: 50%;

    background: #202022;
    color: #ddd;

    font-size: 20px;

    cursor: pointer;
}

.preset:active {
    transform: scale(.94);
}


/* ================================
   BOUTON MINUTEUR
================================ */

.timer-start-area {
    flex: 1;

    min-height: 100px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.timer-start-button {
    min-width: 210px;

    border: none;
    border-radius: 50px;

    padding: 17px 35px;

    background: #635bff;
    color: white;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;
}

.timer-start-button:active {
    transform: scale(.96);
}

.timer-start-button.pause {
    background: #3d3995;
}


/* ================================
   NAVIGATION
================================ */

.navigation {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 82px;

    background: #000;

    border-top: 1px solid #171717;

    display: flex;

    z-index: 100;
}

.navigation button {
    flex: 1;

    height: 100%;

    border: none;
    background: none;

    color: #858589;

    font-size: 16px;

    cursor: pointer;

    position: relative;

    padding: 0 3px;
}

.navigation button.active {
    color: white;
    font-weight: bold;
}

.navigation button.active::after {
    content: "";

    position: absolute;

    left: 25%;
    right: 25%;
    bottom: 7px;

    height: 3px;

    border-radius: 5px;

    background: white;
}


/* ================================
   TITRES
================================ */

.page-title {
    font-size: 34px;
    margin: 10px 0 25px;
}


/* ================================
   ALARME
================================ */

.add-alarm {
    width: 100%;

    border: none;
    border-radius: 17px;

    background: #635bff;
    color: white;

    padding: 16px;

    font-size: 18px;
    font-weight: bold;

    margin-bottom: 18px;

    cursor: pointer;
}

.alarm-form {
    background: #171719;

    padding: 20px;

    border-radius: 20px;

    margin-bottom: 15px;
}

.alarm-form input {
    width: 100%;

    border: none;
    border-radius: 15px;

    background: #29292b;
    color: white;

    padding: 12px;

    font-size: 34px;

    text-align: center;

    margin-bottom: 15px;
}

.form-buttons {
    display: flex;
    gap: 10px;
}

.form-buttons button {
    flex: 1;

    border: none;
    border-radius: 13px;

    padding: 13px;

    font-size: 16px;
}

.cancel {
    background: #29292b;
    color: white;
}

.save {
    background: #635bff;
    color: white;
}

.alarm-card {
    background: #171719;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.alarm-time {
    font-size: 40px;
    font-weight: 300;
}

.alarm-days {
    color: #888;
    margin-top: 5px;
    font-size: 14px;
}

.switch {
    width: 52px;
    height: 31px;

    background: #39393d;

    border-radius: 20px;

    position: relative;

    cursor: pointer;
}

.switch::after {
    content: "";

    width: 27px;
    height: 27px;

    background: white;

    border-radius: 50%;

    position: absolute;

    left: 2px;
    top: 2px;

    transition: .2s;
}

.switch.on {
    background: #635bff;
}

.switch.on::after {
    left: 23px;
}


/* ================================
   HORLOGE MONDIALE
================================ */

.city-card {
    background: #171719;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 13px;
}

.city-name {
    font-size: 22px;
}

.city-country {
    color: #888;
    margin-top: 4px;
}

.city-time {
    font-size: 40px;

    margin-top: 10px;

    font-weight: 300;

    font-variant-numeric: tabular-nums;
}


/* ================================
   CHRONOMÈTRE
================================ */

.stopwatch-page {
    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 75px;
}

.stopwatch-display {
    width: 100%;

    text-align: center;

    font-size: clamp(
        45px,
        12vw,
        75px
    );

    font-weight: 300;

    letter-spacing: -3px;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;
}


/*
   IMPORTANT :
   Les boutons du chronomètre
   ont maintenant leur propre classe.
*/

.stopwatch-buttons {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 28px;

    margin-top: 65px;
}

.stopwatch-button {
    width: 82px;
    height: 82px;

    flex: 0 0 82px;

    border: none;

    border-radius: 50%;

    background: #202022;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

.stopwatch-button:active {
    transform: scale(.94);
}


/* Démarrer */

.stopwatch-button.start {
    background: #173b23;

    color: #30d158;
}


/* Pause */

.stopwatch-button.stop {
    background: #421c1c;

    color: #ff453a;
}


/* Tours */

.laps {
    width: 100%;

    margin-top: 35px;

    overflow-y: auto;
}

.lap {
    display: flex;

    justify-content: space-between;

    padding: 14px 5px;

    border-bottom:
        1px solid #29292b;
}

.lap span {
    color: #888;
}


/* ================================
   PETITS ÉCRANS
================================ */

@media (max-width: 500px) {

    .page {
        padding-left: 12px;
        padding-right: 12px;
    }

    .picker {
        height: 365px;
    }

    .column {
        height: 365px;
    }

    .list {
        padding-top: 144px;
        padding-bottom: 144px;
    }

    .number {
        height: 72px;
        font-size: 53px;
    }

    .title {
        height: 72px;
        font-size: 19px;
    }

    .presets {
        gap: 10px;
    }

    .preset {
        width: 112px;
        height: 112px;

        font-size: 17px;
    }

    .timer-start-area {
        min-height: 95px;
    }

    .timer-start-button {
        min-width: 205px;
        padding: 16px 30px;
    }

    .stopwatch-buttons {
        gap: 18px;
    }

    .stopwatch-button {
        width: 78px;
        height: 78px;
        flex-basis: 78px;
    }

    .navigation button {
        font-size: 13px;
    }
}


/* ================================
   TRÈS PETIT ÉCRAN
================================ */

@media (max-width: 360px) {

    .picker {
        height: 330px;
    }

    .column {
        height: 330px;
    }

    .list {
        padding-top: 129px;
        padding-bottom: 129px;
    }

    .number {
        height: 65px;
        font-size: 48px;
    }

    .title {
        height: 65px;
        font-size: 17px;
    }

    .preset {
        width: 96px;
        height: 96px;
        font-size: 15px;
    }

    .stopwatch-buttons {
        gap: 12px;
    }

    .stopwatch-button {
        width: 72px;
        height: 72px;
        flex-basis: 72px;
    }

    .navigation button {
        font-size: 11px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- ============================================
         CONTENU
    ============================================= -->

    <main class="content">


        <!-- ========================================
             MINUTEUR
        ========================================= -->

        <section
            id="timerPage"
            class="page timer-page">


            <div class="picker">


                <div
                    class="column"
                    id="hoursColumn">

                    <div
                        class="list"
                        id="hoursList">
                    </div>

                </div>


                <div
                    class="column"
                    id="minutesColumn">

                    <div
                        class="list"
                        id="minutesList">
                    </div>

                </div>


                <div
                    class="column"
                    id="secondsColumn">

                    <div
                        class="list"
                        id="secondsList">
                    </div>

                </div>


            </div>


            <div class="presets">

                <button
                    class="preset"
                    onclick="setTimer(0,10,0)">

                    00:10:00

                </button>


                <button
                    class="preset"
                    onclick="setTimer(0,15,0)">

                    00:15:00

                </button>


                <button
                    class="preset"
                    onclick="setTimer(0,30,0)">

                    00:30:00

                </button>

            </div>


            <div class="timer-start-area">

                <button
                    id="timerButton"
                    class="timer-start-button"
                    onclick="toggleTimer()">

                    Démarrer

                </button>

            </div>


        </section>



        <!-- ========================================
             ALARME
        ========================================= -->

        <section
            id="alarmPage"
            class="page hidden">


            <h1 class="page-title">
                Alarme
            </h1>


            <button
                class="add-alarm"
                onclick="showAlarmForm()">

                + Ajouter une alarme

            </button>


            <div
                id="alarmForm"
                class="alarm-form hidden">


                <input
                    id="alarmTime"
                    type="time"
                    value="07:00">


                <div class="form-buttons">

                    <button
                        class="cancel"
                        onclick="hideAlarmForm()">

                        Annuler

                    </button>


                    <button
                        class="save"
                        onclick="addAlarm()">

                        Enregistrer

                    </button>

                </div>


            </div>


            <div id="alarmList"></div>


        </section>



        <!-- ========================================
             HORLOGE MONDIALE
        ========================================= -->

        <section
            id="worldPage"
            class="page hidden">


            <h1 class="page-title">
                Horloge mondiale
            </h1>


            <div class="city-card">

                <div class="city-name">
                    🇫🇷 Paris
                </div>

                <div class="city-country">
                    France
                </div>

                <div
                    id="parisTime"
                    class="city-time">
                    --:--:--
                </div>

            </div>


            <div class="city-card">

                <div class="city-name">
                    🇺🇸 New York
                </div>

                <div class="city-country">
                    États-Unis
                </div>

                <div
                    id="newYorkTime"
                    class="city-time">
                    --:--:--
                </div>

            </div>


            <div class="city-card">

                <div class="city-name">
                    🇯🇵 Tokyo
                </div>

                <div class="city-country">
                    Japon
                </div>

                <div
                    id="tokyoTime"
                    class="city-time">
                    --:--:--
                </div>

            </div>


        </section>



        <!-- ========================================
             CHRONOMÈTRE
        ========================================= -->

        <section
            id="stopwatchPage"
            class="page stopwatch-page hidden">


            <div
                id="stopwatchDisplay"
                class="stopwatch-display">

                00:00:00.00

            </div>


            <div class="stopwatch-buttons">


                <button
                    class="stopwatch-button"
                    onclick="addLap()">

                    Tour

                </button>


                <button
                    id="stopwatchButton"
                    class="stopwatch-button start"
                    onclick="toggleStopwatch()">

                    Démarrer

                </button>


                <button
                    class="stopwatch-button"
                    onclick="resetStopwatch()">

                    Reset

                </button>


            </div>


            <div
                id="laps"
                class="laps">
            </div>


        </section>


    </main>



    <!-- ============================================
         NAVIGATION
    ============================================= -->

    <nav class="navigation">


        <button
            onclick="openPage('alarmPage',this)">

            Alarme

        </button>


        <button
            onclick="openPage('worldPage',this)">

            Horloge mondiale

        </button>


        <button
            onclick="openPage('stopwatchPage',this)">

            Chronomètre

        </button>


        <button
            class="active"
            onclick="openPage('timerPage',this)">

            Minuteur

        </button>


    </nav>


</div>



<script>

/* ================================================
   NAVIGATION
================================================ */

function openPage(pageId, button) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.add("hidden");

        });


    document
        .getElementById(pageId)
        .classList.remove("hidden");


    document
        .querySelectorAll(".navigation button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");

}


/* ================================================
   ROULETTES
================================================ */

function createWheel(
    listId,
    title,
    max
) {

    const list =
        document.getElementById(listId);


    const titleElement =
        document.createElement("div");


    titleElement.className =
        "title";


    titleElement.textContent =
        title;


    list.appendChild(
        titleElement
    );


    for (
        let i = 0;
        i <= max;
        i++
    ) {

        const number =
            document.createElement("div");


        number.className =
            "number";


        number.textContent =
            String(i).padStart(2,"0");


        number.dataset.value =
            i;


        list.appendChild(
            number
        );

    }

}


createWheel(
    "hoursList",
    "Heures",
    23
);

createWheel(
    "minutesList",
    "Minutes",
    59
);

createWheel(
    "secondsList",
    "Secondes",
    59
);


/* ================================================
   SÉLECTION DES ROULETTES
================================================ */

function updateSelection() {

    document
        .querySelectorAll(".column")
        .forEach(column => {

            const item =
                column.querySelector(".number");

            if (!item) return;


            const height =
                item.offsetHeight;


            const index =
                Math.round(
                    column.scrollTop /
                    height
                );


            column
                .querySelectorAll(".number")
                .forEach(
                    (number, i) => {

                        number.classList.toggle(
                            "active",
                            i === index
                        );

                    }
                );

        });

}


document
    .querySelectorAll(".column")
    .forEach(column => {

        column.addEventListener(
            "scroll",
            updateSelection,
            { passive: true }
        );

    });


/* ================================================
   VALEUR
================================================ */

function getValue(id) {

    const column =
        document.getElementById(id);


    const number =
        column.querySelector(".number");


    const height =
        number.offsetHeight;


    return Math.max(
        0,
        Math.min(
            Math.round(
                column.scrollTop /
                height
            ),
            column.querySelectorAll(".number").length - 1
        )
    );

}


/* ================================================
   CHOISIR UNE DURÉE
================================================ */

function setTimer(
    hours,
    minutes,
    seconds
) {

    const h =
        document.getElementById(
            "hoursColumn"
        );

    const m =
        document.getElementById(
            "minutesColumn"
        );

    const s =
        document.getElementById(
            "secondsColumn"
        );


    const height =
        h.querySelector(
            ".number"
        ).offsetHeight;


    h.scrollTop =
        hours * height;


    m.scrollTop =
        minutes * height;


    s.scrollTop =
        seconds * height;


    updateSelection();

}


/* ================================================
   MINUTEUR
================================================ */

let timerRunning = false;
let timerRemaining = 0;
let timerEnd = 0;
let timerInterval = null;


function getSelectedTime() {

    const h =
        getValue("hoursColumn");


    const m =
        getValue("minutesColumn");


    const s =
        getValue("secondsColumn");


    return (
        h * 3600000 +
        m * 60000 +
        s * 1000
    );

}


function toggleTimer() {

    const button =
        document.getElementById(
            "timerButton"
        );


    if (!timerRunning) {

        if (
            timerRemaining <= 0
        ) {

            timerRemaining =
                getSelectedTime();

        }


        if (
            timerRemaining <= 0
        ) {

            alert(
                "Choisis une durée."
            );

            return;

        }


        timerEnd =
            Date.now() +
            timerRemaining;


        timerRunning =
            true;


        button.textContent =
            "Pause";


        button.classList.add(
            "pause"
        );


        timerInterval =
            setInterval(
                updateTimer,
                100
            );

    }

    else {

        timerRemaining =
            Math.max(
                0,
                timerEnd -
                Date.now()
            );


        timerRunning =
            false;


        clearInterval(
            timerInterval
        );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "pause"
        );

    }

}


function updateTimer() {

    timerRemaining =
        timerEnd -
        Date.now();


    if (
        timerRemaining <= 0
    ) {

        timerRemaining = 0;

        timerRunning = false;

        clearInterval(
            timerInterval
        );


        const button =
            document.getElementById(
                "timerButton"
            );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "pause"
        );


        if (
            navigator.vibrate
        ) {

            navigator.vibrate([
                400,
                150,
                400,
                150,
                700
            ]);

        }


        playSound();


        alert(
            "⏰ Temps écoulé !"
        );

    }

}


/* ================================================
   SON
================================================ */

function playSound() {

    try {

        const Context =
            window.AudioContext ||
            window.webkitAudioContext;


        const audio =
            new Context();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.frequency.value =
            880;


        oscillator.type =
            "sine";


        gain.gain.value =
            .25;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        setTimeout(
            () => oscillator.stop(),
            800
        );

    }

    catch(e) {}

}


/* ================================================
   HORLOGE MONDIALE
================================================ */

function updateWorldClocks() {

    const now =
        new Date();


    function getTime(zone) {

        return new Intl.DateTimeFormat(
            "fr-FR",
            {
                timeZone: zone,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        ).format(now);

    }


    document.getElementById(
        "parisTime"
    ).textContent =
        getTime("Europe/Paris");


    document.getElementById(
        "newYorkTime"
    ).textContent =
        getTime("America/New_York");


    document.getElementById(
        "tokyoTime"
    ).textContent =
        getTime("Asia/Tokyo");

}


setInterval(
    updateWorldClocks,
    1000
);

updateWorldClocks();


/* ================================================
   ALARMES
================================================ */

let alarms = [];

let lastTriggeredAlarm = "";


function showAlarmForm() {

    document
        .getElementById("alarmForm")
        .classList.remove("hidden");

}


function hideAlarmForm() {

    document
        .getElementById("alarmForm")
        .classList.add("hidden");

}


function addAlarm() {

    const input =
        document.getElementById(
            "alarmTime"
        );


    if (!input.value) return;


    alarms.push({

        id: Date.now(),

        time: input.value,

        enabled: true

    });


    renderAlarms();

    hideAlarmForm();

}


function toggleAlarm(id) {

    const alarm =
        alarms.find(
            a => a.id === id
        );


    if (!alarm) return;


    alarm.enabled =
        !alarm.enabled;


    renderAlarms();

}


function deleteAlarm(id) {

    alarms =
        alarms.filter(
            a => a.id !== id
        );


    renderAlarms();

}


function renderAlarms() {

    const list =
        document.getElementById(
            "alarmList"
        );


    list.innerHTML = "";


    if (
        alarms.length === 0
    ) {

        list.innerHTML = `

            <div class="alarm-card">

                <div>

                    <div style="font-size:18px">
                        Aucune alarme
                    </div>

                    <div class="alarm-days">
                        Ajoute ton réveil avec le bouton ci-dessus.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    alarms.forEach(alarm => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "alarm-card";


        card.innerHTML = `

            <div>

                <div class="alarm-time">
                    ${alarm.time}
                </div>

                <div class="alarm-days">
                    Tous les jours
                </div>

            </div>

            <div style="
                display:flex;
                align-items:center;
                gap:14px;
            ">

                <div
                    class="switch ${alarm.enabled ? "on" : ""}"
                    onclick="toggleAlarm(${alarm.id})">
                </div>

                <button
                    onclick="deleteAlarm(${alarm.id})"
                    style="
                        border:none;
                        background:none;
                        color:#777;
                        font-size:25px;
                        cursor:pointer;
                    ">

                    ×

                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


function checkAlarms() {

    const now =
        new Date();


    const current =
        String(
            now.getHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const unique =
        current +
        "-" +
        now.getDate();


    if (
        unique === lastTriggeredAlarm
    ) {

        return;

    }


    alarms.forEach(alarm => {

        if (
            alarm.enabled &&
            alarm.time === current
        ) {

            lastTriggeredAlarm =
                unique;


            playSound();


            if (
                navigator.vibrate
            ) {

                navigator.vibrate([
                    500,
                    200,
                    500,
                    200,
                    800
                ]);

            }


            alert(
                "⏰ Réveil !"
            );

        }

    });

}


setInterval(
    checkAlarms,
    1000
);


/* ================================================
   CHRONOMÈTRE
================================================ */

let stopwatchRunning = false;
let stopwatchStart = 0;
let stopwatchElapsed = 0;
let stopwatchInterval = null;
let lapNumber = 0;


function updateStopwatch() {

    let elapsed =
        stopwatchElapsed;


    if (
        stopwatchRunning
    ) {

        elapsed +=
            performance.now() -
            stopwatchStart;

    }


    const hours =
        Math.floor(
            elapsed / 3600000
        );


    const minutes =
        Math.floor(
            elapsed / 60000
        ) % 60;


    const seconds =
        Math.floor(
            elapsed / 1000
        ) % 60;


    const centiseconds =
        Math.floor(
            elapsed / 10
        ) % 100;


    document.getElementById(
        "stopwatchDisplay"
    ).textContent =

        String(hours)
            .padStart(2,"0")

        + ":" +

        String(minutes)
            .padStart(2,"0")

        + ":" +

        String(seconds)
            .padStart(2,"0")

        + "." +

        String(centiseconds)
            .padStart(2,"0");

}


function toggleStopwatch() {

    const button =
        document.getElementById(
            "stopwatchButton"
        );


    if (
        !stopwatchRunning
    ) {

        stopwatchStart =
            performance.now();


        stopwatchRunning =
            true;


        button.textContent =
            "Pause";


        button.classList.remove(
            "start"
        );


        button.classList.add(
            "stop"
        );


        stopwatchInterval =
            setInterval(
                updateStopwatch,
                20
            );

    }

    else {

        stopwatchElapsed +=
            performance.now() -
            stopwatchStart;


        stopwatchRunning =
            false;


        clearInterval(
            stopwatchInterval
        );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "stop"
        );


        button.classList.add(
            "start"
        );


        updateStopwatch();

    }

}


function resetStopwatch() {

    stopwatchRunning =
        false;


    clearInterval(
        stopwatchInterval
    );


    stopwatchElapsed =
        0;


    lapNumber =
        0;


    document.getElementById(
        "laps"
    ).innerHTML = "";


    const button =
        document.getElementById(
            "stopwatchButton"
        );


    button.textContent =
        "Démarrer";


    button.classList.remove(
        "stop"
    );


    button.classList.add(
        "start"
    );


    updateStopwatch();

}


function addLap() {

    if (
        !stopwatchRunning
    ) {

        return;

    }


    lapNumber++;


    const lap =
        document.createElement(
            "div"
        );


    lap.className =
        "lap";


    lap.innerHTML = `

        <span>
            Tour ${lapNumber}
        </span>

        <strong>
            ${
                document
                .getElementById(
                    "stopwatchDisplay"
                )
                .textContent
            }
        </strong>

    `;


    document.getElementById(
        "laps"
    ).prepend(lap);

}


/* ================================================
   DÉPART : 00:00:00
================================================ */

setTimer(
    0,
    0,
    0
);

updateSelection();

renderAlarms();

updateStopwatch();

</script>
