<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:100px;
}

header{padding:30px 24px 15px}
h1{font-size:34px;margin:0;font-weight:700}
.subtitle{color:#777;margin-top:5px}

.page{display:none;padding:15px 20px}
.page.active{display:block}

/* REVEILS */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:2px;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
}

.switch input{
position:absolute;
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#32d47a;
}

.switch input:checked+.slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
gap:10px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
padding:10px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
}

/* HORLOGE */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* CHRONO / MINUTEUR */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

.inputs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.inputs input{
width:100%;
height:60px;
background:#171717;
color:#fff;
border:1px solid #292929;
border-radius:17px;
text-align:center;
font-size:22px;
outline:none;
}

.label{
text-align:center;
font-size:11px;
color:#777;
margin-top:5px;
}

.lap-row{
padding:13px 5px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
color:#aaa;
}

/* NAVIGATION */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
padding:0;
}

nav button.active{
color:#32d47a;
}

.icon{
font-size:25px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- REVEILS -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button type="button" class="add" id="addAlarmButton">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>


<!-- HORLOGE -->

<section id="clock" class="page">

<div class="clock">

<div id="clockTime" class="clock-time">
00:00:00
</div>

<div id="clockDate" class="clock-date"></div>

</div>

</section>


<!-- CHRONO -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button type="button" class="dark" id="lapButton">
Tour
</button>

<button type="button" id="chronoStart" class="green">
Démarrer
</button>

</div>

<button type="button" class="dark full" id="chronoReset">
Réinitialiser
</button>

<div id="laps"></div>

</section>


<!-- MINUTEUR -->

<section id="timer" class="page">

<div id="timerDisplay" class="big-number">
00:05:00
</div>

<div class="inputs">

<div>
<input id="hours" type="number" min="0" value="0">
<div class="label">HEURES</div>
</div>

<div>
<input id="minutes" type="number" min="0" max="59" value="5">
<div class="label">MINUTES</div>
</div>

<div>
<input id="seconds" type="number" min="0" max="59" value="0">
<div class="label">SECONDES</div>
</div>

</div>

<button type="button" id="timerStart" class="green full">
Démarrer
</button>

<button type="button" class="dark full" id="timerReset">
Réinitialiser
</button>

</section>


<!-- NAVIGATION -->

<nav>

<button type="button" id="navAlarms" class="active">
<span class="icon">⏰</span>
Réveils
</button>

<button type="button" id="navClock">
<span class="icon">🕐</span>
Horloge
</button>

<button type="button" id="navChrono">
<span class="icon">⏱️</span>
Chrono
</button>

<button type="button" id="navTimer">
<span class="icon">⌛</span>
Minuteur
</button>

</nav>

</div>


<!-- MODAL REVEIL -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input id="alarmTime" type="time" value="07:00">

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button type="button" class="dark" id="closeAlarmButton">
Annuler
</button>

<button type="button" class="green" id="createAlarmButton">
Ajouter
</button>

</div>

</div>

</div>


<script>

/* =========================
   NAVIGATION
========================= */

const pageNames={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function showPage(name,save=true){

if(!pageNames[name]){
name="alarms";
}

document.querySelectorAll(".page")
.forEach(el=>{
el.classList.remove("active");
});

document.getElementById(name)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(el=>{
el.classList.remove("active");
});

const nav=document.getElementById(
"nav"+
name.charAt(0).toUpperCase()+
name.slice(1)
);

if(nav){
nav.classList.add("active");
}

document.getElementById("title")
.textContent=pageNames[name][0];

document.getElementById("subtitle")
.textContent=pageNames[name][1];

if(save){
localStorage.setItem("lastPage",name);
}

}


/* =========================
   HORLOGE
========================= */

function updateClock(){

const d=new Date();

document.getElementById("clockTime")
.textContent=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

let date=d.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

document.getElementById("clockDate")
.textContent=
date.charAt(0).toUpperCase()+
date.slice(1);

}

setInterval(updateClock,1000);

updateClock();


/* =========================
   REVEILS
========================= */

let alarms=[];

try{

alarms=
JSON.parse(
localStorage.getItem("myAlarms")||"[]"
);

}catch(e){

alarms=[];

}

function saveAlarms(){

localStorage.setItem(
"myAlarms",
JSON.stringify(alarms)
);

}


function openAlarm(){

if(
"Notification" in window &&
Notification.permission==="default"
){

try{
Notification.requestPermission();
}catch(e){}

}

document
.getElementById("modal")
.classList.add("show");

}


function closeAlarm(){

document
.getElementById("modal")
.classList.remove("show");

}


function createAlarm(){

const time=
document.getElementById("alarmTime").value;

const youtube=
document.getElementById("youtube")
.value
.trim();

if(!time)return;

alarms.push({

id:Date.now(),

time:time,

enabled:true,

youtube:youtube,

lastRing:""

});

saveAlarms();

renderAlarms();

document.getElementById("youtube")
.value="";

closeAlarm();

}


function removeAlarm(id){

alarms=
alarms.filter(a=>a.id!==id);

saveAlarms();

renderAlarms();

}


function switchAlarm(id){

const a=
alarms.find(x=>x.id===id);

if(!a)return;

a.enabled=!a.enabled;

saveAlarms();

renderAlarms();

}


function escapeHtml(text){

return String(text)
.replace(/[&<>"']/g,function(c){

return{

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}


function renderAlarms(){

const box=
document.getElementById("alarmList");

box.innerHTML="";

if(alarms.length===0){

box.innerHTML=
'<div class="empty">'+
'Aucun réveil<br><br>'+
'Appuie sur + pour créer ton premier réveil.'+
'</div>';

return;

}

alarms.sort(
(a,b)=>a.time.localeCompare(b.time)
);

alarms.forEach(a=>{

const div=
document.createElement("div");

div.className="alarm";

const musicButton=
a.youtube
?
'<button type="button" class="dark music-test" style="height:40px;padding:0 15px">🎵 Tester la musique</button>'
:
"";

div.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">
${escapeHtml(a.time)}
</div>

<div class="alarm-name">

${a.enabled
?"Réveil activé"
:"Réveil désactivé"}

${a.youtube
?" · 🎵 Musique"
:""}

</div>

</div>

<label class="switch">

<input
type="checkbox"
${a.enabled?"checked":""}
>

<span class="slider"></span>

</label>

</div>

<div class="alarm-actions">

${musicButton}

<button type="button" class="delete">
Supprimer
</button>

</div>

`;

div
.querySelector("input")
.addEventListener(
"change",
()=>switchAlarm(a.id)
);

div
.querySelector(".delete")
.addEventListener(
"click",
()=>removeAlarm(a.id)
);

if(a.youtube){

div
.querySelector(".music-test")
.addEventListener(
"click",
()=>openMusic(a.youtube)
);

}

box.appendChild(div);

});

}


/* =========================
   SON
========================= */

let audioCtx=null;

function ring(){

try{

audioCtx=
audioCtx||
new(
window.AudioContext||
window.webkitAudioContext
)();

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const now=
audioCtx.currentTime;

for(let i=0;i<6;i++){

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.frequency.value=
i%2===0?880:660;

osc.type="sine";

gain.gain.setValueAtTime(
.001,
now+i*.35
);

gain.gain.exponentialRampToValueAtTime(
.45,
now+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.35+.3
);

osc.connect(gain);

gain.connect(
audioCtx.destination
);

osc.start(now+i*.35);

osc.stop(now+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

try{

navigator.vibrate([
500,300,500,300,700,
300,500
]);

}catch(e){}

}

}


/* =========================
   NOTIFICATION
========================= */

function notify(title,text){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(
title,
{
body:text,
tag:"horloge-"+Date.now(),
requireInteraction:true
}
);

}catch(e){}

}

}


/* =========================
   YOUTUBE
========================= */

function getYoutubeId(url){

try{

const u=new URL(url);

if(
u.hostname.includes("youtu.be")
){

return u.pathname.substring(1);

}

if(
u.hostname.includes("youtube.com")
){

return u.searchParams.get("v");

}

}catch(e){}

return null;

}


function openMusic(url){

const id=
getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+
encodeURIComponent(id),
"_blank"
);

}

}


/* =========================
   VERIFICATION REVEILS
========================= */

setInterval(()=>{

const now=new Date();

const current=
String(now.getHours()).padStart(2,"0")+
":"+
String(now.getMinutes()).padStart(2,"0");

alarms.forEach(a=>{

if(
a.enabled &&
a.time===current &&
a.lastRing!==current
){

a.lastRing=current;

saveAlarms();

ring();

notify(
"⏰ Réveil",
"Il est "+current
);

if(a.youtube){

setTimeout(
()=>openMusic(a.youtube),
1000
);

}

}

});

},1000);


/* =========================
   CHRONOMETRE
   SAUVEGARDE
========================= */

let chronoRunning=false;

let chronoStartTime=0;

let chronoElapsed=0;

let chronoInterval=null;

let lapsData=[];


function chronoFormat(ms){

const m=
Math.floor(ms/60000);

const s=
Math.floor(
(ms%60000)/1000
);

const c=
Math.floor(
(ms%1000)/10
);

return(
String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0")+
"."+
String(c).padStart(2,"0")
);

}


function saveChrono(){

let elapsed=
chronoElapsed;

if(chronoRunning){

elapsed+=
Date.now()-chronoStartTime;

}

localStorage.setItem(
"chronoState",
JSON.stringify({

running:chronoRunning,

elapsed:elapsed,

laps:lapsData

})
);

}


function updateChrono(){

let value=
chronoElapsed;

if(chronoRunning){

value+=
Date.now()-chronoStartTime;

}

document
.getElementById("chronoDisplay")
.textContent=
chronoFormat(value);

saveChrono();

}


function startChrono(){

if(!chronoRunning){

chronoStartTime=
Date.now();

chronoRunning=true;

document
.getElementById("chronoStart")
.textContent=
"Pause";

}else{

chronoElapsed+=
Date.now()-chronoStartTime;

chronoRunning=false;

document
.getElementById("chronoStart")
.textContent=
"Démarrer";

}

clearInterval(
chronoInterval
);

if(chronoRunning){

chronoInterval=
setInterval(
updateChrono,
30
);

}

updateChrono();

saveChrono();

}


function lap(){

if(!chronoRunning)return;

const value=
chronoElapsed+
Date.now()-
chronoStartTime;

lapsData.unshift(value);

renderLaps();

saveChrono();

}


function renderLaps(){

const box=
document.getElementById("laps");

box.innerHTML="";

lapsData.forEach(
(value,index)=>{

const div=
document.createElement("div");

div.className=
"lap-row";

div.innerHTML=
"<span>Tour "+
(lapsData.length-index)+
"</span><span>"+
chronoFormat(value)+
"</span>";

box.appendChild(div);

}
);

}


function resetChrono(){

clearInterval(
chronoInterval
);

chronoInterval=null;

chronoRunning=false;

chronoElapsed=0;

chronoStartTime=0;

lapsData=[];

document
.getElementById("chronoDisplay")
.textContent=
"00:00.00";

document
.getElementById("chronoStart")
.textContent=
"Démarrer";

document
.getElementById("laps")
.innerHTML="";

localStorage.removeItem(
"chronoState"
);

}


function loadChrono(){

try{

const data=
JSON.parse(
localStorage.getItem(
"chronoState"
)||
"null"
);

if(!data)return;

chronoElapsed=
Number(data.elapsed)||0;

lapsData=
Array.isArray(data.laps)
?data.laps.map(Number)
:[];

if(data.running){

chronoRunning=true;

chronoStartTime=
Date.now();

document
.getElementById("chronoStart")
.textContent=
"Pause";

clearInterval(
chronoInterval
);

chronoInterval=
setInterval(
updateChrono,
30
);

}

renderLaps();

updateChrono();

}catch(e){}

}


/* =========================
   MINUTEUR
========================= */

let timerRunning=false;

let timerEnd=0;

let timerRemaining=300;

let timerInterval=null;


function timerFormat(s){

s=Math.max(
0,
Math.floor(s)
);

const h=
Math.floor(s/3600);

const m=
Math.floor(
(s%3600)/60
);

const sec=
s%60;

return(
String(h).padStart(2,"0")+
":"+
String(m).padStart(2,"0")+
":"+
String(sec).padStart(2,"0")
);

}


function saveTimer(){

localStorage.setItem(
"timerState",
JSON.stringify({

running:timerRunning,

end:timerEnd,

remaining:timerRemaining

})
);

}


function updateTimer(){

if(timerRunning){

timerRemaining=
Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

}

document
.getElementById("timerDisplay")
.textContent=
timerFormat(timerRemaining);

saveTimer();

}


function finishTimer(){

clearInterval(
timerInterval
);

timerInterval=null;

timerRunning=false;

timerRemaining=0;

document
.getElementById("timerStart")
.textContent=
"Démarrer";

updateTimer();

ring();

notify(
"⌛ Minuteur terminé",
"Le compte à rebours est terminé."
);

}


function startTimer(){

if(timerRunning){

timerRemaining=
Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

timerRunning=false;

clearInterval(
timerInterval
);

timerInterval=null;

document
.getElementById("timerStart")
.textContent=
"Reprendre";

saveTimer();

return;

}


if(timerRemaining<=0){

const h=
Number(
document.getElementById("hours").value
)||0;

const m=
Number(
document.getElementById("minutes").value
)||0;

const s=
Number(
document.getElementById("seconds").value
)||0;

timerRemaining=
h*3600+
m*60+
s;

}

if(timerRemaining<=0)return;

timerEnd=
Date.now()+
timerRemaining*1000;

timerRunning=true;

document
.getElementById("timerStart")
.textContent=
"Pause";

clearInterval(
timerInterval
);

timerInterval=
setInterval(()=>{

updateTimer();

if(timerRemaining<=0){

finishTimer();

}

},250);

updateTimer();

}


function resetTimer(){

clearInterval(
timerInterval
);

timerInterval=null;

timerRunning=false;

timerRemaining=300;

timerEnd=0;

document.getElementById("hours")
.value=0;

document.getElementById("minutes")
.value=5;

document.getElementById("seconds")
.value=0;

document
.getElementById("timerStart")
.textContent=
"Démarrer";

updateTimer();

}


function loadTimer(){

try{

const data=
JSON.parse(
localStorage.getItem(
"timerState"
)||
"null"
);

if(!data){

document
.getElementById("timerDisplay")
.textContent=
"00:05:00";

return;

}

timerRemaining=
Number(data.remaining);

if(!Number.isFinite(timerRemaining)){

timerRemaining=300;

}

if(
data.running &&
data.end &&
Number(data.end)>Date.now()
){

timerEnd=
Number(data.end);

timerRunning=true;

document
.getElementById("timerStart")
.textContent=
"Pause";

clearInterval(
timerInterval
);

timerInterval=
setInterval(()=>{

updateTimer();

if(timerRemaining<=0){

finishTimer();

}

},250);

}else if(data.running){

timerRemaining=0;

timerRunning=false;

}

updateTimer();

}catch(e){}

}


/* =========================
   BOUTONS
========================= */

document
.getElementById("navAlarms")
.addEventListener(
"click",
()=>showPage("alarms")
);

document
.getElementById("navClock")
.addEventListener(
"click",
()=>showPage("clock")
);

document
.getElementById("navChrono")
.addEventListener(
"click",
()=>showPage("chrono")
);

document
.getElementById("navTimer")
