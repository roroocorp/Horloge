<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
overflow-x:hidden;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

.app{
width:100%;
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:100px;
}

header{
padding:30px 24px 15px;
}

h1{
font-size:34px;
margin:0;
font-weight:700;
}

.subtitle{
color:#777;
margin-top:5px;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:2px;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked + .slider{
background:#32d47a;
}

.switch input:checked + .slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
padding:10px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
}

/* =========================
   HORLOGE
========================= */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* =========================
   CHRONO / MINUTEUR
========================= */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

.inputs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.inputs input{
width:100%;
height:60px;
background:#171717;
color:#fff;
border:1px solid #292929;
border-radius:17px;
text-align:center;
font-size:22px;
outline:none;
}

.label{
text-align:center;
font-size:11px;
color:#777;
margin-top:5px;
}

/* =========================
   NAVIGATION
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
padding:0;
}

nav button.active{
color:#32d47a;
}

.icon{
font-size:25px;
}

/* =========================
   MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- REVEILS -->
<section id="alarms" class="page active">

<div id="alarmList"></div>

<button type="button" id="addAlarmButton" class="add">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>

<!-- HORLOGE -->
<section id="clock" class="page">

<div class="clock">

<div id="clockTime" class="clock-time">
00:00:00
</div>

<div id="clockDate" class="clock-date"></div>

</div>

</section>

<!-- CHRONO -->
<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button type="button" id="lapButton" class="dark">
Tour
</button>

<button type="button" id="chronoStart" class="green">
Démarrer
</button>

</div>

<button type="button" id="chronoReset" class="dark full">
Réinitialiser
</button>

<div id="laps"></div>

</section>

<!-- MINUTEUR -->
<section id="timer" class="page">

<div id="timerDisplay" class="big-number">
00:05:00
</div>

<div class="inputs">

<div>
<input id="hours" type="number" min="0" value="0">
<div class="label">HEURES</div>
</div>

<div>
<input id="minutes" type="number" min="0" max="59" value="5">
<div class="label">MINUTES</div>
</div>

<div>
<input id="seconds" type="number" min="0" max="59" value="0">
<div class="label">SECONDES</div>
</div>

</div>

<button type="button" id="timerStart" class="green full">
Démarrer
</button>

<button type="button" id="timerReset" class="dark full">
Réinitialiser
</button>

</section>

<!-- NAVIGATION -->
<nav>

<button type="button" id="navAlarms" class="active">
<span class="icon">⏰</span>
Réveils
</button>

<button type="button" id="navClock">
<span class="icon">🕐</span>
Horloge
</button>

<button type="button" id="navChrono">
<span class="icon">⏱️</span>
Chrono
</button>

<button type="button" id="navTimer">
<span class="icon">⌛</span>
Minuteur
</button>

</nav>

</div>

<!-- MODAL REVEIL -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input id="alarmTime" type="time" value="07:00">

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button type="button" id="closeAlarmButton" class="dark">
Annuler
</button>

<button type="button" id="createAlarmButton" class="green">
Ajouter
</button>

</div>

</div>

</div>

<script>

/* =====================================================
   OUTILS LOCALSTORAGE
===================================================== */

function storageGet(key, fallback){

try{
const value=localStorage.getItem(key);
return value===null ? fallback : value;
}catch(e){
return fallback;
}

}

function storageSet(key,value){

try{
localStorage.setItem(key,value);
}catch(e){}

}

function storageRemove(key){

try{
localStorage.removeItem(key);
}catch(e){}

}


/* =====================================================
   NAVIGATION
   IMPORTANT : aucune fonction "page()" dans onclick.
===================================================== */

const pageNames={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function showPage(name){

const pages=document.querySelectorAll(".page");

pages.forEach(function(section){
section.classList.remove("active");
});

const selected=document.getElementById(name);

if(!selected){
return;
}

selected.classList.add("active");

const navButtons=document.querySelectorAll("nav button");

navButtons.forEach(function(button){
button.classList.remove("active");
});

const navButton=document.getElementById("nav"+name.charAt(0).toUpperCase()+name.slice(1));

if(navButton){
navButton.classList.add("active");
}

document.getElementById("title").textContent=pageNames[name][0];
document.getElementById("subtitle").textContent=pageNames[name][1];

storageSet("lastPage",name);
}


/* =====================================================
   BOUTONS NAVIGATION
===================================================== */

document.getElementById("navAlarms").addEventListener("click",function(){
showPage("alarms");
});

document.getElementById("navClock").addEventListener("click",function(){
showPage("clock");
});

document.getElementById("navChrono").addEventListener("click",function(){
showPage("chrono");
});

document.getElementById("navTimer").addEventListener("click",function(){
showPage("timer");
});


/* =====================================================
   HORLOGE
===================================================== */

function updateClock(){

const d=new Date();

const time=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

document.getElementById("clockTime").textContent=time;

let date=d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

date=date.charAt(0).toUpperCase()+date.slice(1);

document.getElementById("clockDate").textContent=date;
}

updateClock();

setInterval(updateClock,1000);


/* =====================================================
   REVEILS
===================================================== */

let alarms=[];

try{
alarms=JSON.parse(storageGet("myAlarms","[]"));

if(!Array.isArray(alarms)){
alarms=[];
}

}catch(e){
alarms=[];
}

function saveAlarms(){
storageSet("myAlarms",JSON.stringify(alarms));
}

function openAlarm(){

const modal=document.getElementById("modal");

modal.classList.add("show");

}

function closeAlarm(){

document.getElementById("modal").classList.remove("show");

}

document.getElementById("addAlarmButton").addEventListener("click",function(){
openAlarm();
});

document.getElementById("closeAlarmButton").addEventListener("click",function(){
closeAlarm();
});

document.getElementById("createAlarmButton").addEventListener("click",function(){

const time=document.getElementById("alarmTime").value;

const youtube=document.getElementById("youtube").value.trim();

if(!time){
return;
}

alarms.push({
id:Date.now(),
time:time,
enabled:true,
youtube:youtube,
lastRing:""
});

saveAlarms();

renderAlarms();

document.getElementById("youtube").value="";

closeAlarm();

});


function removeAlarm(id){

alarms=alarms.filter(function(a){
return a.id!==id;
});

saveAlarms();

renderAlarms();

}


function switchAlarm(id){

const alarm=alarms.find(function(a){
return a.id===id;
});

if(!alarm){
return;
}

alarm.enabled=!alarm.enabled;

saveAlarms();

renderAlarms();

}


function renderAlarms(){

const box=document.getElementById("alarmList");

box.innerHTML="";

if(alarms.length===0){

box.innerHTML=
'<div class="empty">'+
'Aucun réveil<br><br>'+
'Appuie sur + pour créer ton premier réveil.'+
'</div>';

return;
}

alarms.sort(function(a,b){
return a.time.localeCompare(b.time);
});

alarms.forEach(function(a){

const div=document.createElement("div");

div.className="alarm";

const musicText=a.youtube ? " · 🎵 Musique" : "";

div.innerHTML=
'<div class="alarm-top">'+

'<div>'+
'<div class="alarm-time">'+a.time+'</div>'+
'<div class="alarm-name">'+
(a.enabled ? "Réveil activé" : "Réveil désactivé")+
musicText+
'</div>'+
'</div>'+

'<label class="switch">'+
'<input type="checkbox" '+(a.enabled ? "checked" : "")+'>'+
'<span class="slider"></span>'+
'</label>'+

'</div>'+

'<div class="alarm-actions">'+

(a.youtube ?
'<button type="button" class="dark musicButton" style="height:40px;padding:0 15px">'+
'🎵 Tester la musique'+
'</button>'
:
"")+

'<button type="button" class="delete deleteButton">'+
'Supprimer'+
'</button>'+

'</div>';

const checkbox=div.querySelector("input");

checkbox.addEventListener("change",function(){
switchAlarm(a.id);
});

const deleteButton=div.querySelector(".deleteButton");

deleteButton.addEventListener("click",function(){
removeAlarm(a.id);
});

if(a.youtube){

const musicButton=div.querySelector(".musicButton");

musicButton.addEventListener("click",function(){
openMusic(a.youtube);
});

}

box.appendChild(div);

});

}

renderAlarms();


/* =====================================================
   SON
===================================================== */

let audioCtx=null;

function ring(){

try{

audioCtx=
audioCtx||
new (window.AudioContext||window.webkitAudioContext)();

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const now=audioCtx.currentTime;

for(let i=0;i<6;i++){

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=i%2===0 ? 880 : 660;

osc.type="sine";

gain.gain.setValueAtTime(.001,now+i*.35);

gain.gain.exponentialRampToValueAtTime(
.45,
now+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.35+.3
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(now+i*.35);
osc.stop(now+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700,
300,500
]);

}

}


/* =====================================================
   NOTIFICATION
===================================================== */

function notify(title,text){

if("Notification" in window &&
Notification.permission==="granted"){

try{

new Notification(title,{
body:text,
tag:"horloge-"+Date.now(),
requireInteraction:true
});

}catch(e){}

}

}


/* =====================================================
   YOUTUBE
===================================================== */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;
}


function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}


/* =====================================================
   VERIFICATION REVEILS
===================================================== */

setInterval(function(){

const now=new Date();

const current=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0");

alarms.forEach(function(a){

if(
a.enabled &&
a.time===current &&
a.lastRing!==current
){

a.lastRing=current;

saveAlarms();

ring();

notify(
"⏰ Réveil",
"Il est "+current
);

if(a.youtube){

setTimeout(function(){
openMusic(a.youtube);
},1000);

}

}

});

},1000);


/* =====================================================
   CHRONOMETRE
===================================================== */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;


function chronoFormat(ms){

const m=Math.floor(ms/60000);

const s=Math.floor((ms%60000)/1000);

const c=Math.floor((ms%1000)/10);

return(
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")+"."+
String(c).padStart(2,"0")
);

}


function updateChrono(){

let value=chronoElapsed;

if(chronoRunning){

value+=Date.now()-chronoStartTime;

}

document.getElementById("chronoDisplay").textContent=
chronoFormat(value);

storageSet("chronoElapsed",String(chronoElapsed));
storageSet("chronoRunning",String(chronoRunning));

if(chronoRunning){

storageSet("chronoStart",String(chronoStartTime));

}

}


function startChrono(){

if(!chronoRunning){

chronoStartTime=Date.now();

chronoRunning=true;

document.getElementById("chronoStart").textContent="Pause";

}else{

chronoElapsed+=Date.now()-chronoStartTime;

chronoRunning=false;

document.getElementById("chronoStart").textContent="Démarrer";

}

clearInterval(chronoInterval);

if(chronoRunning){

chronoInterval=setInterval(updateChrono,30);

}

updateChrono();

}


function lap(){

if(!chronoRunning){
return;
}

const value=
chronoElapsed+
Date.now()-chronoStartTime;

const div=document.createElement("div");

div.style.cssText=
"padding:13px 5px;border-bottom:1px solid #222;display:flex;justify-content:space-between;color:#aaa";

div.innerHTML=
"<span>Tour</span>"+
"<span>"+chronoFormat(value)+"</span>";

document.getElementById("laps").prepend(div);

}


function resetChrono(){

clearInterval(chronoInterval);

chronoRunning=false;

chronoElapsed=0;

chronoStartTime=0;

document.getElementById("chronoDisplay").textContent="00:00.00";

document.getElementById("chronoStart").textContent="Démarrer";

document.getElementById("laps").innerHTML="";

storageRemove("chronoElapsed");
storageRemove("chronoRunning");
storageRemove("chronoStart");

}


function loadChrono(){

const savedElapsed=Number(
storageGet("chronoElapsed","0")
);

const savedRunning=
storageGet("chronoRunning","false")==="true";

const savedStart=Number(
storageGet("chronoStart","0")
);

if(!savedElapsed && !savedRunning){
return;
}

chronoElapsed=savedElapsed;

if(savedRunning && savedStart){

chronoStartTime=savedStart;

if(Date.now()>=chronoStartTime){

chronoRunning=true;

document.getElementById("chronoStart").textContent="Pause";

chronoInterval=setInterval(updateChrono,30);

}

}

updateChrono();

}

loadChrono();


document.getElementById("chronoStart").addEventListener("click",function(){
startChrono();
});

document.getElementById("lapButton").addEventListener("click",function(){
lap();
});

document.getElementById("chronoReset").addEventListener("click",function(){
resetChrono();
});


/* =====================================================
   MINUTEUR
===================================================== */

let timerRunning=false;
let timerEnd=0;
let timerRemaining=300;
let timerInterval=null;


function timerFormat(s){

s=Math.max(0,Math.floor(s));

const h=Math.floor(s/3600);

const m=Math.floor((s%3600)/60);

const sec=s%60;

return(
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(sec).padStart(2,"0")
);

}


function saveTimer(){

storageSet(
"timerState",
JSON.stringify({
running:timerRunning,
end:timerEnd,
remaining:timerRemaining
})
);

}


function updateTimer(){

if(timerRunning){

timerRemaining=Math.max(
0,
Math.ceil((timerEnd-Date.now())/1000)
);

}

document.getElementById("timerDisplay").textContent=
timerFormat(timerRemaining);

saveTimer();

}


function startTimer(){

if(timerRunning){

timerRemaining=Math.max(
0,
Math.ceil((timerEnd-Date.now())/1000)
);

timerRunning=false;

clearInterval(timerInterval);

document.getElementById("timerStart").textContent="Reprendre";

saveTimer();

return;

}


if(timerRemaining<=0){

const h=
Number(document.getElementById("hours").value)||0;

const m=
Number(document.getElementById("minutes").value)||0;

const s=
Number(document.getElementById("seconds").value)||0;

timerRemaining=h*3600+m*60+s;

}


if(timerRemaining<=0){

return;

}


timerEnd=
Date.now()+timerRemaining*1000;

timerRunning=true;

document.getElementById("timerStart").textContent="Pause";

clearInterval(timerInterval);

timerInterval=setInterval(function(){

updateTimer();

if(timerRemaining<=0){

clearInterval(timerInterval);

timerRunning=false;

document.getElementById("timerStart").textContent="Démarrer";

ring();

notify(
"⌛ Minuteur terminé",
"Le compte à rebours est terminé."
);

saveTimer();

}

},250);

saveTimer();

}


function resetTimer(){

clearInterval(timerInterval);

timerRunning=false;

timerRemaining=300;

timerEnd=0;

document.getElementById("hours").value=0;

document.getElementById("minutes").value=5;

document.getElementById("seconds").value=0;

document.getElementById("timerStart").textContent="Démarrer";

updateTimer();

}
