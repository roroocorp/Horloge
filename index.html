<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horloge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 25px 18px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 25px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #1c1c1e;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 35px;
    }

    .tabs button {
      border: none;
      background: transparent;
      color: #888;
      padding: 11px 3px;
      border-radius: 11px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #3a3a3c;
      color: white;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* HORLOGE */

    .clock {
      text-align: center;
    }

    .time {
      font-size: 70px;
      font-weight: 200;
      letter-spacing: -4px;
      margin-top: 35px;
    }

    .date {
      color: #888;
      font-size: 17px;
      margin-top: 10px;
    }

    .clock-circle {
      width: 220px;
      height: 220px;
      border: 2px solid #333;
      border-radius: 50%;
      margin: auto;
      position: relative;
      background: radial-gradient(circle, #171717, #050505);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      border-radius: 5px;
    }

    .hour {
      width: 5px;
      height: 55px;
      background: white;
    }

    .minute {
      width: 4px;
      height: 75px;
      background: white;
    }

    .second {
      width: 2px;
      height: 85px;
      background: #ff453a;
    }

    .center {
      width: 10px;
      height: 10px;
      background: #ff453a;
      border: 2px solid white;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* CHRONOMÈTRE */

    .chrono {
      text-align: center;
      margin-top: 70px;
    }

    .chrono-time {
      font-size: 70px;
      font-weight: 200;
      letter-spacing: -4px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 55px;
    }

    .round {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #202022;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .start {
      background: #173b23;
      color: #30d158;
    }

    .stop {
      background: #401b1b;
      color: #ff453a;
    }

    .laps {
      margin-top: 35px;
      border-top: 1px solid #333;
    }

    .lap {
      display: flex;
      justify-content: space-between;
      padding: 15px 5px;
      border-bottom: 1px solid #333;
    }

    .lap span {
      color: #888;
    }

    /* MINUTEUR */

    .timer {
      text-align: center;
      margin-top: 50px;
    }

    .timer-time {
      font-size: 80px;
      font-weight: 200;
      letter-spacing: -4px;
      margin: 40px 0;
    }

    .inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    input {
      width: 90px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: white;
      text-align: center;
      font-size: 25px;
    }

    .colon {
      font-size: 30px;
      color: #777;
    }

    /* MONDE */

    .city {
      background: #151515;
      border: 1px solid #2c2c2e;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .city-name {
      font-size: 21px;
    }

    .country {
      color: #888;
      font-size: 14px;
    }

    .city-time {
      font-size: 34px;
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Horloge</h1>

  <div class="tabs">
    <button class="active" onclick="showPage('clock', this)">
      Horloge
    </button>

    <button onclick="showPage('world', this)">
      Monde
    </button>

    <button onclick="showPage('chrono', this)">
      Chrono
    </button>

    <button onclick="showPage('timer', this)">
      Minuteur
    </button>
  </div>


  <!-- HORLOGE -->

  <div id="clock" class="page active">

    <div class="clock">

      <div class="clock-circle">

        <div id="hour" class="hand hour"></div>
        <div id="minute" class="hand minute"></div>
        <div id="second" class="hand second"></div>

        <div class="center"></div>

      </div>

      <div id="time" class="time">
        00:00:00
      </div>

      <div id="date" class="date">
        Chargement...
      </div>

    </div>

  </div>


  <!-- MONDE -->

  <div id="world" class="page">

    <div class="city">
      <div class="city-name">🇫🇷 Paris</div>
      <div class="country">France</div>
      <div id="paris" class="city-time">00:00:00</div>
    </div>

    <div class="city">
      <div class="city-name">🇺🇸 New York</div>
      <div class="country">États-Unis</div>
      <div id="newyork" class="city-time">00:00:00</div>
    </div>

    <div class="city">
      <div class="city-name">🇯🇵 Tokyo</div>
      <div class="country">Japon</div>
      <div id="tokyo" class="city-time">00:00:00</div>
    </div>

  </div>


  <!-- CHRONOMÈTRE -->

  <div id="chrono" class="page">

    <div class="chrono">

      <div id="chronoTime" class="chrono-time">
        00:00:00.00
      </div>

      <div class="buttons">

        <button class="round" onclick="lap()">
          Tour
        </button>

        <button id="chronoButton"
                class="round start"
                onclick="startChrono()">
          Démarrer
        </button>

        <button class="round" onclick="resetChrono()">
          Reset
        </button>

      </div>

      <div id="laps" class="laps"></div>

    </div>

  </div>


  <!-- MINUTEUR -->

  <div id="timer" class="page">

    <div class="timer">

      <div id="timerTime" class="timer-time">
        05:00
      </div>

      <div class="inputs">

        <input
          id="minutes"
          type="number"
          min="0"
          value="5"
        >

        <div class="colon">:</div>

        <input
          id="seconds"
          type="number"
          min="0"
          max="59"
          value="0"
        >

      </div>

      <div class="buttons">

        <button class="round"
                onclick="resetTimer()">
          Reset
        </button>

        <button id="timerButton"
                class="round start"
                onclick="startTimer()">
          Démarrer
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  /* NAVIGATION */

  function showPage(page, button) {

    document.querySelectorAll(".page")
      .forEach(p => p.classList.remove("active"));

    document.querySelectorAll(".tabs button")
      .forEach(b => b.classList.remove("active"));

    document.getElementById(page)
      .classList.add("active");

    button.classList.add("active");
  }


  /* HORLOGE */

  function updateClock() {

    const now = new Date();

    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    document.getElementById("time").textContent =
      String(h).padStart(2,"0") + ":" +
      String(m).padStart(2,"0") + ":" +
      String(s).padStart(2,"0");

    document.getElementById("date").textContent =
      now.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    document.getElementById("hour").style.transform =
      `translateX(-50%) rotate(${(h % 12) * 30 + m * 0.5}deg)`;

    document.getElementById("minute").style.transform =
      `translateX(-50%) rotate(${m * 6 + s * 0.1}deg)`;

    document.getElementById("second").style.transform =
      `translateX(-50%) rotate(${s * 6}deg)`;
  }

  setInterval(updateClock, 1000);
  updateClock();


  /* HORLOGES MONDIALES */

  function updateWorld() {

    const now = new Date();

    function getTime(zone) {

      return new Intl.DateTimeFormat("fr-FR", {
        timeZone: zone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(now);

    }

    document.getElementById("paris").textContent =
      getTime("Europe/Paris");

    document.getElementById("newyork").textContent =
      getTime("America/New_York");

    document.getElementById("tokyo").textContent =
      getTime("Asia/Tokyo");
  }

  setInterval(updateWorld, 1000);
  updateWorld();


  /* CHRONOMÈTRE */

  let chronoRunning = false;
  let chronoStart = 0;
  let chronoElapsed = 0;
  let chronoInterval;
  let lapNumber = 0;

  function updateChrono() {

    let elapsed = chronoElapsed;

    if (chronoRunning) {
      elapsed += performance.now() - chronoStart;
    }

    const minutes =
      Math.floor(elapsed / 60000);

    const seconds =
      Math.floor(elapsed / 1000) % 60;

    const centiseconds =
      Math.floor(elapsed / 10) % 100;

    document.getElementById("chronoTime").textContent =
      String(minutes).padStart(2,"0") + ":" +
      String(seconds).padStart(2,"0") + "." +
      String(centiseconds).padStart(2,"0");
  }


  function startChrono() {

    if (!chronoRunning) {

      chronoStart = performance.now();

      chronoRunning = true;

      document.getElementById("chronoButton").textContent =
        "Pause";

      document.getElementById("chronoButton")
        .classList.remove("start");

      document.getElementById("chronoButton")
        .classList.add("stop");

      chronoInterval =
        setInterval(updateChrono, 20);

    } else {

      chronoElapsed +=
        performance.now() - chronoStart;

      chronoRunning = false;

      clearInterval(chronoInterval);

      document.getElementById("chronoButton")
        .textContent = "Démarrer";

      document.getElementById("chronoButton")
        .classList.remove("stop");

      document.getElementById("chronoButton")
        .classList.add("start");

      updateChrono();
    }
  }


  function resetChrono() {

    chronoRunning = false;

    clearInterval(chronoInterval);

    chronoElapsed = 0;

    lapNumber = 0;

    document.getElementById("laps").innerHTML = "";

    document.getElementById("chronoButton")
      .textContent = "Démarrer";

    document.getElementById("chronoButton")
      .classList.remove("stop");

    document.getElementById("chronoButton")
      .classList.add("start");

    updateChrono();
  }


  function lap() {

    if (!chronoRunning) return;

    lapNumber++;

    const time =
      document.getElementById("chronoTime").textContent;

    const row =
      document.createElement("div");

    row.className = "lap";

    row.innerHTML =
      `<span>Tour ${lapNumber}</span>
       <strong>${time}</strong>`;

    document.getElementById("laps")
      .prepend(row);
  }


  /* MINUTEUR */

  let timerRunning = false;
  let timerRemaining = 300000;
  let timerEnd;
  let timerInterval;


  function getTimerValue() {

    const minutes =
      Number(document.getElementById("minutes").value) || 0;

    const seconds =
      Number(document.getElementById("seconds").value) || 0;

    return (minutes * 60 + seconds) * 1000;
  }


  function updateTimerDisplay() {

    const total =
      Math.ceil(timerRemaining / 1000);

    const minutes =
      Math.floor(total / 60);

    const seconds =
      total % 60;

    document.getElementById("timerTime").textContent =
      String(minutes).padStart(2,"0") + ":" +
      String(seconds).padStart(2,"0");
  }


  function startTimer() {

    if (!timerRunning) {

      if (timerRemaining <= 0) {
        timerRemaining = getTimerValue();
      }

      if (timerRemaining <= 0) return;

      timerEnd =
        Date.now() + timerRemaining;

      timerRunning = true;

      document.getElementById("timerButton")
        .textContent = "Pause";

      document.getElementById("timerButton")
        .classList.remove("start");

      document.getElementById("timerButton")
        .classList.add("stop");

      timerInterval =
        setInterval(() => {

          timerRemaining =
            timerEnd - Date.now();

          updateTimerDisplay();

          if (timerRemaining <= 0) {

            timerRemaining = 0;

            timerRunning = false;

            clearInterval(timerInterval);

            document.getElementById("timerButton")
              .textContent = "Démarrer";

            document.getElementById("timerButton")
              .classList.remove("stop");

            document.getElementById("timerButton")
              .classList.add("start");

            alert("⏰ Temps écoulé !");
          }

        }, 100);

    } else {

      timerRemaining =
        timerEnd - Date.now();

      timerRunning = false;

      clearInterval(timerInterval);

      document.getElementById("timerButton")
        .textContent = "Démarrer";

      document.getElementById("timerButton")
        .classList.remove("stop");

      document.getElementById("timerButton")
        .classList.add("start");

      updateTimerDisplay();
    }
  }


  function resetTimer() {

    timerRunning = false;

    clearInterval(timerInterval);

    timerRemaining = getTimerValue();

    document.getElementById("timerButton")
      .textContent = "Démarrer";

    document.getElementById("timerButton")
      .classList.remove("stop");

    document.getElementById("timerButton")
      .classList.add("start");

    updateTimerDisplay();
  }


  document.getElementById("minutes")
    .addEventListener("input", () => {
      if (!timerRunning) {
        timerRemaining = getTimerValue();
        updateTimerDisplay();
      }
    });

  document.getElementById("seconds")
    .addEventListener("input", () => {
      if (!timerRunning) {
        timerRemaining = getTimerValue();
        updateTimerDisplay();
      }
    });


  updateChrono();
  updateTimerDisplay();

</script>

</body>
          </html>
