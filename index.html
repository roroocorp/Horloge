<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:105px;
}

header{
  padding:30px 24px 15px;
}

h1{
  font-size:34px;
  margin:0;
  font-weight:700;
}

.subtitle{
  color:#777;
  margin-top:5px;
}

.page{
  display:none;
  padding:15px 20px;
  width:100%;
}

.page.active{
  display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
  background:#171717;
  border-radius:22px;
  padding:20px;
  margin-bottom:12px;
}

.alarm-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.alarm-time{
  font-size:54px;
  font-weight:300;
  letter-spacing:-2px;
}

.alarm-name{
  color:#888;
  font-size:14px;
  margin-top:2px;
}

.switch{
  width:54px;
  height:32px;
  position:relative;
  display:inline-block;
  flex-shrink:0;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#444;
  border-radius:30px;
}

.slider:before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#32d47a;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

.alarm-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
  gap:10px;
}

.delete{
  border:0;
  background:none;
  color:#ff5555;
  font-size:14px;
  padding:10px;
}

.add{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#32d47a;
  font-size:34px;
  color:#001b0d;
  display:block;
  margin:25px auto 5px;
}

.add:active,
.green:active,
.dark:active{
  transform:scale(.96);
}

/* =========================
   HORLOGE
========================= */

.clock{
  text-align:center;
  padding-top:70px;
}

.clock-time{
  font-size:78px;
  font-weight:200;
  letter-spacing:-5px;
  font-variant-numeric:tabular-nums;
}

.clock-date{
  font-size:18px;
  color:#888;
  margin-top:8px;
}

/* =========================
   CHRONO / MINUTEUR
========================= */

.big-number{
  font-size:68px;
  font-weight:200;
  text-align:center;
  letter-spacing:-4px;
  margin:75px 0 50px;
  font-variant-numeric:tabular-nums;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.green{
  background:#32d47a;
  color:#001b0d;
  border:0;
  border-radius:18px;
  height:58px;
  font-size:17px;
  font-weight:700;
}

.dark{
  background:#202020;
  color:#fff;
  border:0;
  border-radius:18px;
  height:58px;
  font-size:17px;
  font-weight:600;
}

.full{
  width:100%;
  margin-top:12px;
}

.inputs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.inputs input{
  width:100%;
  height:60px;
  background:#171717;
  color:#fff;
  border:1px solid #292929;
  border-radius:17px;
  text-align:center;
  font-size:22px;
  outline:none;
}

.label{
  text-align:center;
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.lap-row{
  padding:13px 5px;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  color:#aaa;
}

/* =========================
   NAVIGATION
========================= */

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  width:100%;
  max-width:520px;
  height:82px;
  margin:auto;
  background:#111;
  border-top:1px solid #222;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:9999;
}

nav button{
  appearance:none;
  -webkit-appearance:none;
  background:none;
  border:0;
  outline:none;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:0;
  padding:0;
}

nav button.active{
  color:#32d47a;
}

.icon{
  font-size:25px;
  line-height:1;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:flex-end;
  z-index:10000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#171717;
  border-radius:28px 28px 0 0;
  padding:25px 20px 35px;
}

.modal-box h2{
  margin:0 0 20px;
}

.modal-box input[type=time]{
  width:100%;
  height:75px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:18px;
  font-size:40px;
  text-align:center;
  color-scheme:dark;
}

.modal-box input[type=text]{
  width:100%;
  height:52px;
  margin-top:12px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:15px;
  padding:0 14px;
  outline:none;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.empty{
  text-align:center;
  color:#666;
  padding:60px 20px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1 id="title">Réveils</h1>
  <div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- =========================
     REVEILS
========================= -->

<section id="alarms" class="page active">

  <div id="alarmList"></div>

  <button id="addAlarmButton" class="add" type="button">+</button>

  <div style="text-align:center;color:#777">
    Ajouter un réveil
  </div>

</section>

<!-- =========================
     HORLOGE
========================= -->

<section id="clock" class="page">

  <div class="clock">

    <div id="clockTime" class="clock-time">
      00:00:00
    </div>

    <div id="clockDate" class="clock-date"></div>

  </div>

</section>

<!-- =========================
     CHRONO
========================= -->

<section id="chrono" class="page">

  <div id="chronoDisplay" class="big-number">
    00:00.00
  </div>

  <div class="buttons">

    <button id="lapButton" class="dark" type="button">
      Tour
    </button>

    <button id="chronoStart" class="green" type="button">
      Démarrer
    </button>

  </div>

  <button id="chronoReset" class="dark full" type="button">
    Réinitialiser
  </button>

  <div id="laps"></div>

</section>

<!-- =========================
     MINUTEUR
========================= -->

<section id="timer" class="page">

  <div id="timerDisplay" class="big-number">
    00:05:00
  </div>

  <div class="inputs">

    <div>
      <input id="hours" type="number" min="0" value="0">
      <div class="label">HEURES</div>
    </div>

    <div>
      <input id="minutes" type="number" min="0" max="59" value="5">
      <div class="label">MINUTES</div>
    </div>

    <div>
      <input id="seconds" type="number" min="0" max="59" value="0">
      <div class="label">SECONDES</div>
    </div>

  </div>

  <button id="timerStart" class="green full" type="button">
    Démarrer
  </button>

  <button id="timerReset" class="dark full" type="button">
    Réinitialiser
  </button>

</section>

<!-- =========================
     NAV
========================= -->

<nav>

  <button id="navAlarms" class="active" data-page="alarms" type="button">
    <span class="icon">⏰</span>
    Réveils
  </button>

  <button id="navClock" data-page="clock" type="button">
    <span class="icon">🕐</span>
    Horloge
  </button>

  <button id="navChrono" data-page="chrono" type="button">
    <span class="icon">⏱️</span>
    Chrono
  </button>

  <button id="navTimer" data-page="timer" type="button">
    <span class="icon">⌛</span>
    Minuteur
  </button>

</nav>

</div>

<!-- =========================
     MODAL REVEIL
========================= -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2>Nouveau réveil</h2>

    <input
      id="alarmTime"
      type="time"
      value="07:00"
    >

    <input
      id="youtube"
      type="text"
      placeholder="Lien YouTube de la musique (facultatif)"
    >

    <div class="modal-buttons">

      <button id="closeAlarmButton" class="dark" type="button">
        Annuler
      </button>

      <button id="createAlarmButton" class="green" type="button">
        Ajouter
      </button>

    </div>

  </div>

</div>

<script>
"use strict";

/* =====================================================
   DONNEES DES PAGES
===================================================== */

const pageNames = {
  alarms:["Réveils","Vos alarmes"],
  clock:["Horloge","Heure locale"],
  chrono:["Chronomètre","Mesure du temps"],
  timer:["Minuteur","Compte à rebours"]
};


/* =====================================================
   NAVIGATION
   Aucun onclick ici : les boutons sont gérés par JS.
===================================================== */

function showPage(name){

  if(!pageNames[name]){
    return;
  }

  const pages = document.querySelectorAll(".page");

  pages.forEach(function(section){
    section.classList.remove("active");
  });

  const selectedPage = document.getElementById(name);

  if(selectedPage){
    selectedPage.classList.add("active");
  }

  const navButtons = document.querySelectorAll("nav button");

  navButtons.forEach(function(button){
    button.classList.remove("active");
  });

  const selectedButton =
    document.querySelector('nav button[data-page="' + name + '"]');

  if(selectedButton){
    selectedButton.classList.add("active");
  }

  document.getElementById("title").textContent =
    pageNames[name][0];

  document.getElementById("subtitle").textContent =
    pageNames[name][1];

  try{
    localStorage.setItem("lastPage",name);
  }catch(e){}
}


/* =====================================================
   BRANCHEMENT DES BOUTONS DE NAVIGATION
===================================================== */

document.querySelectorAll("nav button[data-page]")
.forEach(function(button){

  button.addEventListener("click",function(event){

    event.preventDefault();
    event.stopPropagation();

    const name = button.getAttribute("data-page");

    showPage(name);

  });

});


/* =====================================================
   HORLOGE
===================================================== */

function updateClock(){

  const d = new Date();

  const time =
    String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0") + ":" +
    String(d.getSeconds()).padStart(2,"0");

  document.getElementById("clockTime").textContent = time;

  let date = d.toLocaleDateString("fr-FR",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });

  date =
    date.charAt(0).toUpperCase() +
    date.slice(1);

  document.getElementById("clockDate").textContent = date;
}

updateClock();

setInterval(updateClock,1000);


/* =====================================================
   REVEILS
===================================================== */

let alarms = [];

try{

  alarms =
    JSON.parse(
      localStorage.getItem("myAlarms") || "[]"
    );

  if(!Array.isArray(alarms)){
    alarms=[];
  }

}catch(e){

  alarms=[];

}


function saveAlarms(){

  try{
    localStorage.setItem(
      "myAlarms",
      JSON.stringify(alarms)
    );
  }catch(e){}

}


function openAlarm(){

  if(
    "Notification" in window &&
    Notification.permission === "default"
  ){

    Notification.requestPermission().catch(function(){});

  }

  document.getElementById("modal")
    .classList.add("show");
}


function closeAlarm(){

  document.getElementById("modal")
    .classList.remove("show");

}


function createAlarm(){

  const time =
    document.getElementById("alarmTime").value;

  const youtube =
    document.getElementById("youtube").value.trim();

  if(!time){
    return;
  }

  alarms.push({
    id:Date.now(),
    time:time,
    enabled:true,
    youtube:youtube,
    lastRing:""
  });

  saveAlarms();

  renderAlarms();

  document.getElementById("youtube").value="";

  closeAlarm();

}


function removeAlarm(id){

  alarms =
    alarms.filter(function(alarm){
      return alarm.id !== id;
    });

  saveAlarms();

  renderAlarms();

}


function switchAlarm(id){

  const alarm =
    alarms.find(function(a){
      return a.id === id;
    });

  if(!alarm){
    return;
  }

  alarm.enabled = !alarm.enabled;

  saveAlarms();

  renderAlarms();

}


function renderAlarms(){

  const box =
    document.getElementById("alarmList");

  box.innerHTML="";

  if(alarms.length===0){

    box.innerHTML = `
      <div class="empty">
        Aucun réveil<br><br>
        Appuie sur + pour créer ton premier réveil.
      </div>
    `;

    return;
  }

  alarms.sort(function(a,b){
    return a.time.localeCompare(b.time);
  });

  alarms.forEach(function(a){

    const div =
      document.createElement("div");

    div.className="alarm";

    const top =
      document.createElement("div");

    top.className="alarm-top";

    const info =
      document.createElement("div");

    const time =
      document.createElement("div");

    time.className="alarm-time";
    time.textContent=a.time;

    const name =
      document.createElement("div");

    name.className="alarm-name";

    name.textContent =
      a.enabled
      ? "Réveil activé"
      : "Réveil désactivé";

    if(a.youtube){
      name.textContent += " · 🎵 Musique";
    }

    info.appendChild(time);
    info.appendChild(name);

    const label =
      document.createElement("label");

    label.className="switch";

    const checkbox =
      document.createElement("input");

    checkbox.type="checkbox";
    checkbox.checked=!!a.enabled;

    checkbox.addEventListener("change",function(){
      switchAlarm(a.id);
    });

    const slider =
      document.createElement("span");

    slider.className="slider";

    label.appendChild(checkbox);
    label.appendChild(slider);

    top.appendChild(info);
    top.appendChild(label);

    const actions =
      document.createElement("div");

    actions.className="alarm-actions";

    if(a.youtube){

      const music =
        document.createElement("button");

      music.className="dark";
      music.type="button";
      music.style.height="40px";
      music.style.padding="0 15px";
      music.textContent="🎵 Tester la musique";

      music.addEventListener("click",function(){
        openMusic(a.youtube);
      });

      actions.appendChild(music);
    }

    const deleteButton =
      document.createElement("button");

    deleteButton.className="delete";
    deleteButton.type="button";
    deleteButton.textContent="Supprimer";

    deleteButton.addEventListener("click",function(){
      removeAlarm(a.id);
    });

    actions.appendChild(deleteButton);

    div.appendChild(top);
    div.appendChild(actions);

    box.appendChild(div);

  });

}

renderAlarms();


/* =====================================================
   SON
===================================================== */

let audioCtx=null;

function ring(){

  try{

    audioCtx =
      audioCtx ||
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    const now =
      audioCtx.currentTime;

    for(let i=0;i<6;i++){

      const osc =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      osc.frequency.value =
        i%2===0 ? 880 : 660;

      osc.type="sine";

      gain.gain.setValueAtTime(
        .001,
        now+i*.35
      );

      gain.gain.exponentialRampToValueAtTime(
        .45,
        now+i*.35+.03
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        now+i*.35+.3
      );

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now+i*.35);
      osc.stop(now+i*.35+.32);
    }

  }catch(e){}

  if(navigator.vibrate){

    navigator.vibrate([
      500,300,
      500,300,
      700,300,
      500
    ]);

  }

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function notify(title,text){

  if(
    "Notification" in window &&
    Notification.permission==="granted"
  ){

    try{

      new Notification(title,{
        body:text,
        tag:"horloge-"+Date.now(),
        requireInteraction:true
      });

    }catch(e){}

  }

}


/* =====================================================
   YOUTUBE
===================================================== */

function getYoutubeId(url){

  try{

    const u =
      new URL(url);

    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname.substring(1);

    }

    if(
      u.hostname.includes("youtube.com")
    ){

      return u.searchParams.get("v");

    }

  }catch(e){}

  return null;
}


function openMusic(url){

  const id =
    getYoutubeId(url);

  if(id){

    window.open(
      "https://www.youtube.com/watch?v="+id,
      "_blank"
    );

  }

}


/* =====================================================
   VERIFICATION REVEILS
===================================================== */

function checkAlarms(){

  const now = new Date();

  const current =
    String(now.getHours()).padStart(2,"0") +
    ":" +
    String(now.getMinutes()).padStart(2,"0");

  alarms.forEach(function(a){

    if(
      a.enabled &&
      a.time===current &&
      a.lastRing!==current
    ){

      a.lastRing=current;

      saveAlarms();

      ring();

      notify(
        "⏰ Réveil",
        "Il est "+current
      );

      if(a.youtube){

        setTimeout(function(){
          openMusic(a.youtube);
        },1000);

      }

    }

  });

}

setInterval(checkAlarms,1000);


/* =====================================================
   CHRONOMETRE
===================================================== */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;


function chronoFormat(ms){

  const m =
    Math.floor(ms/60000);

  const s =
    Math.floor((ms%60000)/1000);

  const c =
    Math.floor((ms%1000)/10);

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0") +
    "." +
    String(c).padStart(2,"0")
  );

}


function saveChrono(){

  try{

    let elapsed=chronoElapsed;

    if(chronoRunning){
      elapsed +=
        Date.now()-chronoStartTime;
    }

    localStorage.setItem(
      "chronoState",
      JSON.stringify({
        running:chronoRunning,
        elapsed:elapsed,
        start:chronoStartTime
      })
    );

  }catch(e){}

}


function updateChrono(){

  let value =
    chronoElapsed;

  if(chronoRunning){

    value +=
      Date.now()-chronoStartTime;

  }

  document.getElementById(
    "chronoDisplay"
  ).textContent =
    chronoFormat(value);

  saveChrono();

}


function startChrono(){

  if(!chronoRunning){

    chronoStartTime =
      Date.now();

    chronoRunning=true;

    document.getElementById(
      "chronoStart"
    ).textContent="Pause";

    clearInterval(chronoInterval);

    chronoInterval =
      setInterval(updateChrono,30);

  }else{

    chronoElapsed +=
      Date.now()-chronoStartTime;

    chronoRunning=false;

    clearInterval(chronoInterval);

    document.getElementById(
      "chronoStart"
    ).textContent="Démarrer";

  }

  updateChrono();

}


function lap(){

  if(!chronoRunning){
    return;
  }

  const value =
    chronoElapsed +
    Date.now()-chronoStartTime;

  const div =
    document.createElement("div");

  div.className="lap-row";

  const left =
    document.createElement("span");

  left.textContent="Tour";

  const right =
    document.createElement("span");

  right.textContent =
    chronoFo
