<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waveify</title>
  <meta
    name="description"
    content="Waveify — ta musique, ton espace."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside id="sidebar" class="sidebar">

    <div class="logo">
      <span class="logo-icon">W</span>
      <span>Waveify</span>
    </div>

    <nav class="main-nav">

      <button
        class="nav-item active"
        data-page="home"
      >
        <span>⌂</span>
        <span>Accueil</span>
      </button>

      <button
        class="nav-item"
        data-page="recommendations"
      >
        <span>✦</span>
        <span>Recommandations</span>
      </button>

      <button
        class="nav-item"
        data-page="liked"
      >
        <span>♥</span>
        <span>J'aime</span>
      </button>

      <button
        class="nav-item"
        data-page="disliked"
      >
        <span>👎</span>
        <span>Pas aimé</span>
      </button>

      <button
        class="nav-item"
        data-page="playlist"
      >
        <span>♫</span>
        <span>Ma playlist</span>
      </button>

    </nav>

    <div class="sidebar-bottom">

      <button
        id="resetData"
        class="nav-item secondary-nav"
      >
        <span>↻</span>
        <span>Réinitialiser</span>
      </button>

    </div>

  </aside>


  <!-- =========================
       CONTENU PRINCIPAL
  ========================== -->

  <main class="main">

    <!-- HEADER -->

    <header class="topbar">

      <button
        id="menuBtn"
        class="icon-btn menu-btn"
        aria-label="Ouvrir le menu"
      >
        ☰
      </button>

      <div class="search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher une musique..."
          autocomplete="off"
        >

      </div>

      <button
        id="profileBtn"
        class="profile-btn"
        aria-label="Profil"
      >
        <span>W</span>
      </button>

    </header>


    <!-- PAGE DYNAMIQUE -->

    <section
      id="page"
      class="page"
    >
      <!-- Le contenu est généré par script.js -->
    </section>

  </main>


  <!-- =========================
       LECTEUR YOUTUBE
  ========================== -->

  <div
    id="youtube-player"
    class="youtube-player"
  ></div>


  <!-- =========================
       PLAYER DU BAS
  ========================== -->

  <footer class="player">

    <!-- Infos musique -->

    <div class="player-song">

      <img
        id="playerCover"
        class="player-cover"
        src="https://via.placeholder.com/64"
        alt="Pochette"
      >

      <div class="player-info">

        <div
          id="playerTitle"
          class="player-title"
        >
          Choisis une musique
        </div>

        <div
          id="playerArtist"
          class="player-artist"
        >
          Waveify
        </div>

      </div>

    </div>


    <!-- Contrôles centraux -->

    <div class="player-center">

      <div class="player-controls">

        <button
          id="shuffleBtn"
          class="player-btn"
          title="Aléatoire"
          aria-label="Aléatoire"
        >
          🔀
        </button>

        <button
          id="prevBtn"
          class="player-btn"
          title="Précédent"
          aria-label="Précédent"
        >
          ⏮
        </button>

        <button
          id="playBtn"
          class="play-btn"
          title="Lecture"
          aria-label="Lecture"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          class="player-btn"
          title="Suivant"
          aria-label="Suivant"
        >
          ⏭
        </button>

        <button
          id="repeatBtn"
          class="player-btn"
          title="Répéter"
          aria-label="Répéter"
        >
          🔁
        </button>

      </div>


      <!-- Barre de progression -->

      <div class="progress-area">

        <span
          id="currentTime"
          class="time"
        >
          0:00
        </span>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Progression"
        >

        <span
          id="duration"
          class="time"
        >
          0:00
        </span>

      </div>

    </div>


    <!-- Actions -->

    <div class="player-actions">

      <button
        id="likeBtn"
        class="player-btn"
        title="J'aime"
        aria-label="J'aime"
      >
        ♡
      </button>

      <button
        id="dislikeBtn"
        class="player-btn"
        title="Pas aimé"
        aria-label="Pas aimé"
      >
        👎
      </button>

      <button
        id="playlistBtn"
        class="player-btn"
        title="Ajouter à ma playlist"
        aria-label="Ajouter à ma playlist"
      >
        ＋
      </button>

      <button
        id="infiniteBtn"
        class="player-btn"
        title="Mode infini"
        aria-label="Mode infini"
      >
        ♾️
      </button>

      <div class="volume-control">

        <span>
          🔊
        </span>

        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="70"
          aria-label="Volume"
        >

      </div>

    </div>

  </footer>


  <!-- =========================
       TOAST / NOTIFICATIONS
  ========================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =================================================
       IMPORTANT :
       1. API YouTube
       2. script.js
       ================================================= -->

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>

</body>
</html>
