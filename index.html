<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">

<title>Horloge</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    background:#000;
}

body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =====================================================
   STRUCTURE
===================================================== */

#app{
    width:100%;
    min-height:100%;
    background:#000;
}

/* =====================================================
   PAGES
===================================================== */

.page{
    display:none;

    width:100%;
    min-height:calc(100vh - 82px);

    padding:
        34px
        24px
        105px;

    overflow-y:auto;
    overflow-x:hidden;

    background:#000;
}

.page.active{
    display:block;
}

.page-content{
    width:100%;
    max-width:610px;
    margin:0 auto;
}

/* =====================================================
   TITRES
===================================================== */

h1{
    margin:0;

    font-size:32px;
    line-height:1.1;

    font-weight:700;
}

.subtitle{
    margin-top:8px;

    color:#777;

    font-size:16px;
}

/* =====================================================
   BARRE DU BAS
===================================================== */

.bottom{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:100%;
    max-width:728px;

    height:82px;

    background:#111;

    border-top:1px solid #1b1b1b;

    display:flex;

    z-index:99999;

    padding:3px 2px;

    padding-bottom:
        env(safe-area-inset-bottom,3px);
}

.tab{
    flex:1;

    height:76px;

    border:0;
    outline:0;

    background:transparent;

    color:#666;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:12px;

    cursor:pointer;
}

.tab.active{
    color:#20e879;
}

.tab svg{
    width:29px;
    height:29px;

    fill:none;

    stroke:currentColor;

    stroke-width:2.3;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   RÉVEILS
===================================================== */

.empty{
    text-align:center;

    margin-top:68px;
}

.plus{
    width:72px;
    height:72px;

    border:0;
    border-radius:50%;

    background:#20e879;

    color:#07150d;

    font-size:38px;
    font-weight:300;

    line-height:72px;

    padding:0;
}

.add-text{
    margin-top:12px;

    color:#777;

    font-size:17px;
}

.alarm-list{
    margin-top:25px;
}

.alarm{
    min-height:78px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #171717;
}

.alarm-time{
    font-size:34px;
    font-weight:300;
}

.alarm-days{
    margin-top:3px;

    color:#777;

    font-size:12px;
}

.alarm-actions{
    display:flex;
    align-items:center;

    gap:10px;
}

.delete{
    width:36px;
    height:36px;

    border:0;

    background:transparent;

    color:#666;

    font-size:25px;
}

.toggle{
    width:46px;
    height:27px;

    border:0;

    border-radius:20px;

    background:#333;

    position:relative;
}

.toggle:after{
    content:"";

    position:absolute;

    width:21px;
    height:21px;

    left:3px;
    top:3px;

    background:#999;

    border-radius:50%;

    transition:.2s;
}

.toggle.on{
    background:#20e879;
}

.toggle.on:after{
    left:22px;
    background:#06120a;
}

/* =====================================================
   HORLOGE
===================================================== */

.clock-page{
    text-align:center;
}

.clock-box{
    margin-top:100px;
}

.clock{
    font-size:clamp(45px,10vw,76px);

    font-weight:300;

    letter-spacing:1px;

    white-space:nowrap;
}

.clock-sec{
    color:#20e879;
}

.date{
    margin-top:12px;

    color:#777;

    font-size:17px;

    text-transform:capitalize;
}

/* =====================================================
   CHRONO
===================================================== */

.tool-page{
    text-align:center;
}

.tool{
    margin-top:75px;
}

.tool-display{
    font-size:clamp(48px,11vw,75px);

    font-weight:300;

    font-variant-numeric:tabular-nums;

    white-space:nowrap;
}

.green{
    color:#20e879;
}

.tool-buttons{
    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:35px;
}

.round-button{
    width:68px;
    height:68px;

    border:0;
    border-radius:50%;

    background:#181818;

    color:#fff;

    font-size:13px;
}

.round-button.main{
    background:#20e879;
    color:#06120a;
    font-weight:bold;
}

.laps{
    width:100%;
    max-width:400px;

    margin:28px auto 0;

    text-align:left;
}

.lap{
    display:flex;

    justify-content:space-between;

    padding:9px 3px;

    color:#888;

    border-bottom:1px solid #171717;

    font-size:13px;
}

/* =====================================================
   MINUTEUR
===================================================== */

.timer-box{
    margin-top:65px;
}

.timer-display{
    font-size:clamp(48px,11vw,75px);

    font-weight:300;

    font-variant-numeric:tabular-nums;

    white-space:nowrap;
}

.timer-inputs{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:5px;

    margin-top:30px;
}

.time-input{
    width:65px;
    height:50px;

    background:#111;

    color:#fff;

    border:1px solid #292929;

    border-radius:10px;

    text-align:center;

    font-size:21px;

    outline:none;
}

.time-input:focus{
    border-color:#20e879;
}

.colon{
    color:#777;

    font-size:20px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:100000;

    display:none;

    align-items:flex-end;

    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;

    margin:auto auto 0;

    background:#151515;

    border-radius:22px 22px 0 0;

    padding:22px 20px 28px;
}

.modal-title{
    text-align:center;

    font-size:20px;

    margin-bottom:20px;
}

.alarm-inputs{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:6px;
}

.alarm-input{
    width:90px;
    height:62px;

    background:#080808;

    color:#fff;

    border:1px solid #303030;

    border-radius:13px;

    text-align:center;

    font-size:32px;

    outline:none;
}

.days{
    display:flex;

    justify-content:center;
    flex-wrap:wrap;

    gap:7px;

    margin:22px 0;
}

.day{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#252525;

    color:#aaa;

    font-size:11px;
}

.day.selected{
    background:#20e879;

    color:#06120a;

    font-weight:bold;
}

.modal-buttons{
    display:flex;

    gap:10px;
}

.modal-button{
    flex:1;

    height:48px;

    border:0;

    border-radius:25px;

    font-size:15px;
}

.cancel{
    background:#292929;

    color:#fff;
}

.save{
    background:#20e879;

    color:#06120a;

    font-weight:bold;
}

/* =====================================================
   SONNERIE
===================================================== */

.ringing{
    position:fixed;

    inset:0;

    z-index:200000;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;

    text-align:center;
}

.ringing.show{
    display:flex;
}

.ringing h2{
    font-size:35px;
}

.ringing-time{
    color:#20e879;

    font-size:60px;

    margin:20px 0 35px;
}

.stop{
    border:0;

    border-radius:30px;

    background:#20e879;

    color:#06120a;

    padding:15px 40px;

    font-size:16px;

    font-weight:bold;
}

/* =====================================================
   PETITS ÉCRANS
===================================================== */

@media(max-width:500px){

    .page{
        padding-left:18px;
        padding-right:18px;
        padding-top:30px;
    }

    h1{
        font-size:30px;
    }

    .subtitle{
        font-size:15px;
    }

    .empty{
        margin-top:58px;
    }

    .plus{
        width:68px;
        height:68px;
        line-height:68px;
    }

    .bottom{
        height:78px;
    }

    .tab{
        height:72px;
        font-size:11px;
    }

    .tab svg{
        width:27px;
        height:27px;
    }

}

</style>
</head>

<body>

<div id="app">


<!-- =====================================================
     RÉVEILS
===================================================== -->

<section
    id="page-reveils"
    class="page active">

<div class="page-content">

<h1>Réveils</h1>

<div class="subtitle">
Vos alarmes
</div>

<div id="alarmList"></div>

<div
    id="emptyAlarm"
    class="empty">

<button
    class="plus"
    onclick="openAlarm()">

+

</button>

<div class="add-text">
Ajouter un réveil
</div>

</div>

</div>

</section>


<!-- =====================================================
     HORLOGE
===================================================== -->

<section
    id="page-horloge"
    class="page clock-page">

<div class="page-content">

<h1>Horloge</h1>

<div class="subtitle">
Heure actuelle
</div>

<div class="clock-box">

<div class="clock">

<span id="hours">00</span>:<span id="minutes">00</span>:<span class="clock-sec" id="seconds">00</span>

</div>

<div
    id="date"
    class="date">
</div>

</div>

</div>

</section>


<!-- =====================================================
     CHRONOMÈTRE
===================================================== -->

<section
    id="page-chrono"
    class="page tool-page">

<div class="page-content">

<h1>Chrono</h1>

<div class="subtitle">
Chronomètre
</div>

<div class="tool">

<div class="tool-display">

<span id="chronoMinutes">00</span>:<span id="chronoSeconds">00</span><span class="green">.<span id="chronoMs">00</span></span>

</div>

<div class="tool-buttons">

<button
    class="round-button"
    onclick="chronoReset()">

Reset

</button>

<button
    id="chronoStart"
    class="round-button main"
    onclick="chronoStartStop()">

Démarrer

</button>

<button
    class="round-button"
    onclick="chronoLap()">

Tour

</button>

</div>

<div
    id="laps"
    class="laps">
</div>

</div>

</div>

</section>


<!-- =====================================================
     MINUTEUR
===================================================== -->

<section
    id="page-minuteur"
    class="page tool-page">

<div class="page-content">

<h1>Minuteur</h1>

<div class="subtitle">
Compte à rebours
</div>

<div class="timer-box">

<div
    id="timerDisplay"
    class="timer-display">

00:00:00

</div>

<div class="timer-inputs">

<input
    id="timerHours"
    class="time-input"
    type="number"
    min="0"
    max="99"
    value="0">

<span class="colon">:</span>

<input
    id="timerMinutes"
    class="time-input"
    type="number"
    min="0"
    max="59"
    value="5">

<span class="colon">:</span>

<input
    id="timerSeconds"
    class="time-input"
    type="number"
    min="0"
    max="59"
    value="0">

</div>

<div class="tool-buttons">

<button
    class="round-button"
    onclick="timerReset()">

Reset

</button>

<button
    id="timerStart"
    class="round-button main"
    onclick="timerStartStop()">

Démarrer

</button>

</div>

</div>

</div>

</section>


<!-- =====================================================
     BARRE NAVIGATION
===================================================== -->

<nav class="bottom">


<button
    id="tab-reveils"
    class="tab active"
    onclick="changePage('reveils')">

<svg viewBox="0 0 32 32">

<path d="M9 22h14"/>
<path d="M10 22v-8a6 6 0 0 1 12 0v8"/>
<path d="M7 22h18"/>
<path d="M13 26h6"/>

</svg>

<span>Réveils</span>

</button>


<button
    id="tab-horloge"
    class="tab"
    onclick="changePage('horloge')">

<svg viewBox="0 0 32 32">

<circle cx="16" cy="16" r="12"/>

<path d="M16 9v7l5 3"/>

</svg>

<span>Horloge</span>

</button>


<button
    id="tab-chrono"
    class="tab"
    onclick="changePage('chrono')">

<svg viewBox="0 0 32 32">

<circle cx="16" cy="18" r="10"/>

<path d="M13 5h6"/>
<path d="M16 5v3"/>
<path d="M11 8L9 6"/>
<path d="M21 8l2-2"/>

<path d="M16 12v6l4 2"/>

</svg>

<span>Chrono</span>

</button>


<button
    id="tab-minuteur"
    class="tab"
    onclick="changePage('minuteur')">

<svg viewBox="0 0 32 32">

<circle cx="16" cy="18" r="10"/>

<path d="M13 5h6"/>
<path d="M16 5v3"/>
<path d="M11 8L9 6"/>
<path d="M21 8l2-2"/>

<path d="M16 12v6"/>

</svg>

<span>Minuteur</span>

</button>


</nav>

</div>


<!-- =====================================================
     MODALE RÉVEIL
===================================================== -->

<div
    id="alarmModal"
    class="modal">

<div class="modal-box">

<div class="modal-title">
Nouveau réveil
</div>

<div class="alarm-inputs">

<input
    id="alarmHour"
    class="alarm-input"
    type="number"
    min="0"
    max="23"
    value="07">

<span class="colon">:</span>

<input
    id="alarmMinute"
    class="alarm-input"
    type="number"
    min="0"
    max="59"
    value="00">

</div>

<div class="days">

<button class="day" data-day="1" onclick="selectDay(this)">Lun</button>
<button class="day" data-day="2" onclick="selectDay(this)">Mar</button>
<button class="day" data-day="3" onclick="selectDay(this)">Mer</button>
<button class="day" data-day="4" onclick="selectDay(this)">Jeu</button>
<button class="day" data-day="5" onclick="selectDay(this)">Ven</button>
<button class="day" data-day="6" onclick="selectDay(this)">Sam</button>
<button class="day" data-day="0" onclick="selectDay(this)">Dim</button>

</div>

<div class="modal-buttons">

<button
    class="modal-button cancel"
    onclick="closeAlarm()">

Annuler

</button>

<button
    class="modal-button save"
    onclick="saveAlarm()">

Enregistrer

</button>

</div>

</div>

</div>


<!-- =====================================================
     SONNERIE
===================================================== -->

<div
    id="ringing"
    class="ringing">

<div>

<h2>Réveil</h2>

<div
    id="ringingTime"
    class="ringing-time">

00:00

</div>

<button
    class="stop"
    onclick="stopAlarm()">

Arrêter

</button>

</div>

</div>


<script>

/* =====================================================
   NAVIGATION
===================================================== */

function changePage(name){

    document.querySelectorAll(".page")
    .forEach(function(page){

        page.classList.remove("active");

    });

    document.getElementById(
        "page-" + name
    ).classList.add("active");


    document.querySelectorAll(".tab")
    .forEach(function(tab){

        tab.classList.remove("active");

    });

    document.getElementById(
        "tab-" + name
    ).classList.add("active");

}


/* =====================================================
   HORLOGE
===================================================== */

const dayNames=[
    "dimanche",
    "lundi",
    "mardi",
    "mercredi",
    "jeudi",
    "vendredi",
    "samedi"
];

const monthNames=[
    "janvier",
    "février",
    "mars",
    "avril",
    "mai",
    "juin",
    "juillet",
    "août",
    "septembre",
    "octobre",
    "novembre",
    "décembre"
];

function pad(number){

    return String(number).padStart(2,"0");

}

function updateClock(){

    const now=new Date();

    document.getElementById("hours")
        .textContent=pad(now.getHours());

    document.getElementById("minutes")
        .textContent=pad(now.getMinutes());

    document.getElementById("seconds")
        .textContent=pad(now.getSeconds());

    document.getElementById("date")
        .textContent=
        dayNames[now.getDay()]
        +" "
        +now.getDate()
        +" "
        +monthNames[now.getMonth()]
        +" "
        +now.getFullYear();

    checkAlarms();

}

setInterval(updateClock,1000);

updateClock();


/* =====================================================
   RÉVEILS
===================================================== */

let alarms=[];

try{

    alarms=JSON.parse(
        localStorage.getItem("myClockAlarms")
    ) || [];

}catch(e){

    alarms=[];

}

let selectedDays=[];


function openAlarm(){

    selectedDays=[];

    document.querySelectorAll(".day")
    .forEach(function(day){

        day.classList.remove("selected");

    });

    document.getElementById(
        "alarmModal"
    ).classList.add("show");

}


function closeAlarm(){

    document.getElementById(
        "alarmModal"
    ).classList.remove("show");

}


function selectDay(button){

    const day=Number(
        button.dataset.day
    );

    if(selectedDays.includes(day)){

        selectedDays=selectedDays.filter(
            function(x){

                return x!==day;

            }
        );

        button.classList.remove("selected");

    }else{

        selectedDays.push(day);

        button.classList.add("selected");

    }

}


function saveAlarm(){

    let h=Number(
        document.getElementById("alarmHour").value
    ) || 0;

    let m=Number(
        document.getElementById("alarmMinute").value
    ) || 0;

    h=Math.max(0,Math.min(23,h));

    m=Math.max(0,Math.min(59,m));


    alarms.push({

        id:Date.now(),

        hour:h,

        minute:m,

        days:[...selectedDays],

        enabled:true,

        last:""

    });


    localStorage.setItem(
        "myClockAlarms",
        JSON.stringify(alarms)
    );


    renderAlarms();

    closeAlarm();

}


function renderAlarms(){

    const list=
        document.getElementById(
            "alarmList"
        );

    const empty=
        document.getElementById(
            "emptyAlarm"
        );

    list.innerHTML="";


    empty.style.display=
        alarms.length
        ? "none"
        : "block";


    const names={
        0:"Dim",
        1:"Lun",
        2:"Mar",
        3:"Mer",
        4:"Jeu",
        5:"Ven",
        6:"Sam"
    };


    alarms.forEach(function(alarm){

        let days="Tous les jours";


        if(alarm.days.length){

            days=alarm.days.map(
                function(day){

                    return names[day];

                }
            ).join(" • ");

        }


        const element=
            document.createElement("div");

        element.className="alarm";


        element.innerHTML=`

            <div>

                <div class="alarm-time">

                    ${pad(alarm.hour)}:${pad(alarm.minute)}

                </div>

                <div class="alarm-days">

                    ${days}

                </div>

            </div>


            <div class="alarm-actions">

                <button
                    class="delete"
                    onclick="deleteAlarm(${alarm.id})">

                    ×

                </button>


                <button
                    class="toggle ${alarm.enabled ? "on" : ""}"
                    onclick="toggleAlarm(${alarm.id})">

                </button>

            </div>

        `;


        list.appendChild(element);

    });

}


function deleteAlarm(id){

    alarms=alarms.filter(
        function(alarm){

            return alarm.id!==id;

        }
    );


    localStorage.setItem(
        "myClockAlarms",
        JSON.stringify(alarms)
    );


    renderAlarms();

}


function toggleAlarm(id){

    const alarm=
        alarms.find(
            function(a){

                return a.id===id;

            }
        );


    if(!alarm)return;


    alarm.enabled=
        !alarm.enabled;


    localStorage.setItem(
        "myClockAlarms",
        JSON.stringify(alarms)
    );


    renderAlarms();

}


renderAlarm
