<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 10% 10%, #312e81, transparent 30%),
        radial-gradient(circle at 90% 90%, #075985, transparent 30%),
        #070912;
}

.app {
    width: min(1150px, 100%);
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 45px;
    align-items: center;
}

.intro {
    position: relative;
    z-index: 50;
    margin-top: -70px;
}

.logo {
    margin-bottom: 12px;
    color: #818cf8;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 4px;
}

h1 {
    margin-bottom: 22px;
    font-size: clamp(42px, 6vw, 70px);
    line-height: .9;
    letter-spacing: -5px;
}

.gradient {
    color: transparent;
    background: linear-gradient(90deg,#818cf8,#22d3ee,#34d399);
    -webkit-background-clip: text;
    background-clip: text;
}

.panel {
    position: relative;
    z-index: 100;
    padding: 18px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px;
    background: rgba(18,23,40,.75);
    backdrop-filter: blur(20px);
}

button {
    position: relative;
    z-index: 100;
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: linear-gradient(90deg,#6366f1,#06b6d4);
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    pointer-events: auto;
    transition: transform .2s, filter .2s;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}

button:active {
    transform: scale(.98);
}

.info {
    margin-top: 12px;
    color: #777f96;
    font-size: 10px;
    text-align: center;
}

/* CARTE */

.scene {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 570px;
    aspect-ratio: 1.586;
    margin: auto;
    perspective: 1400px;
    cursor: pointer;
}

.card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.2,.8,.2,1);
}

.scene.flipped .card {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 28px;
    backface-visibility: hidden;
    box-shadow: 0 35px 90px rgba(0,0,0,.5);
}

.face::before {
    content: "";
    position: absolute;
    width: 290px;
    height: 290px;
    top: -120px;
    right: -100px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
}

.face::after {
    content: "";
    position: absolute;
    width: 330px;
    height: 330px;
    bottom: -190px;
    left: -170px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
}

/* DESIGNS */

.blue {
    background:
        radial-gradient(circle at 80% 20%,rgba(34,211,238,.6),transparent 30%),
        linear-gradient(135deg,#172554,#2563eb);
}

.dark {
    background:
        radial-gradient(circle at 20% 80%,rgba(239,68,68,.35),transparent 35%),
        linear-gradient(135deg,#111827,#374151);
}

.green {
    background:
        radial-gradient(circle at 80% 15%,rgba(52,211,153,.5),transparent 32%),
        linear-gradient(135deg,#064e3b,#0f766e);
}

.purple {
    background:
        radial-gradient(circle at 80% 20%,rgba(192,132,252,.55),transparent 35%),
        linear-gradient(135deg,#2e1065,#701a75);
}

.black {
    background: linear-gradient(135deg,#050505,#292929);
}

/* RECTO */

.front {
    padding: 30px;
}

.top {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.brand {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: -1px;
}

.chip {
    width: 53px;
    height: 41px;
    border-radius: 8px;
    background:
        linear-gradient(90deg,transparent 46%,rgba(0,0,0,.2) 47%,transparent 50%),
        linear-gradient(0deg,transparent 46%,rgba(0,0,0,.2) 47%,transparent 50%),
        linear-gradient(135deg,#d7c47d,#fff0a9,#a98c3e);
}

.sample {
    position: absolute;
    z-index: 4;
    top: 80px;
    right: 30px;
    padding: 4px 7px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 4px;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 2px;
}

.number {
    position: relative;
    z-index: 3;
    margin-top: 63px;
    font-family: monospace;
    font-size: clamp(18px,4vw,30px);
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,.3);
}

.details {
    position: relative;
    z-index: 3;
    display: flex;
    gap: 42px;
    margin-top: 25px;
}

.detail small {
    display: block;
    margin-bottom: 5px;
    font-size: 8px;
    letter-spacing: 1px;
    opacity: .7;
}

.detail strong {
    font-family: monospace;
    letter-spacing: 2px;
}

.bottom {
    position: absolute;
    z-index: 3;
    right: 30px;
    bottom: 27px;
    left: 30px;
    display: flex;
    align-items: end;
    justify-content: space-between;
}

.holder-label {
    margin-bottom: 4px;
    font-size: 8px;
    letter-spacing: 1.5px;
    opacity: .6;
}

.holder {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

/* VERSO */

.back {
    transform: rotateY(180deg);
}

.magnetic {
    height: 62px;
    margin-top: 28px;
    background: #070707;
}

.back-content {
    padding: 0 30px;
}

.signature {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
}

.signature-line {
    height: 40px;
    flex: 1;
    border-radius: 3px;
    background:
        repeating-linear-gradient(
            -5deg,
            #ddd 0,
            #ddd 2px,
            #bbb 2px,
            #bbb 4px
        );
}

.back-code {
    padding: 9px 13px;
    border-radius: 3px;
    color: #111;
    background: white;
    font-family: monospace;
    font-weight: 900;
}

.back-info {
    margin-top: 30px;
    color: rgba(255,255,255,.65);
    font-size: 9px;
}

.back-brand {
    position: absolute;
    right: 30px;
    bottom: 25px;
    font-size: 20px;
    font-weight: 900;
}

.hint {
    margin-top: 18px;
    color: #6f7890;
    font-size: 11px;
    text-align: center;
}

@media(max-width:850px) {

    .app {
        grid-template-columns: 1fr;
        gap: 25px;
    }

    .intro {
        margin-top: -30px;
        text-align: center;
    }
}
</style>
</head>

    </div>

</div>

    </div>

    <div class="back-brand" id="backBrand">
        AURORA
    </div>

</div>

</div>

</div>

<div class="hint">
    Cliquez sur la carte pour voir le verso ↻
</div>

</section>

</div>

function randomItem(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}


function randomName() {

    const firstName = randomItem(firstNames);
    const lastName = randomItem(lastNames);

    return firstName + " " + lastName;
}


function randomDisplayNumber() {

    const blocks = [];

    for (let i = 0; i < 4; i++) {

        let block = "";

        for (let j = 0; j < 4; j++) {
            block += Math.floor(Math.random() * 10);
        }

        blocks.push(block);
    }

    return blocks.join(" ");
}


function randomExpiry() {

    const month = String(
        Math.floor(Math.random() * 12) + 1
    ).padStart(2, "0");

    const year = String(
        28 + Math.floor(Math.random() * 8)
    );

    return month + "/" + year;
}


function randomCode() {

    return String(
        Math.floor(100 + Math.random() * 900)
    );
}


function generateCard() {

    const design = randomItem(designs);

    front.className =
        "face front " + design.className;

    back.className =
        "face back " + design.className;

    brand.textContent = design.brand;
    brandBottom.textContent = design.brand;
    backBrand.textContent = design.brand;

    holder.textContent = randomName();

    number.textContent =
        randomDisplayNumber();

    expiry.textContent =
        randomExpiry();

    const code = randomCode();

    cvv.textContent = code;
    backCode.textContent = code;
