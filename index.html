/* =========================
REVEILS
========================= */

.alarm{

}

.switch{

.switch input{

}

.slider{
position:absolute;
inset:0;
background:#444;

}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{

}

.switch input:checked+.slider:before{

}

}

.add{

HORLOGE
========================= */

.clock{

}

.clock-time{

font-weight:200;
letter-spacing:-5px;
}

.clock-date{

}

CHRONO / MINUTEUR
========================= */

.big-number{

font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;

}

.full{

}

.inputs{

grid-template-columns:repeat(3,1fr);

.inputs input{

height:60px;
background:#171717;

}

.label{

font-size:11px;
color:#777;
margin-top:5px;
}

/* =========================
NAVIGATION
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
padding:0;
}

nav button.active{
color:#32d47a;
}

/* VRAIS ICONES MONOCHROMES */

.icon{
width:26px;
height:26px;
display:flex;
align-items:center;
justify-content:center;
color:currentColor;
}

.icon svg{
width:25px;
height:25px;
display:block;
stroke:currentColor;
fill:none;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}

/* =========================
MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
}
</style>  </head>  <body>  <div class="app">  <header>

<div class="subtitle" id="subtitle">Vos alarmes</div>

     REVEILS

00:05:00    
</div>  <div class="inputs">  <div>    
<input id="hours" type="number" min="0" value="0">    
<div class="label">HEURES</div>    
</div>  <div>

</div>  </div>  <button id="timerStart" class="green full" onclick="startTimer()">    
Démarrer    
</button>  <button class="dark full" onclick="resetTimer()">    
Réinitialiser    
</button>  </section>  <!-- =========================    
     NAVIGATION    
========================= -->  <nav>  <button id="navAlarms" class="active" onclick="page('alarms')">  <span class="icon">    
<svg viewBox="0 0 24 24">    
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>    
<path d="M10 21h4"/>    
</svg>    
</span>  Réveils  </button>  <button id="navClock" onclick="page('clock')">  <span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</span>  Horloge

</button>  <button id="navChrono" onclick="page('chrono')">  <span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="13" r="8"/>
<path d="M9 3h6"/>
<path d="M12 13V9"/>
<path d="M12 13l3 2"/>
<path d="M17 5l2 2"/>

</span>  Chrono

</button>  <button id="navTimer" onclick="page('timer')">  <span class="icon">
<svg viewBox="0 0 24 24">

<path d="M12 3v3"/>
<path d="M7 7l-2-2"/>
<path d="M17 7l2-2"/>
<circle cx="12" cy="13" r="7"/>
<path d="M12 9v4l2 1"/>
</svg>
</span>  Minuteur

</button>  </nav>  </div>  <!-- =========================    
MODAL REVEIL    
========================= -->  <div id="modal" class="modal">  <div class="modal-box">  <h2>Nouveau réveil</h2>  <input id="alarmTime" type="time" value="07:00">  <input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"

> 

<div class="modal-buttons">  <button class="dark" onclick="closeAlarm()">    
Annuler    
</button>  <button class="green" onclick="createAlarm()">    
Ajouter    
</button>  </div>  </div>  </div>  <script>    /* =========================
NAVIGATION
========================= */

const pageNames={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function page(name){

const target=document.getElementById(name);

if(!target)return;

document.querySelectorAll(".page").forEach(function(x){
x.classList.remove("active");
});

target.classList.add("active");

document.querySelectorAll("nav button").forEach(function(x){
x.classList.remove("active");
});

const navButton=document.getElementById(
"nav"+name.charAt(0).toUpperCase()+name.slice(1)
);

if(navButton){
navButton.classList.add("active");
}

document.getElementById("title").textContent=
pageNames[name][0];

document.getElementById("subtitle").textContent=
pageNames[name][1];

/* SEULEMENT la page sélectionnée est sauvegardée.
Le chrono, lui, n'est PAS sauvegardé. */
try{
localStorage.setItem("lastPage",name);
}catch(e){}

}

/* =========================
HORLOGE
========================= */

function clock(){

const d=new Date();

document.getElementById("clockTime").textContent=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

let date=d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

document.getElementById("clockDate").textContent=
date.charAt(0).toUpperCase()+date.slice(1);
}

setInterval(clock,1000);
clock();

/* =========================
REVEILS
========================= */

let alarms=[];

try{

alarms=JSON.parse(
localStorage.getItem("myAlarms")||"[]"
);

if(!Array.isArray(alarms)){
alarms=[];
}

}catch(e){
alarms=[];
}

function saveAlarms(){

try{
localStorage.setItem(
"myAlarms",
JSON.stringify(alarms)
);
}catch(e){}

}

function openAlarm(){

if(
"Notification" in window &&
Notification.permission==="default"
){

try{
Notification.requestPermission();
}catch(e){}

}

document.getElementById("modal")
.classList.add("show");

}

function closeAlarm(){

document.getElementById("modal")
.classList.remove("show");

}

function createAlarm(){

const time=
document.getElementById("alarmTime").value;

const youtube=
document.getElementById("youtube").value.trim();

if(!time)return;

alarms.push({

id:Date.now(),
time:time,
enabled:true,
youtube:youtube,
lastRing:""

});

saveAlarms();
renderAlarms();

document.getElementById("youtube").value="";

closeAlarm();

}

function removeAlarm(id){

alarms=alarms.filter(function(a){
return a.id!==id;
});

saveAlarms();
renderAlarms();

}

function switchAlarm(id){

const a=alarms.find(function(x){
return x.id===id;
});

if(!a)return;

a.enabled=!a.enabled;

saveAlarms();
renderAlarms();

}

function renderAlarms(){

const box=document.getElementById("alarmList");

box.innerHTML="";

if(alarms.length===0){

box.innerHTML=`

<div class="empty">    
Aucun réveil<br><br>    
Appuie sur + pour créer ton premier réveil.    
</div>    
`;    return;

}

alarms.sort(function(a,b){
return a.time.localeCompare(b.time);
});

alarms.forEach(function(a){

const div=document.createElement("div");

div.className="alarm";

div.innerHTML=`

<div class="alarm-top">    <div>    <div class="alarm-time">${a.time}</div>    <div class="alarm-name">    ${a.enabled?"Réveil activé":"Réveil désactivé"}

${a.youtube?" · Musique":""}

</div>    </div>    <label class="switch">    <input
type="checkbox"
${a.enabled?"checked":""}
onchange="switchAlarm(${a.id})">

<span class="slider"></span>

</label>    </div>    <div class="alarm-actions">    ${
a.youtube
?
`
<button
class="dark"
style="height:40px;padding:0 15px"
onclick="openMusic('${a.youtube.replace(/'/g,"\'")}')">

Tester la musique

</button>    
`    
:""    
}    <button    
class="delete"    
onclick="removeAlarm(${a.id})">

Supprimer

</button>    </div>    
`;    box.appendChild(div);

});

}

renderAlarms();

/* =========================
SON
========================= */

let audioCtx=null;

function ring(){

try{

audioCtx=
audioCtx||
new (window.AudioContext||
window.webkitAudioContext)();

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const now=audioCtx.currentTime;

for(let i=0;i<6;i++){

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=
i%2===0?880:660;

osc.type="sine";

gain.gain.setValueAtTime(
.001,
now+i*.35
);

gain.gain.exponentialRampToValueAtTime(
.45,
now+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.35+.3
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(now+i*.35);
osc.stop(now+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700,
300,500
]);

}

}

/* =========================
NOTIFICATION
========================= */

function notify(title,text){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(title,{
body:text,
tag:"horloge-"+Date.now(),
requireInteraction:true
});

}catch(e){}

}

}

/* =========================
YOUTUBE
========================= */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;

}

function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}

/* =========================
VERIFICATION REVEILS
========================= */

setInterval(function(){

const now=new Date();

const hh=String(now.getHours()).padStart(2,"0");
const mm=String(now.getMinutes()).padStart(2,"0");

const current=hh+":"+mm;

alarms.forEach(function(a){

if(
a.enabled &&
a.time===current &&
a.lastRing!==current
){

a.lastRing=current;

saveAlarms();

ring();

notify(
"Réveil",
"Il est "+current
);

if(a.youtube){

setTimeout(function(){
openMusic(a.youtube);
},1000);

}

}

});

},1000);

/* =========================
CHRONOMETRE
IMPORTANT :
AUCUNE SAUVEGARDE
DU CHRONO
========================= */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;

function chronoFormat(ms){

const m=Math.floor(ms/60000);
const s=Math.floor((ms%60000)/1000);
const c=Math.floor((ms%1000)/10);

return(
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")+"."+
String(c).padStart(2,"0")
);

}

function updateChrono(){

let value=chronoElapsed;

if(chronoRunning){

value+=Date.now()-chronoStartTime;

}

document.getElementById("chronoDisplay")
.textContent=chronoFormat(value);

}

function startChrono(){

if(!chronoRunning){

chronoStartTime=Date.now();

chronoRunning=true;

document.getElementById("chronoStart")
.textContent="Pause";

}else{

chronoElapsed+=
Date.now()-chronoStartTime;

chronoRunning=false;

document.getElementById("chronoStart")
.textContent="Démarrer";

}

clearInterval(chronoInterval);

if(chronoRunning){

chronoInterval=
setInterval(updateChrono,30);

}

updateChrono();

}

function lap(){

if(!chronoRunning)return;

const value=
chronoElapsed+
Date.now()-chronoStartTime;

const div=document.createElement("div");

div.style.cssText=
"padding:13px 5px;border-bottom:1px solid #222;display:flex;justify-content:space-between;color:#aaa";

div.innerHTML=
"<span>Tour</span><span>"+
chronoFormat(value)+
"</span>";

document.getElementById("laps")
.prepend(div);

}

function resetChrono(){

clearInterval(chronoInterval);

chronoRunning=false;
chronoElapsed=0;
chronoStartTime=0;

document.getElementById("chronoDisplay")
.textContent="00:00.00";

document.getElementById("chronoStart")
.textContent="Démarrer";

document.getElementById("laps")
.innerHTML="";

/* Aucun localStorage ici. */

}

/* =========================
MINUTEUR
========================= */

let timerRunning=false;
let timerEnd=0;
let timerRemaining=300;
let timerInterval=null;

function timerFormat(s){

s=Math.max(0,Math.floor(s));

const h=Math.floor(s/3600);
const m=Math.floor((s%3600)/60);
const sec=s%60;

return(
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(sec).padStart(2,"0")
);

}

function saveTimer(){

try{

localStorage.setItem(
"timerState",
JSON.stringify({

running:timerRunning,
end:timerEnd,
remaining:timerRemaining

})
);

}catch(e){}

}

function updateTimer(){

if(timerRunning){

timerRemaining=Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

}

document.getElementById("timerDisplay")
.textContent=timerFormat(timerRemaining);

saveTimer();

}

function startTimer(){

if(timerRunning){

timerRemaining=Math.max(
0,
Math.ceil(
(timerEnd-Date.now())/1000
)
);

timerRunning=false;

clearInterval(timerInterval);

document.getElementById("timerStart")
.textContent="Reprendre";

saveTimer();

return;

}

if(timerRemaining<=0){

const h=
Number(document.getElementById("hours").value)||0;

const m=
Number(document.getElementById("minutes").value)||0;

const s=
Number(document.getElementById("seconds").value)||0;

timerRemaining=
h3600+m60+s;

}

if(timerRemaining<=0)return;

timerEnd=
Date.now()+timerRemaining*1000;

timerRunning=true;

document.getElementById("timerStart")
.textContent="Pause";

clearInterval(timerInterval);

timerInterval=setInterval(function(){

updateTimer();

if(timerRemaining<=0){

clearInterval(timerInterval);

timerRunning=false;

document.getElementById("timerStart")
.textContent="Démarrer";

ring();

notify(
"Minuteur terminé",
"Le compte à rebours est terminé."
);

saveTimer();

}

},250);

saveTimer();

}

function resetTimer(){

clearInterval(timerInterval);

timerRunning=false;
timerRemaining=3
