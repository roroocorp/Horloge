<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
min-height:100vh;
}

.app{
width:100%;
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:95px;
}

header{
padding:30px 24px 12px;
}

h1{
font-size:34px;
margin:0;
font-weight:700;
}

.subtitle{
color:#777;
margin-top:5px;
font-size:15px;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
font-variant-numeric:tabular-nums;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:2px;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
flex-shrink:0;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#32d47a;
}

.switch input:checked+.slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:15px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
padding:10px;
}

.music-button{
background:#222;
color:#fff;
border:0;
border-radius:12px;
height:40px;
padding:0 14px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
line-height:1.6;
}

/* =========================
   HORLOGE
========================= */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
font-variant-numeric:tabular-nums;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* =========================
   CHRONO
========================= */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

.lap{
padding:13px 5px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
color:#aaa;
}

/* =========================
   MINUTEUR
========================= */

.inputs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.inputs input{
width:100%;
height:60px;
background:#171717;
color:#fff;
border:1px solid #292929;
border-radius:17px;
text-align:center;
font-size:22px;
outline:none;
}

.label{
text-align:center;
font-size:11px;
color:#777;
margin-top:5px;
}

/* =========================
   NAVIGATION
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
padding-bottom:env(safe-area-inset-bottom);
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
}

nav button.active{
color:#32d47a;
}

.icon{
font-size:25px;
}

/* =========================
   MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
color:#fff;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

/* =========================
   NOTIFICATION VISUELLE
========================= */

.ring-screen{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:200;
display:none;
align-items:center;
justify-content:center;
text-align:center;
}

.ring-screen.show{
display:flex;
}

.ring-content{
padding:30px;
}

.ring-icon{
font-size:80px;
animation:ringShake .5s infinite;
}

.ring-title{
font-size:38px;
font-weight:700;
margin-top:15px;
}

.ring-time{
font-size:65px;
font-weight:200;
margin:10px 0 30px;
}

.stop-ring{
background:#ff453a;
color:#fff;
border:0;
width:220px;
height:65px;
border-radius:35px;
font-size:18px;
font-weight:700;
}

@keyframes ringShake{
0%,100%{transform:rotate(0)}
25%{transform:rotate(-12deg)}
75%{transform:rotate(12deg)}
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

.clock-time{
font-size:64px;
}

.big-number{
font-size:58px;
}

.alarm-time{
font-size:46px;
}

}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>


<!-- =========================
     REVEILS
========================= -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button class="add" onclick="openAlarm()">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>


<!-- =========================
     HORLOGE
========================= -->

<section id="clock" class="page">

<div class="clock">

<div id="clockTime" class="clock-time">
00:00:00
</div>

<div id="clockDate" class="clock-date"></div>

</div>

</section>


<!-- =========================
     CHRONO
========================= -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button class="dark" onclick="lap()">
Tour
</button>

<button
id="chronoStart"
class="green"
onclick="startChrono()">
Démarrer
</button>

</div>

<button
class="dark full"
onclick="resetChrono()">
Réinitialiser
</button>

<div id="laps"></div>

</section>


<!-- =========================
     MINUTEUR
========================= -->

<section id="timer" class="page">

<div id="timerDisplay" class="big-number">
00:05:00
</div>

<div class="inputs">

<div>
<input id="hours" type="number" min="0" value="0">
<div class="label">HEURES</div>
</div>

<div>
<input id="minutes" type="number" min="0" max="59" value="5">
<div class="label">MINUTES</div>
</div>

<div>
<input id="seconds" type="number" min="0" max="59" value="0">
<div class="label">SECONDES</div>
</div>

</div>

<button
id="timerStart"
class="green full"
onclick="startTimer()">
Démarrer
</button>

<button
class="dark full"
onclick="resetTimer()">
Réinitialiser
</button>

</section>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

<button
id="navAlarms"
class="active"
onclick="page('alarms')">

<span class="icon">⏰</span>
Réveils

</button>

<button
id="navClock"
onclick="page('clock')">

<span class="icon">🕐</span>
Horloge

</button>

<button
id="navChrono"
onclick="page('chrono')">

<span class="icon">⏱️</span>
Chrono

</button>

<button
id="navTimer"
onclick="page('timer')">

<span class="icon">⌛</span>
Minuteur

</button>

</nav>

</div>


<!-- =========================
     AJOUT REVEIL
========================= -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input
id="alarmTime"
type="time"
value="07:00"
>

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button
class="dark"
onclick="closeAlarm()">
Annuler
</button>

<button
class="green"
onclick="createAlarm()">
Ajouter
</button>

</div>

</div>

</div>


<!-- =========================
     ECRAN REVEIL
========================= -->

<div id="ringScreen" class="ring-screen">

<div class="ring-content">

<div class="ring-icon">⏰</div>

<div class="ring-title">
Réveil
</div>

<div id="ringTime" class="ring-time">
07:00
</div>

<button
class="stop-ring"
onclick="stopRing()">
Arrêter
</button>

</div>

</div>


<script>

/* =====================================================
   NAVIGATION
===================================================== */

const pageNames = {

alarms:[
"Réveils",
"Vos alarmes"
],

clock:[
"Horloge",
"Heure locale"
],

chrono:[
"Chronomètre",
"Mesure du temps"
],

timer:[
"Minuteur",
"Compte à rebours"
]

};


function page(name){

document
.querySelectorAll(".page")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById(name)
.classList.add("active");


document
.querySelectorAll("nav button")
.forEach(x=>{
x.classList.remove("active");
});


document
.getElementById(
"nav"+
name.charAt(0).toUpperCase()+
name.slice(1)
)
.classList.add("active");


document
.getElementById("title")
.textContent =
pageNames[name][0];


document
.getElementById("subtitle")
.textContent =
pageNames[name][1];


localStorage.setItem(
"lastPage",
name
);

}


/* =====================================================
   HORLOGE
===================================================== */

function clock(){

const d = new Date();

const h =
String(d.getHours()).padStart(2,"0");

const m =
String(d.getMinutes()).padStart(2,"0");

const s =
String(d.getSeconds()).padStart(2,"0");


document
.getElementById("clockTime")
.textContent =
h+":"+m+":"+s;


let date =
d.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);


date =
date.charAt(0).toUpperCase()+
date.slice(1);


document
.getElementById("clockDate")
.textContent =
date;

}

setInterval(clock,1000);

clock();


/* =====================================================
   NOTIFICATIONS
===================================================== */

function askNotification(){

if(
"Notification" in window &&
Notification.permission === "default"
){

Notification.requestPermission();

}

}

function notify(title,text){

if(
"Notification" in window &&
Notification.permission === "granted"
){

try{

new Notification(
title,
{
body:text,
tag:"horloge-"+Date.now(),
requireInteraction:true
}
);

}catch(e){}

}

askNotification();


/* =====================================================
   SON + VIBRATION
===================================================== */

let audioCtx = null;

function ring(){

try{

audioCtx =
audioCtx ||
new (
window.AudioContext ||
window.webkitAudioContext
)();

if(audioCtx.state === "suspended"){
audioCtx.resume();
}


const now =
audioCtx.currentTime;


for(let i=0;i<12;i++){

const osc =
audioCtx.createOscillator();

const gain =
audioCtx.createGain();


osc.type="sine";

osc.frequency.value =
i%2===0 ? 880 : 660;


gain.gain.setValueAtTime(
0.001,
now+i*0.35
);

gain.gain.exponentialRampToValueAtTime(
0.5,
now+i*0.35+0.03
);

gain.gain.exponentialRampToValueAtTime(
0.001,
now+i*0.35+0.30
);


osc.connect(gain);

gain.connect(audioCtx.destination);


osc.start(
now+i*0.35
);

osc.stop(
now+i*0.35+0.32
);

}

}catch(e){}


if(navigator.vibrate){

navigator.vibrate([
500,
300,
500,
300,
700,
300,
500
]);

}

}


/* =====================================================
   REVEILS
===================================================== */

let alarms = [];

try{

alarms =
JSON.parse(
localStorage.getItem("myAlarms") || "[]"
);

}catch(e){

alarms=[];

}


function saveAlarms(){

localStorage.setItem(
"myAlarms",
JSON.stringify(alarms)
);

}


function openAlarm(){

askNotification();

document
.getElementById("modal")
.classList.add("show");

}


function closeAlarm(){

document
.getElementById("modal")
.classList.remove("show");

}


function createAlarm(){

const time =
document
.getElementById("alarmTime")
.value;


const youtube =
document
.getElementById("youtube")
.value
.trim();


if(!time)return;


alarms.push({

id:Date.now(),

time:time,

enabled:true,

youtube:youtube,

lastRing:""

});


saveAlarms();

renderAlarms();


document
.getElementById("youtube")
.value="";


closeAlarm();

}


function removeAlarm(id){

alarms =
alarms.filter(
a=>a.id!==id
);

saveAlarms();

renderAlarms();

}


function switchAlarm(id){

const a =
alarms.find(
x=>x.id===id
);

if(!a)return;

a.enabled =
!a.enabled;

saveAlarms();

renderAlarms();

}


function renderAlarms(){

const box =
document.getElementById("alarmList");

box.innerHTML="";


if(alarms.length===0){

box.innerHTML=`

<div class="empty">

Aucun réveil<br><br>

Appuie sur + pour créer
ton premier réveil.

</div>

`;

return;

}


alarms.sort(
(a,b)=>
a.time.localeCompare(b.time)
);


alarms.forEach(a=>{

const div =
document.createElement("div");

div.className="alarm";


const music =
a.youtube
?
`
<button
class="music-button"
onclick="openMusic('${escapeAttr(a.youtube)}')">
🎵 Tester
</button>
`
:"";


div.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">
${a.time}
</div>

<div class="alarm-name">

${a.enabled
?"Réveil activé"
:"Réveil désactivé"}

${a.youtube
?" · 🎵 Musique"
:""}

</div>

</div>


<label class="switch">

<input
type="checkbox"
${a.enabled?"checked":""}
onchange="switchAlarm(${a.id})">

<span class="slider"></span>

</label>

</div>


<div class="alarm-actions">

${music}

<button
class="delete"
onclick="removeAlarm(${a.id})">
Supprimer
</button>

</div>

`;


box.appendChild(div);

});

}


function escapeAttr(text){

return text
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


renderAlarms();


/* =====================================================
   MUSIQUE YOUTUBE
===================================================== */

function getYoutubeId(url){

try{

const u =
new URL(url);


if(
u.hostname.includes("youtu.be")
){

return u.pathname.substring(1);

}


if(
u.hostname.includes("youtube.com")
){

return u.searchParams.get("v");

}

}catch(e){}

return null;

}


function openMusic(url){

const id =
getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}


/* =====================================================
   ECRAN REVEIL
===================================================== */

let ringActive=false;

function showRing(time){

ringActive=true;

document
.getElementById("ringTime")
.textContent=time;

document
.getElementById("ringScreen")
.classList.add("show");

ring();

}


function stopRing(){

ringActive=false;

document
.getElementById("ringScreen")
.classList.remove("show");

if(navigator.vibrate){

navigator.vibrate(0);

}

}


/* =====================================================
   VERIFICATION REVEILS
===================================================== */

setInterval(()=>{

const now =
new Date();


const current =
String(now.getHours())
.padStart(2,"0")
+
":"+
String(now.getMinutes())
.padStart(2,"0");


const day =
now.toISOString()
.substring(0,10);


alarms.forEach(a=>{

if(
a.enabled &&
a.time===current &&
a.lastRing!==day
){

a.lastRing=day;

saveAlarms();


showRing(current);


notify(
"⏰ Réveil",
"Il est "+current
);


/*
Musique YouTube :
le navigateur ne peut pas garantir
la lecture automatique en arrière-plan.
*/

if(a.youtube){

setTimeout(()=>{

openMusic(a.youtube);

},1000);

}

}

});

},1000);


/* =====================================================
   CHRONOMETRE
   SAUVEGARDE COMPLETE
===================================================== */

let chronoRunning=false;

let chronoStartTime=0;

let chronoElapsed=0;

let chronoInterval=null;


/* FORMAT */

function chronoFormat(ms){

ms=Math.max(
0,
Number(ms)||0
);


const minutes =
Math.floor(ms/60000);


const seconds =
Math.floor(
(ms%60000)/1000
);


const centiemes =
Math.floor(
(ms%1000)/10
);


return (

String(minutes)
.padStart(2,"0")

+
":"

+
String(seconds)
.padStart(2,"0")

+
"."

+
String(centiemes)
.padStart(2,"0")

);

}


/* TEMPS ACTUEL */

function getChronoTime(){

if(chronoRunning){

return (
chronoElapsed+
(Date.now()-chronoStartTime)
);

}

return chronoElapsed;

}


/* SAUVEGARDE */

function saveChrono(){

const data={

running:chronoRunning,

elapsed:chronoElapsed,

startTime:chronoStartTime

};


localStorage.setItem(
"horlogeChrono",
JSON.stringify(data)
);

}


/* AFFICHAGE */

function updateChrono(){

const value =
getChronoTime();


document
.getElementById("chronoDisplay")
.textContent =
chronoFormat(value);

}


/* DEMARRER / PAUSE */

function startChrono(){

if(!chronoRunning){

/*
On démarre à partir
du temps déjà sauvegardé.
*/

chronoStartTime =
Date.now();

chronoRunning=true;


document
.getElementById("chronoStart")
.textContent="Pause";


clearInterval(
chronoInterval
);


chronoInterval =
setInterval(
updateChrono,
30
);


}else{

/*
PAUSE :
on fige le temps actuel.
*/

chronoElapsed =
getChronoTime();


chronoRunning=false;


clearInterval(
chronoInterval
);

chronoInterval=null;


document
.getElementById("chronoStart")
.textContent=
"Démarrer";

}


saveChrono();

updateChrono();

}


/* TOUR */

function lap(){

if(!chronoRunning)return;


const value =
getChronoTime();


const div =
document.createElement("div");

div.className="lap";


div.innerHTML=`

<span>Tour</span>

<span>
${chronoFormat(value)}
</span>

`;


document
.getElementById("laps")
.prepend(div);

}


/* RESET */

function resetChrono(){

clearInterval(
chronoInterval
);

chronoInterval=null;


chronoRunning=false;

chronoElapsed=0;

chronoStartTime=0;


document
.getElementById("chronoDisplay")
.textContent=
"00:00.00";


document
.getElementById("chronoStart")
.textContent=
"Démarrer";


document
.getElementById("laps")
.innerHTML="";


localStorage.removeItem(
"horlogeChrono"
);

}


/* CHARGEMENT DU CHRONO */

function loadChrono(){

try{

const saved =
localStorage.getItem(
"horlogeChrono"
);


if(!saved){

updateChrono();

return;

}


const data =
JSON.parse(saved);


chronoElapsed =
Number(data.elapsed)||0;


chronoStartTime =
Number(data.startTime)||0;


chronoRunning =
data.running===true;


/*
Si le chrono était en marche
avant de quitter le site,
on recalcule automatiquement
tout le temps passé.
*/

if(
chronoRunning &&
chronoStartTime>0
){

/*
Sécurité :
si le navigateur est resté
fermé très longtemps,
le calcul continue quand même.
*/

chronoInterval =
setInterval(
updateChrono,
30
);


document
.getElementById("chronoStart")
.textContent=
"Pause";


}else{

chronoRunning=false;


document
.getElementById("chronoStart")
.textContent=
"Démarrer";

}


updateChrono();


}catch(e){

console.log(
"Erreur chargement chrono",
e
);

chronoRunning=false;

chronoElapsed=0;

chronoStartTime=0;

updateChrono();

}

}


/* SAUVEGARDE QUAND ON QUITTE */
