<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horloge</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    background: #000;
    position: relative;
    overflow: hidden;
}

/* =========================
   HAUT
========================= */

.header {
    height: 80px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 20px;
}

.menu {
    font-size: 30px;
    color: white;
    cursor: pointer;
}

/* =========================
   PAGES
========================= */

.page {
    min-height: calc(100vh - 160px);
    padding: 15px 25px 120px;
}

.page.hidden {
    display: none;
}

/* =========================
   MINUTEUR
========================= */

.timer-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    height: 430px;
    position: relative;
    margin: 0 20px;
}

.timer-picker::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 175px;
    height: 90px;
    border-top: 1px solid transparent;
    border-bottom: 1px solid transparent;
    pointer-events: none;
}

.time-column {
    height: 430px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    text-align: center;
}

.time-column::-webkit-scrollbar {
    display: none;
}

.time-list {
    padding-top: 165px;
    padding-bottom: 165px;
}

.time-number {
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: center;
    font-size: 58px;
    font-weight: 300;
    color: #29292d;
    transition: color 0.15s;
}

.time-number.active {
    color: white;
}

.time-title {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 19px;
    scroll-snap-align: center;
}

/* =========================
   PRESETS
========================= */

.presets {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
}

.preset {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: none;
    background: #202022;
    color: #ddd;
    font-size: 21px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
}

.preset:hover {
    background: #2d2d30;
}

.preset:active {
    transform: scale(0.94);
}

/* =========================
   BOUTON DÉMARRER
========================= */

.start-container {
    text-align: center;
    margin-top: 60px;
}

.start-button {
    min-width: 210px;
    padding: 18px 35px;
    border: none;
    border-radius: 40px;
    background: #635bff;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

.start-button:active {
    transform: scale(0.96);
}

.start-button.pause {
    background: #38388e;
}

/* =========================
   TITRES
========================= */

.page-title {
    font-size: 34px;
    margin-bottom: 30px;
}

/* =========================
   ALARME
========================= */

.alarm-card {
    background: #171719;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
}

.alarm-time {
    font-size: 42px;
}

.alarm-days {
    color: #888;
    margin-top: 8px;
}

.add-alarm {
    color: #635bff;
    font-size: 20px;
    cursor: pointer;
}

/* =========================
   HORLOGE MONDIALE
========================= */

.city-card {
    background: #171719;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
}

.city-name {
    font-size: 23px;
}

.city-country {
    color: #888;
    margin-top: 5px;
}

.city-time {
    font-size: 42px;
    margin-top: 12px;
    font-variant-numeric: tabular-nums;
}

/* =========================
   CHRONOMÈTRE
========================= */

.stopwatch {
    text-align: center;
    padding-top: 80px;
}

.stopwatch-display {
    font-size: 70px;
    font-weight: 300;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
}

.stopwatch-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 60px;
}

.round-button {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: none;
    background: #202022;
    color: white;
    cursor: pointer;
}

.round-button.start {
    background: #173b23;
    color: #30d158;
}

.round-button.stop {
    background: #421c1c;
    color: #ff453a;
}

.laps {
    margin-top: 35px;
    text-align: left;
}

.lap {
    display: flex;
    justify-content: space-between;
    padding: 15px 8px;
    border-bottom: 1px solid #29292b;
}

.lap span {
    color: #888;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100%, 700px);
    height: 95px;
    background: #000;
    border-top: 1px solid #151515;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
}

.navigation button {
    flex: 1;
    border: none;
    background: none;
    color: #858589;
    font-size: 16px;
    padding: 15px 4px;
    cursor: pointer;
    position: relative;
}

.navigation button.active {
    color: white;
    font-weight: bold;
}

.navigation button.active::after {
    content: "";
    position: absolute;
    bottom: 3px;
    left: 25%;
    right: 25%;
    height: 3px;
    border-radius: 5px;
    background: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    .timer-picker {
        margin: 0 5px;
    }

    .time-number {
        font-size: 55px;
    }

    .presets {
        gap: 10px;
    }

    .preset {
        width: 115px;
        height: 115px;
        font-size: 17px;
    }

    .start-container {
        margin-top: 45px;
    }

    .navigation button {
        font-size: 13px;
    }

}

@media (max-width: 360px) {

    .time-number {
        font-size: 47px;
    }

    .preset {
        width: 95px;
        height: 95px;
        font-size: 15px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
        <div class="menu">⋮</div>
    </header>


    <!-- =========================
         MINUTEUR
    ========================== -->

    <section id="timerPage" class="page">

        <div class="timer-picker">

            <div class="time-column" id="hourColumn">
                <div class="time-list" id="hourList"></div>
            </div>

            <div class="time-column" id="minuteColumn">
                <div class="time-list" id="minuteList"></div>
            </div>

            <div class="time-column" id="secondColumn">
                <div class="time-list" id="secondList"></div>
            </div>

        </div>


        <div class="presets">

            <button class="preset"
                    onclick="chooseTime(0,10,0)">
                00:10:00
            </button>

            <button class="preset"
                    onclick="chooseTime(0,15,0)">
                00:15:00
            </button>

            <button class="preset"
                    onclick="chooseTime(0,30,0)">
                00:30:00
            </button>

        </div>


        <div class="start-container">

            <button
                id="timerButton"
                class="start-button"
                onclick="toggleTimer()">
                Démarrer
            </button>

        </div>

    </section>


    <!-- =========================
         ALARME
    ========================== -->

    <section id="alarmPage" class="page hidden">

        <h1 class="page-title">
            Alarme
        </h1>

        <div class="alarm-card">

            <div class="alarm-time">
                07:00
            </div>

            <div class="alarm-days">
                Tous les jours
            </div>

        </div>

        <div class="alarm-card add-alarm">
            + Ajouter une alarme
        </div>

    </section>


    <!-- =========================
         HORLOGE MONDIALE
    ========================== -->

    <section id="worldPage" class="page hidden">

        <h1 class="page-title">
            Horloge mondiale
        </h1>

        <div class="city-card">

            <div class="city-name">
                🇫🇷 Paris
            </div>

            <div class="city-country">
                France
            </div>

            <div id="parisTime"
                 class="city-time">
                --:--:--
            </div>

        </div>


        <div class="city-card">

            <div class="city-name">
                🇺🇸 New York
            </div>

            <div class="city-country">
                États-Unis
            </div>

            <div id="newYorkTime"
                 class="city-time">
                --:--:--
            </div>

        </div>


        <div class="city-card">

            <div class="city-name">
                🇯🇵 Tokyo
            </div>

            <div class="city-country">
                Japon
            </div>

            <div id="tokyoTime"
                 class="city-time">
                --:--:--
            </div>

        </div>

    </section>


    <!-- =========================
         CHRONOMÈTRE
    ========================== -->

    <section id="stopwatchPage"
             class="page hidden">

        <div class="stopwatch">

            <div id="stopwatchDisplay"
                 class="stopwatch-display">
                00:00:00.00
            </div>


            <div class="stopwatch-buttons">

                <button
                    class="round-button"
                    onclick="addLap()">
                    Tour
                </button>

                <button
                    id="stopwatchButton"
                    class="round-button start"
                    onclick="toggleStopwatch()">
                    Démarrer
                </button>

                <button
                    class="round-button"
                    onclick="resetStopwatch()">
                    Reset
                </button>

            </div>


            <div id="laps"
                 class="laps">
            </div>

        </div>

    </section>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navigation">

        <button onclick="openPage('alarmPage', this)">
            Alarme
        </button>

        <button onclick="openPage('worldPage', this)">
            Horloge mondiale
        </button>

        <button onclick="openPage('stopwatchPage', this)">
            Chronomètre
        </button>

        <button class="active"
                onclick="openPage('timerPage', this)">
            Minuteur
        </button>

    </nav>

</div>


<script>

/* =====================================================
   NAVIGATION
===================================================== */

function openPage(pageId, button) {

    document.querySelectorAll(".page")
        .forEach(page => {
            page.classList.add("hidden");
        });

    document.getElementById(pageId)
        .classList.remove("hidden");

    document.querySelectorAll(".navigation button")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");
}


/* =====================================================
   CRÉATION DES ROULETTES
===================================================== */

function createWheel(listId, title, max) {

    const list =
        document.getElementById(listId);

    const titleElement =
        document.createElement("div");

    titleElement.className =
        "time-title";

    titleElement.textContent =
        title;

    list.appendChild(titleElement);


    for (let i = 0; i <= max; i++) {

        const item =
            document.createElement("div");

        item.className =
            "time-number";

        item.dataset.value =
            i;

        item.textContent =
            String(i).padStart(2, "0");

        list.appendChild(item);
    }
}


/*
    Création :

    Heures   00 → 23
    Minutes  00 → 59
    Secondes 00 → 59
*/

createWheel(
    "hourList",
    "Heures",
    23
);

createWheel(
    "minuteList",
    "Minutes",
    59
);

createWheel(
    "secondList",
    "Secondes",
    59
);


/* =====================================================
   RÉCUPÉRER LA VALEUR SÉLECTIONNÉE
===================================================== */

function getWheelValue(columnId) {

    const column =
        document.getElementById(columnId);

    const position =
        Math.round(column.scrollTop / 90);

    return Math.max(0, position);
}


/* =====================================================
   METTRE EN ÉVIDENCE LE CHIFFRE CENTRAL
===================================================== */

function updateWheelSelection() {

    document
        .querySelectorAll(".time-column")
        .forEach(column => {

            const position =
                Math.round(column.scrollTop / 90);

            const numbers =
                column.querySelectorAll(".time-number");

            numbers.forEach((number, index) => {

                number.classList.toggle(
                    "active",
                    index === position
                );

            });

        });
}


document
    .querySelectorAll(".time-column")
    .forEach(column => {

        column.addEventListener(
            "scroll",
            () => {

                requestAnimationFrame(
                    updateWheelSelection
                );

            }
        );

    });


/* =====================================================
   CHOISIR UNE DURÉE RAPIDEMENT
===================================================== */

function chooseTime(hours, minutes, seconds) {

    document.getElementById(
        "hourColumn"
    ).scrollTop = hours * 90;

    document.getElementById(
        "minuteColumn"
    ).scrollTop = minutes * 90;

    document.getElementById(
        "secondColumn"
    ).scrollTop = seconds * 90;

    updateWheelSelection();

}


/* =====================================================
   MINUTEUR
===================================================== */

let timerRunning = false;

let timerRemaining = 0;

let timerEnd = 0;

let timerInterval = null;


function getSelectedTimer() {

    const hours =
        getWheelValue("hourColumn");

    const minutes =
        getWheelValue("minuteColumn");

    const seconds =
        getWheelValue("secondColumn");


    return (
        hours * 3600000 +
        minutes * 60000 +
        seconds * 1000
    );
}


function toggleTimer() {

    const button =
        document.getElementById(
            "timerButton"
        );


    /*
       DÉMARRER
    */

    if (!timerRunning) {

        if (timerRemaining <= 0) {

            timerRemaining =
                getSelectedTimer();

        }


        if (timerRemaining <= 0) {

            return;

        }


        timerEnd =
            Date.now() +
            timerRemaining;


        timerRunning = true;


        button.textContent =
            "Pause";

        button.classList.add(
            "pause"
        );


        timerInterval =
            setInterval(
                updateTimer,
                100
            );

    }


    /*
       PAUSE
    */

    else {

        timerRemaining =
            Math.max(
                0,
                timerEnd - Date.now()
            );


        timerRunning = false;


        clearInterval(
            timerInterval
        );


        button.textContent =
            "Démarrer";

        button.classList.remove(
            "pause"
        );

    }

}


function updateTimer() {

    timerRemaining =
        timerEnd - Date.now();


    if (timerRemaining <= 0) {

        timerRemaining = 0;

        timerRunning = false;

        clearInterval(
            timerInterval
        );


        const button =
            document.getElementById(
                "timerButton"
            );


        button.textContent =
            "Démarrer";

        button.classList.remove(
            "pause"
        );


        /*
           Vibration téléphone
        */

        if (
            "vibrate" in navigator
        ) {

            navigator.vibrate([
                300,
                150,
                300,
                150,
                500
            ]);

        }


        /*
           Son
        */

        playAlarm();


        alert(
            "⏰ Temps écoulé !"
        );

    }

}


/* =====================================================
   SON DU MINUTEUR
===================================================== */

function playAlarm() {

    try {

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.frequency.value =
            880;

        oscillator.type =
            "sine";


        gain.gain.value =
            0.2;


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        setTimeout(() => {

            oscillator.stop();

        }, 700);

    }

    catch (error) {

        console.log(
            "Audio non disponible"
        );

    }

}


/* =====================================================
   HORLOGE MONDIALE
===================================================== */

function updateWorldClocks() {

    const now =
        new Date();


    function getTime(timeZone) {

        return new Intl.DateTimeFormat(
            "fr-FR",
            {
                timeZone: timeZone,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        ).format(now);

    }


    document.getElementById(
        "parisTime"
    ).textContent =
        getTime(
            "Europe/Paris"
        );


    document.getElementById(
        "newYorkTime"
    ).textContent =
        getTime(
            "America/New_York"
        );


    document.getElementById(
        "tokyoTime"
    ).textContent =
        getTime(
            "Asia/Tokyo"
        );

}


setInterval(
    updateWorldClocks,
    1000
);

updateWorldClocks();


/* =====================================================
   CHRONOMÈTRE
===================================================== */

let stopwatchRunning =
    false;

let stopwatchStart =
    0;

let stopwatchElapsed =
    0;

let stopwatchInterval =
    null;

let lapNumber =
    0;


function updateStopwatch() {

    let elapsed =
        stopwatchElapsed;


    if (stopwatchRunning) {

        elapsed +=
            performance.now() -
            stopwatchStart;

    }


    const hours =
        Math.floor(
            elapsed / 3600000
        );


    const minutes =
        Math.floor(
            elapsed / 60000
        ) % 60;


    const seconds =
        Math.floor(
            elapsed / 1000
        ) % 60;


    const centiseconds =
        Math.floor(
            elapsed / 10
        ) % 100;


    document.getElementById(
        "stopwatchDisplay"
    ).textContent =

        String(hours).padStart(
            2,
            "0"
        )

        + ":"

        +

        String(minutes).padStart(
            2,
            "0"
        )

        + ":"

        +

        String(seconds).padStart(
            2,
            "0"
        )

        + "."

        +

        String(centiseconds).padStart(
            2,
            "0"
        );

}


/* =====================================================
   DÉMARRER / PAUSE CHRONOMÈTRE
===================================================== */

function toggleStopwatch() {

    const button =
        document.getElementById(
            "stopwatchButton"
        );


    if (!stopwatchRunning) {

        stopwatchStart =
            performance.now();

        stopwatchRunning =
            true;


        button.textContent =
            "Pause";


        button.classList.remove(
            "start"
        );


        button.classList.add(
            "stop"
        );


        stopwatchInterval =
            setInterval(
                updateStopwatch,
                20
            );

    }


    else {

        stopwatchElapsed +=
            performance.now() -
            stopwatchStart;


        stopwatchRunning =
            false;


        clearInterval(
            stopwatchInterval
        );


        button.textContent =
            "Démarrer";


        button.classList.remove(
            "stop"
        );


        button.classList.add(
            "start"
        );


        updateStopwatch();

    }

}


/* =====================================================
   RESET CHRONOMÈTRE
===================================================== */

function resetStopwatch() {

    stopwatchRunning =
        false;


    clearInterval(
        stopwatchInterval
    );


    stopwatchElapsed =
        0;


    lapNumber =
        0;


    document.getElementById(
        "laps"
    ).innerHTML = "";


    const button =
        document.getElementById(
            "stopwatchButton"
        );


    button.textContent =
        "Démarrer";


    button.classList.remove(
        "stop"
    );


    button.classList.add(
        "start"
    );


    updateStopwatch();

}


/* =====================================================
   TOUR
===================================================== */

function addLap() {

    if (!stopwatchRunning) {

        return;

    }


    lapNumber++;


    const lap =
        document.createElement(
            "div"
        );


    lap.className =
        "lap";


    lap.innerHTML =

        "<span>Tour " +
        lapNumber +
        "</span>" +

        "<strong>" +
        document.getElementById(
            "stopwatchDisplay"
        ).textContent +
        "</strong>";


    document.getElementById(
        "laps"
    ).prepend(lap);

}


/* =====================================================
   INITIALISATION
===================================================== */

chooseTime(
    1,
    59,
    0
);

updateWheelSelection();

updateStopwatch();

</script>

</body>
  </html>
