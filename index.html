<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horloge</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* ───────── EN-TÊTE ───────── */

header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
}

.settings {
    position: absolute;
    right: 25px;
    border: 0;
    background: transparent;
    color: #aaa;
    font-size: 27px;
    cursor: pointer;
}

/* ───────── CONTENU ───────── */

main {
    flex: 1;
    position: relative;
    min-height: 0;
}

.page {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.page.active {
    display: flex;
}

/* ───────── MINUTEUR ───────── */

.timer-picker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    margin-bottom: 35px;
}

.wheel {
    width: 125px;
    height: 270px;
    overflow: hidden;
    position: relative;
}

.wheel::before {
    content: "";
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    top: 0;
    height: 90px;
    background: linear-gradient(#000, transparent);
    pointer-events: none;
}

.wheel::after {
    content: "";
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 0;
    height: 90px;
    background: linear-gradient(transparent, #000);
    pointer-events: none;
}

.numbers {
    position: absolute;
    top: 80px;
    width: 100%;
}

.number {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #292929;
    font-size: 45px;
    font-weight: 300;
}

.number.selected {
    color: #f5f5f5;
}

.separator {
    font-size: 43px;
    color: #ddd;
}

.presets {
    width: min(700px, 92%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.preset {
    height: 67px;
    border: 1px solid #393939;
    border-radius: 18px;
    background: #000;
    color: #777;
    font-size: 20px;
    cursor: pointer;
}

.preset.active {
    background: #292929;
    color: #fff;
    border-color: #292929;
}

.play {
    margin-top: 35px;
    width: 150px;
    height: 73px;
    border: 0;
    border-radius: 40px;
    background: #29292b;
    color: #2185ff;
    font-size: 31px;
    cursor: pointer;
}

/* ───────── CHRONOMÈTRE ───────── */

.chrono-time {
    font-size: clamp(55px, 9vw, 80px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    margin-bottom: 180px;
}

.chrono-button {
    width: 150px;
    height: 73px;
    border: 0;
    border-radius: 40px;
    background: #29292b;
    color: #2185ff;
    font-size: 31px;
}

/* ───────── HORLOGE MONDIALE ───────── */

.world-time {
    font-size: clamp(65px, 12vw, 110px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
}

.world-date {
    color: #888;
    margin-top: 10px;
    font-size: 20px;
}

/* ───────── ALARMES ───────── */

.alarms {
    width: min(650px, 90%);
}

.add-alarm {
    border: 0;
    background: #29292b;
    color: #fff;
    padding: 13px 22px;
    border-radius: 22px;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
}

.alarm {
    height: 90px;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.alarm-time {
    font-size: 40px;
    font-weight: 300;
}

.alarm-label {
    color: #777;
    margin-top: 4px;
}

.switch {
    width: 52px;
    height: 31px;
    padding: 3px;
    border-radius: 20px;
    background: #333;
    cursor: pointer;
}

.switch span {
    display: block;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #fff;
    transition: .2s;
}

.switch.on {
    background: #30d158;
}

.switch.on span {
    transform: translateX(21px);
}

/* ───────── NAVIGATION ───────── */

nav {
    height: 82px;
    border-top: 1px solid #171717;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #000;
}

.nav-button {
    border: 0;
    background: #000;
    color: #777;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 14px;
}

.nav-icon {
    font-size: 26px;
}

.nav-button.active {
    color: #fff;
    font-weight: bold;
}

/* ───────── MOBILE ───────── */

@media (max-width: 650px) {

    header {
        height: 58px;
    }

    header h1 {
        font-size: 22px;
    }

    .wheel {
        width: 85px;
    }

    .number {
        font-size: 37px;
    }

    .timer-picker {
        gap: 8px;
    }

    .presets {
        gap: 8px;
    }

    .preset {
        font-size: 15px;
    }

    .chrono-time {
        margin-bottom: 150px;
    }

    nav {
        height: 75px;
    }
}
</style>
</head>

<body>

<header>
    <h1 id="pageTitle">Minuteur</h1>

    <button class="settings" onclick="openSettings()">
        ⚙
    </button>
</header>

<main>

<!-- ═════════════ MINUTEUR ═════════════ -->

<section id="timer" class="page active">

    <div class="timer-picker">

        <div class="wheel">
            <div class="numbers" id="hours"></div>
        </div>

        <div class="separator">:</div>

        <div class="wheel">
            <div class="numbers" id="minutes"></div>
        </div>

        <div class="separator">:</div>

        <div class="wheel">
            <div class="numbers" id="seconds"></div>
        </div>

    </div>

    <div class="presets">

        <button class="preset active"
            onclick="chooseTimer(23,3,0,this)">
            23:03:00
        </button>

        <button class="preset"
            onclick="chooseTimer(0,9,0,this)">
            00:09:00
        </button>

        <button class="preset"
            onclick="chooseTimer(0,10,0,this)">
            00:10:00
        </button>

        <button class="preset"
            onclick="chooseTimer(6,36,0,this)">
            06:36:00
        </button>

        <button class="preset"
            onclick="chooseTimer(6,37,0,this)">
            06:37:00
        </button>

        <button class="preset"
            onclick="chooseTimer(3,15,0,this)">
            03:15:00
        </button>

    </div>

    <button class="play"
        id="timerButton"
        onclick="toggleTimer()">
        ▶
    </button>

</section>


<!-- ═════════════ CHRONOMÈTRE ═════════════ -->

<section id="chrono" class="page">

    <div class="chrono-time" id="chronoTime">
        00:00.00
    </div>

    <button
        class="chrono-button"
        id="chronoButton"
        onclick="toggleChrono()">
        ▶
    </button>

</section>


<!-- ═════════════ HORLOGE MONDIALE ═════════════ -->

<section id="world" class="page">

    <div class="world-time" id="worldTime">
        00:00:00
    </div>

    <div class="world-date" id="worldDate">
        --
    </div>

</section>


<!-- ═════════════ ALARMES ═════════════ -->

<section id="alarm" class="page">

    <div class="alarms">

        <button class="add-alarm" onclick="addAlarm()">
            ＋ Ajouter une alarme
        </button>

        <div id="alarmList"></div>

    </div>

</section>

</main>


<!-- ═════════════ NAVIGATION ═════════════ -->

<nav>

    <button class="nav-button"
        onclick="changePage('alarm', this, 'Alarme')">

        <span class="nav-icon">◴</span>
        <span>Alarme</span>

    </button>


    <button class="nav-button"
        onclick="changePage('world', this, 'Horloge mondiale')">

        <span class="nav-icon">◷</span>
        <span>Horloge mondiale</span>

    </button>


    <button class="nav-button"
        onclick="changePage('chrono', this, 'Chronomètre')">

        <span class="nav-icon">⏱</span>
        <span>Chronomètre</span>

    </button>


    <button class="nav-button active"
        onclick="changePage('timer', this, 'Minuteur')">

        <span class="nav-icon">⌛</span>
        <span>Minuteur</span>

    </button>

</nav>


<script>

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */

function changePage(page, button, title) {

    document.querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document.getElementById(page)
        .classList.add("active");

    document.querySelectorAll(".nav-button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("pageTitle")
        .textContent = title;
}


/* ═══════════════════════════════════════
   MINUTEUR
═══════════════════════════════════════ */

let hours = 23;
let minutes = 3;
let seconds = 0;

let timerInterval = null;
let timerEnd = 0;
let timerRunning = false;


function createNumbers(id, max, selected) {

    const container = document.getElementById(id);

    container.innerHTML = "";

    for (let i = 0; i <= max; i++) {

        const number = document.createElement("div");

        number.className = "number";

        if (i === selected) {
            number.classList.add("selected");
        }

        number.textContent =
            String(i).padStart(2, "0");

        container.appendChild(number);
    }
}


function renderTimer() {

    createNumbers("hours", 23, hours);
    createNumbers("minutes", 59, minutes);
    createNumbers("seconds", 59, seconds);
}


renderTimer();


function chooseTimer(h, m, s, button) {

    hours = h;
    minutes = m;
    seconds = s;

    renderTimer();

    document.querySelectorAll(".preset")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
}


function toggleTimer() {

    if (timerRunning) {

        clearInterval(timerInterval);

        timerRunning = false;

        document.getElementById("timerButton")
            .textContent = "▶";

        return;
    }

    let total =
        hours * 3600 +
        minutes * 60 +
        seconds;

    if (total <= 0) return;

    timerEnd =
        Date.now() +
        total * 1000;

    timerRunning = true;

    document.getElementById("timerButton")
        .textContent = "Ⅱ";

    timerInterval =
        setInterval(updateTimer, 200);
}


function updateTimer() {

    let remaining =
        Math.max(
            0,
            Math.ceil(
                (timerEnd - Date.now()) / 1000
            )
        );

    hours =
        Math.floor(remaining / 3600);

    minutes =
        Math.floor(
            (remaining % 3600) / 60
        );

    seconds =
        remaining % 60;

    renderTimer();

    if (remaining <= 0) {

        clearInterval(timerInterval);

        timerRunning = false;

        document.getElementById("timerButton")
            .textContent = "▶";

        playSound();
    }
}


/* ═══════════════════════════════════════
   SON DU MINUTEUR
═══════════════════════════════════════ */

function playSound() {

    try {

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.frequency.value = 880;

        gain.gain.value = 0.2;

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 1
        );

    } catch (error) {

        console.log("Audio non disponible");

    }
}


/* ═══════════════════════════════════════
   CHRONOMÈTRE
═══════════════════════════════════════ */

let chronoStart = 0;
let chronoElapsed = 0;
let chronoInterval = null;


function toggleChrono() {

    const button =
        document.getElementById("chronoButton");

    if (chronoInterval) {

        chronoElapsed +=
            Date.now() - chronoStart;

        clearInterval(chronoInterval);

        chronoInterval = null;

        button.textContent = "▶";

        return;
    }

    chronoStart = Date.now();

    chronoInterval =
        setInterval(updateChrono, 30);

    button.textContent = "Ⅱ";
}


function updateChrono() {

    let elapsed =
        chronoElapsed +
        (Date.now() - chronoStart);

    let milliseconds =
        Math.floor(elapsed / 10) % 100;

    let seconds =
        Math.floor(elapsed / 1000) % 60;

    let minutes =
        Math.floor(elapsed / 60000);

    document.getElementById("chronoTime")
        .textContent =
            String(minutes).padStart(2, "0")
            + ":"
            + String(seconds).padStart(2, "0")
            + "."
            + String(milliseconds).padStart(2, "0");
}


/* ═══════════════════════════════════════
   HORLOGE
═══════════════════════════════════════ */

function updateClock() {

    const now = new Date();

    document.getElementById("worldTime")
        .textContent =
            now.toLocaleTimeString(
                "fr-FR",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

    document.getElementById("worldDate")
        .textContent =
            now.toLocaleDateString(
                "fr-FR",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );
}

setInterval(updateClock, 1000);

updateClock();


/* ═══════════════════════════════════════
   ALARMES
═══════════════════════════════════════ */

let alarms =
    JSON.parse(
        localStorage.getItem("alarms") || "[]"
    );


function saveAlarms() {

    localStorage.setItem(
        "alarms",
        JSON.stringify(alarms)
    );
}


function addAlarm() {

    let time =
        prompt(
            "Heure de l'alarme (HH:MM)",
            "07:00"
        );

    if (!time) return;

    if (!/^\d\d:\d\d$/.test(time)) {

        alert("Format incorrect. Exemple : 07:30");

        return;
    }

    alarms.push({
        time: time,
        enabled: true
    });

    saveAlarms();

    renderAlarms();
}


function renderAlarms() {

    const list =
        document.getElementById("alarmList");

    list.innerHTML = "";

    if (alarms.length === 0) {

        list.innerHTML =
            '<div style="color:#777;text-align:center;padding:35px">Aucune alarme</div>';

        return;
    }

    alarms.forEach((alarm, index) => {

        const row =
            document.createElement("div");

        row.className = "alarm";

        row.innerHTML = `

            <div>

                <div class="alarm-time">
                    ${alarm.time}
                </div>

                <div class="alarm-label">
                    Tous les jours
                </div>

            </div>

            <div
                class="switch ${alarm.enabled ? "on" : ""}"
                onclick="toggleAlarm(${index})">

                <span></span>

            </div>
        `;

        list.appendChild(row);
    });
}


function toggleAlarm(index) {

    alarms[index].enabled =
        !alarms[index].enabled;

    saveAlarms();

    renderAlarms();
}


renderAlarms();


/* ═══════════════════════════════════════
   RÉGLAGES
═══════════════════════════════════════ */

function openSettings() {

    alert(
        "⚙ Réglages\n\n" +
        "• Son du minuteur\n" +
        "• Vibrations\n" +
        "• Alarmes\n" +
        "• Apparence\n" +
        "• Horloge 24 h"
    );
}

</script>

</body>
</html>
