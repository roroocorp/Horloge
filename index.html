<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:100px;
}

header{padding:30px 24px 15px}

h1{
  font-size:34px;
  margin:0;
  font-weight:700;
}

.subtitle{
  color:#777;
  margin-top:5px;
}

.page{
  display:none;
  padding:15px 20px;
}

.page.active{
  display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
  background:#171717;
  border-radius:22px;
  padding:20px;
  margin-bottom:12px;
}

.alarm-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.alarm-time{
  font-size:54px;
  font-weight:300;
  letter-spacing:-2px;
}

.alarm-name{
  color:#888;
  font-size:14px;
  margin-top:3px;
}

.alarm-days{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.switch{
  width:54px;
  height:32px;
  position:relative;
  display:inline-block;
  flex-shrink:0;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#444;
  border-radius:30px;
}

.slider:before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked+.slider{
  background:#32d47a;
}

.switch input:checked+.slider:before{
  transform:translateX(22px);
}

.alarm-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin-top:15px;
}

.delete{
  border:0;
  background:none;
  color:#ff5555;
  font-size:14px;
  padding:8px;
}

.add{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#32d47a;
  font-size:34px;
  color:#001b0d;
  display:block;
  margin:25px auto 5px;
}

.empty{
  text-align:center;
  color:#666;
  padding:60px 20px;
}

/* =========================
   HORLOGE
========================= */

.clock{
  text-align:center;
  padding-top:70px;
}

.clock-time{
  font-size:78px;
  font-weight:200;
  letter-spacing:-5px;
}

.clock-date{
  font-size:18px;
  color:#888;
  margin-top:8px;
}

/* =========================
   CHRONO / MINUTEUR
========================= */

.big-number{
  font-size:68px;
  font-weight:200;
  text-align:center;
  letter-spacing:-4px;
  margin:75px 0 50px;
  font-variant-numeric:tabular-nums;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.green{
  background:#32d47a;
  color:#001b0d;
  border:0;
  border-radius:18px;
  height:58px;
  font-size:17px;
  font-weight:700;
}

.dark{
  background:#202020;
  color:#fff;
  border:0;
  border-radius:18px;
  height:58px;
  font-size:17px;
  font-weight:600;
}

.full{
  width:100%;
  margin-top:12px;
}

/* =========================
   MINUTEUR
========================= */

.timer-picker{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.timer-column{
  background:#171717;
  border-radius:20px;
  padding:8px 5px;
  text-align:center;
}

.timer-column label{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px;
}

.timer-column input{
  width:100%;
  height:65px;
  background:#222;
  color:#fff;
  border:0;
  border-radius:15px;
  text-align:center;
  font-size:30px;
  outline:none;
  -moz-appearance:textfield;
}

.timer-column input::-webkit-outer-spin-button,
.timer-column input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

/* =========================
   NAVIGATION
========================= */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:82px;
  background:#111;
  border-top:1px solid #222;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:50;
}

nav button{
  background:none;
  border:0;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:0;
}

nav button.active{
  color:#32d47a;
}

.icon{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{
  width:25px;
  height:25px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   MODAL REVEIL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#171717;
  border-radius:28px 28px 0 0;
  padding:25px 20px 35px;
}

.modal-box h2{
  margin:0 0 20px;
}

.time-input{
  width:100%;
  height:75px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:18px;
  font-size:40px;
  text-align:center;
  color-scheme:dark;
}

.text-input{
  width:100%;
  height:52px;
  margin-top:12px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:15px;
  padding:0 14px;
  outline:none;
}

/* JOURS */

.days-title{
  color:#888;
  font-size:13px;
  margin:18px 0 10px;
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  height:42px;
  border-radius:50%;
  background:#252525;
  color:#aaa;
  border:0;
  font-size:11px;
  font-weight:600;
}

.day.selected{
  background:#32d47a;
  color:#001b0d;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1 id="title">Réveils</h1>
  <div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- =========================
     REVEILS
========================= -->

<section id="alarms" class="page active">

  <div id="alarmList"></div>

  <button class="add" onclick="openAlarm()">+</button>

  <div style="text-align:center;color:#777">
    Ajouter un réveil
  </div>

</section>

<!-- =========================
     HORLOGE
========================= -->

<section id="clock" class="page">

  <div class="clock">
    <div id="clockTime" class="clock-time">00:00:00</div>
    <div id="clockDate" class="clock-date"></div>
  </div>

</section>

<!-- =========================
     CHRONO
========================= -->

<section id="chrono" class="page">

  <div id="chronoDisplay" class="big-number">
    00:00.00
  </div>

  <div class="buttons">

    <button class="dark" onclick="lap()">
      Tour
    </button>

    <button id="chronoStart" class="green" onclick="startChrono()">
      Démarrer
    </button>

  </div>

  <button class="dark full" onclick="resetChrono()">
    Réinitialiser
  </button>

  <div id="laps"></div>

</section>

<!-- =========================
     MINUTEUR
========================= -->

<section id="timer" class="page">

  <div id="timerDisplay" class="big-number">
    00:05:00
  </div>

  <div class="timer-picker">

    <div class="timer-column">
      <label>HEURES</label>
      <input id="hours"
             type="number"
             min="0"
             max="99"
             value="0">
    </div>

    <div class="timer-column">
      <label>MINUTES</label>
      <input id="minutes"
             type="number"
             min="0"
             max="59"
             value="5">
    </div>

    <div class="timer-column">
      <label>SECONDES</label>
      <input id="seconds"
             type="number"
             min="0"
             max="59"
             value="0">
    </div>

  </div>

  <button id="timerStart"
          class="green full"
          onclick="startTimer()">
    Démarrer
  </button>

  <button class="dark full" onclick="resetTimer()">
    Réinitialiser
  </button>

</section>

<!-- =========================
     NAVIGATION
========================= -->

<nav>

<button id="navAlarms"
        class="active"
        onclick="page('alarms')">

  <span class="icon">
    <svg viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M10 21h4"/>
    </svg>
  </span>

  Réveils

</button>

<button id="navClock"
        onclick="page('clock')">

  <span class="icon">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </svg>
  </span>

  Horloge

</button>

<button id="navChrono"
        onclick="page('chrono')">

  <span class="icon">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="13" r="8"/>
      <path d="M9 3h6"/>
      <path d="M12 13V9"/>
      <path d="M12 13l3 2"/>
      <path d="M17 5l2 2"/>
    </svg>
  </span>

  Chrono

</button>

<button id="navTimer"
        onclick="page('timer')">

  <span class="icon">
    <svg viewBox="0 0 24 24">
      <path d="M9 3h6"/>
      <path d="M12 3v3"/>
      <path d="M7 7l-2-2"/>
      <path d="M17 7l2-2"/>
      <circle cx="12" cy="13" r="7"/>
      <path d="M12 9v4l2 1"/>
    </svg>
  </span>

  Minuteur

</button>

</nav>

</div>

<!-- =========================
     MODAL REVEIL
========================= -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2>Nouveau réveil</h2>

    <input id="alarmTime"
           class="time-input"
           type="time"
           value="07:00">

    <div class="days-title">
      Répéter
    </div>

    <div class="days">

      <button class="day" data-day="Lun" onclick="toggleDay(this)">L</button>
      <button class="day" data-day="Mar" onclick="toggleDay(this)">M</button>
      <button class="day" data-day="Mer" onclick="toggleDay(this)">M</button>
      <button class="day" data-day="Jeu" onclick="toggleDay(this)">J</button>
      <button class="day" data-day="Ven" onclick="toggleDay(this)">V</button>
      <button class="day" data-day="Sam" onclick="toggleDay(this)">S</button>
      <button class="day" data-day="Dim" onclick="toggleDay(this)">D</button>

    </div>

    <input id="youtube"
           class="text-input"
           type="text"
           placeholder="Lien YouTube (facultatif)">

    <div class="modal-buttons">

      <button class="dark" onclick="closeAlarm()">
        Annuler
      </button>

      <button class="green" onclick="createAlarm()">
        Ajouter
      </button>

    </div>

  </div>

</div>

<script>

/* =========================
   NAVIGATION
   AUCUNE SAUVEGARDE
========================= */

const pageNames={
  alarms:["Réveils","Vos alarmes"],
  clock:["Horloge","Heure locale"],
  chrono:["Chronomètre","Mesure du temps"],
  timer:["Minuteur","Compte à rebours"]
};

function page(name){

  const target=document.getElementById(name);

  if(!target)return;

  document.querySelectorAll(".page").forEach(function(el){
    el.classList.remove("active");
  });

  target.classList.add("active");

  document.querySelectorAll("nav button").forEach(function(el){
    el.classList.remove("active");
  });

  const navButton=document.getElementById(
    "nav"+name.charAt(0).toUpperCase()+name.slice(1)
  );

  if(navButton){
    navButton.classList.add("active");
  }

  document.getElementById("title").textContent=
    pageNames[name][0];

  document.getElementById("subtitle").textContent=
    pageNames[name][1];
}


/* =========================
   HORLOGE
========================= */

function updateClock(){

  const d=new Date();

  document.getElementById("clockTime").textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+":"+
    String(d.getSeconds()).padStart(2,"0");

  let date=d.toLocaleDateString("fr-FR",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });

  document.getElementById("clockDate").textContent=
    date.charAt(0).toUpperCase()+date.slice(1);
}

updateClock();
setInterval(updateClock,1000);


/* =========================
   REVEILS
   PAS DE LOCALSTORAGE
========================= */

let alarms=[];

function openAlarm(){

  document.getElementById("modal")
    .classList.add("show");

  document.querySelectorAll(".day")
    .forEach(function(day){
      day.classList.remove("selected");
    });

}

function closeAlarm(){

  document.getElementById("modal")
    .classList.remove("show");

}

function toggleDay(button){

  button.classList.toggle("selected");

}

function getSelectedDays(){

  return Array.from(
    document.querySelectorAll(".day.selected")
  ).map(function(button){
    return button.dataset.day;
  });

}

function formatDays(days){

  if(!days || days.length===0){
    return "Une fois";
  }

  if(days.length===7){
    return "Tous les jours";
  }

  return days.join(" · ");

}

function createAlarm(){

  const time=
    document.getElementById("alarmTime").value;

  if(!time)return;

  const youtube=
    document.getElementById("youtube").value.trim();

  const days=getSelectedDays();

  alarms.push({
    id:Date.now(),
    time:time,
    days:days,
    enabled:true,
    youtube:youtube
  });

  renderAlarms();

  document.getElementById("youtube").value="";

  closeAlarm();

}

function removeAlarm(id){

  alarms=alarms.filter(function(alarm){
    return alarm.id!==id;
  });

  renderAlarms();

}

function switchAlarm(id){

  const alarm=alarms.find(function(a){
    return a.id===id;
  });

  if(!alarm)return;

  alarm.enabled=!alarm.enabled;

  renderAlarms();

}

function renderAlarms(){

  const box=document.getElementById("alarmList");

  box.innerHTML="";

  if(alarms.length===0){

    box.innerHTML=`
      <div class="empty">
        Aucun réveil<br><br>
        Appuie sur + pour créer ton premier réveil.
      </div>
    `;

    return;
  }

  alarms.sort(function(a,b){
    return a.time.localeCompare(b.time);
  });

  alarms.forEach(function(alarm){

    const div=document.createElement("div");

    div.className="alarm";

    div.innerHTML=`

      <div class="alarm-top">

        <div>

          <div class="alarm-time">
            ${alarm.time}
          </div>

          <div class="alarm-name">
            ${alarm.enabled
              ?"Réveil activé"
              :"Réveil désactivé"}
          </div>

          <div class="alarm-days">
            ${formatDays(alarm.days)}
          </div>

        </div>

        <label class="switch">

          <input
            type="checkbox"
            ${alarm.enabled?"checked":""}
            onchange="switchAlarm(${alarm.id})">

          <span class="slider"></span>

        </label>

      </div>

      <div class="alarm-actions">

        <button
          class="delete"
          onclick="removeAlarm(${alarm.id})">
          Supprimer
        </button>

      </div>
    `;

    box.appendChild(div);

  });

}

renderAlarms();


/* =========================
   SON
========================= */

let audioContext=null;

function ring(){

  try{

    audioContext=
      audioContext ||
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    const now=audioContext.currentTime;

    for(let i=0;i<6;i++){

      const oscillator=
        audioContext.createOscillator();

      const gain=
        audioContext.createGain();

      oscillator.type="sine";

      oscillator.frequency.value=
        i%2===0 ? 880 : 660;

      gain.gain.setValueAtTime(
        0.001,
        now+i*.35
      );

      gain.gain.exponentialRampToValueAtTime(
        .45,
        now+i*.35+.03
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        now+i*.35+.3
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now+i*.35);
      oscillator.stop(now+i*.35+.32);

    }

  }catch(e){}

  if(navigator.vibrate){

    navigator.vibrate([
      500,300,500,300,700,300,500
    ]);

  }

}


/* =========================
   CHRONO
   ZÉRO SAUVEGARDE
========================= */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;

function chronoFormat(ms){

  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const c=Math.floor((ms%1000)/10);

  return(
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0")+"."+
    String(c).padStart(2,"0")
  );

}

function updateChrono(){

  let value=chronoElapsed;

  if(chronoRunning){
    value+=Date.now()-chronoStartTime;
  }

  document.getElementById("chronoDisplay")
    .textContent=chronoFormat(value);

}

function startChrono(){

  if(!chronoRunning){

    chronoStartTime=Date.now();
    chronoRunning=true;

    document.getElementById("chronoStart")
      .textContent="Pause";

  }else{

    chronoElapsed+=
      Date.now()-chronoStartTime;

    chronoRunning=false;

    document.getElementById("chronoStart")
      .textContent="Démarrer";

  }

  clearInterval(chronoInterval);

  if(chronoRunning){

    chronoInterval=
      setInterval(updateChrono,30);

  }

  updateChrono();

}

function lap(){

  if(!chronoRunning)return;

  const value=
    chronoElapsed+
    Date.now()-chronoStartTime;

  const div=document.createElement("div");

  div.style.cssText=
    "padding:13px 5px;border-bottom:1px solid #222;display:flex;justify-content:space-between;color:#aaa";

  div.innerHTML=
    "<span>Tour</span><span>"+
    chronoFormat(value)+
    "</span>";

  document.getElementById("laps")
    .prepend(div);

}

function resetChrono(){

  clearInterval(chronoInterval);

  chronoRunning=false;
  chronoStartTime=0;
  chronoElapsed=0;

  document.getElementById("chronoDisplay")
    .textContent="00:00.00";

  document.getElementById("chronoStart")
    .textContent="Démarrer";

  document.getElementById("laps")
    .innerHTML="";

}


/* =========================
   MINUTEUR
   AUCUNE SAUVEGARDE
========================= */

let timerRunning=false;
let timerRemaining=300;
let timerEnd=0;
let timerInterval=null;

function timerFormat(totalSeconds){

  totalSeconds=Math.max(
    0,
    Math.floor(totalSeconds)
  );

  const hours=
    Math.floor(totalSeconds/3600);

  const minutes=
    Math.floor((totalSeconds%3600)/60);

  const seconds=
    totalSeconds%60;

  return(
    String(hours).padStart(2,"0")+":"+
    String(minutes).padStart(2,"0")+":"+
    String(seconds).padStart(2,"0")
  );

}

function updateTimerDisplay(){

  document.getElementById("timerDisplay")
    .textContent=
    timerFormat(timerRemaining);

}

function readTimerInputs(){

  let h=
    parseInt(
      document.getElementById("hours").value,
      10
    );

  let m=
    parseInt(
      document.getElementById("minutes").value,
      10
    );

  let s=
    parseInt(
      document.getElementById("seconds").value,
      10
    );

  if(isNaN(h))h=0;
  if(isNaN(m))m=0;
  if(isNaN(s))s=0;

  h=Math.max(0,Math.min(99,h));
  m=Math.max(0,Math.min(59,m));
  s=Math.max(0,Math.min(59,s));

  document.getElementById("hours").value=h;
  document.getElementById("minutes").value=m;
  document.getElementById("seconds").value=s;

  return h*3600+m*60+s;

}

function startTimer(){

  if(timerRunning){

    timerRemaining=
      Math.max(
        0,
        Math.ceil(
          (timerEnd-Date.now())/1000
        )
      );

    timerRunning=false;

    clearInterval(timerInterval);

    document.getElementById("timerStart")
      .textContent="Reprendre";

    updateTimerDisplay();

    return;

  }

  if(timerRemaining<=0){

    timerRemaining=
      readTimerInputs();

  }

  if(timerRemaining<=0){
    return;
  }

  timerEnd=
    Date.now()+
    timerRemaining*1000;

  timerRunning=true;

  document.getElementById("timerStart")
    .textContent="Pause";

  clearInterval(timerInterval);

  timerInterval=
    setInterval(function(){

      timerRemaining=
        Math.max(
          0,
          Math.ceil
