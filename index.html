<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waveify</title>
  <meta name="description" content="Waveify - ta musique, ton espace">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">W</div>
      <div class="brand-name">Waveify</div>
    </div>

    <nav class="navigation">

      <button class="nav-item active" data-page="home">
        <span class="nav-icon">⌂</span>
        <span>Accueil</span>
      </button>

      <button class="nav-item" data-page="recommendations">
        <span class="nav-icon">✦</span>
        <span>Recommandations</span>
      </button>

      <div class="nav-separator"></div>

      <p class="nav-label">TA BIBLIOTHÈQUE</p>

      <button class="nav-item" data-page="liked">
        <span class="nav-icon">♥</span>
        <span>J'aime</span>
        <span class="nav-count" id="likedCount">0</span>
      </button>

      <button class="nav-item" data-page="disliked">
        <span class="nav-icon">👎</span>
        <span>Pas aimé</span>
        <span class="nav-count" id="dislikedCount">0</span>
      </button>

      <button class="nav-item" data-page="playlist">
        <span class="nav-icon">♫</span>
        <span>Ma playlist</span>
        <span class="nav-count" id="playlistCount">0</span>
      </button>

    </nav>

    <div class="sidebar-footer">
      <button class="reset-button" id="resetData">
        <span>↻</span>
        Réinitialiser
      </button>
    </div>

  </aside>


  <!-- CONTENU -->
  <main class="main-content">

    <!-- HEADER -->
    <header class="topbar">

      <button class="mobile-menu" id="menuBtn">
        ☰
      </button>

      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher un morceau ou un artiste..."
          autocomplete="off"
        >
      </div>

      <button class="profile-button" id="profileBtn">
        W
      </button>

    </header>


    <!-- PAGE -->
    <div id="page" class="page"></div>

  </main>


  <!-- LECTEUR YOUTUBE INVISIBLE -->
  <div id="youtube-player"></div>


  <!-- PLAYER -->
  <footer class="player">

    <div class="player-track">

      <img
        id="playerCover"
        src="https://via.placeholder.com/80"
        alt=""
      >

      <div class="player-track-info">

        <strong id="playerTitle">
          Choisis une musique
        </strong>

        <span id="playerArtist">
          Waveify
        </span>

      </div>

    </div>


    <div class="player-main">

      <div class="player-buttons">

        <button id="shuffleBtn" class="player-button">
          🔀
        </button>

        <button id="prevBtn" class="player-button">
          ⏮
        </button>

        <button id="playBtn" class="main-play">
          ▶
        </button>

        <button id="nextBtn" class="player-button">
          ⏭
        </button>

        <button id="repeatBtn" class="player-button">
          🔁
        </button>

      </div>

      <div class="progress-container">

        <span id="currentTime">0:00</span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">0:00</span>

      </div>

    </div>


    <div class="player-right">

      <button id="likeBtn" class="player-button">
        ♡
      </button>

      <button id="dislikeBtn" class="player-button">
        👎
      </button>

      <button id="playlistBtn" class="player-button">
        ＋
      </button>

      <button id="infiniteBtn" class="player-button">
        ♾
      </button>

      <div class="volume">

        <span>🔊</span>

        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="70"
        >

      </div>

    </div>

  </footer>


  <!-- NOTIFICATION -->
  <div id="toast" class="toast"></div>


  <!-- IMPORTANT : YOUTUBE AVANT SCRIPT.JS -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>

</body>
</html>
