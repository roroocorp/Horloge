<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
min-height:100vh;
}

button,input{
font:inherit;
}

button{
-webkit-tap-highlight-color:transparent;
cursor:pointer;
}

.app{
width:100%;
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:100px;
}

header{
padding:30px 22px 15px;
}

h1{
margin:0;
font-size:34px;
font-weight:700;
}

.subtitle{
margin-top:5px;
color:#777;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* =========================
   REVEILS
========================= */

.alarm{
background:#171717;
border-radius:22px;
padding:19px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
line-height:1;
}

.alarm-info{
margin-top:7px;
font-size:14px;
color:#888;
}

.alarm-days{
margin-top:5px;
font-size:13px;
color:#666;
}

.alarm-actions{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:16px;
gap:10px;
}

.delete{
border:0;
background:transparent;
color:#ff5555;
padding:8px 0;
}

.music{
height:40px;
padding:0 14px;
border:0;
border-radius:13px;
background:#252525;
color:#fff;
}

.switch{
position:relative;
width:54px;
height:32px;
flex:none;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#32d47a;
}

.switch input:checked+.slider:before{
transform:translateX(22px);
}

.add{
display:block;
width:58px;
height:58px;
margin:25px auto 6px;
border:0;
border-radius:50%;
background:#32d47a;
color:#001b0d;
font-size:34px;
line-height:58px;
}

.add-label{
text-align:center;
color:#777;
}

.empty{
padding:60px 20px;
text-align:center;
color:#666;
line-height:1.5;
}

/* =========================
   HORLOGE
========================= */

.clock{
padding-top:70px;
text-align:center;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
font-variant-numeric:tabular-nums;
}

.clock-date{
margin-top:8px;
font-size:18px;
color:#888;
}

/* =========================
   CHRONO
========================= */

.big-number{
margin:75px 0 50px;
font-size:68px;
font-weight:200;
letter-spacing:-4px;
text-align:center;
font-variant-numeric:tabular-nums;
}

.two-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.green{
height:58px;
border:0;
border-radius:18px;
background:#32d47a;
color:#001b0d;
font-size:17px;
font-weight:700;
}

.dark{
height:58px;
border:0;
border-radius:18px;
background:#202020;
color:#fff;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

.lap{
display:flex;
justify-content:space-between;
padding:13px 5px;
border-bottom:1px solid #222;
color:#aaa;
}

/* =========================
   MINUTEUR
========================= */

.timer-display{
margin:55px 0 35px;
text-align:center;
font-size:64px;
font-weight:200;
letter-spacing:-4px;
font-variant-numeric:tabular-nums;
}

.timer-editor{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:9px;
}

.timer-field{
text-align:center;
}

.timer-field input{
width:100%;
height:70px;
border:1px solid #292929;
border-radius:18px;
background:#171717;
color:#fff;
outline:none;
text-align:center;
font-size:30px;
font-weight:300;
}

.timer-field input:focus{
border-color:#555;
}

.timer-field label{
display:block;
margin-top:7px;
font-size:11px;
color:#777;
}

/* =========================
   NAVIGATION
========================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
padding:0;
border:0;
background:transparent;
color:#777;
font-size:11px;
}

nav button.active{
color:#32d47a;
}

.icon{
width:26px;
height:26px;
display:flex;
align-items:center;
justify-content:center;
}

.icon svg{
width:25px;
height:25px;
fill:none;
stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}

/* =========================
   MODAL REVEIL
========================= */

.modal{
position:fixed;
inset:0;
display:none;
align-items:flex-end;
background:rgba(0,0,0,.78);
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
padding:25px 20px 35px;
background:#171717;
border-radius:28px 28px 0 0;
max-height:90vh;
overflow-y:auto;
}

.modal-box h2{
margin:0 0 20px;
font-size:24px;
}

.time-input{
width:100%;
height:75px;
border:1px solid #333;
border-radius:18px;
background:#222;
color:#fff;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-label{
margin-top:18px;
margin-bottom:9px;
font-size:13px;
color:#888;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day{
height:42px;
border:1px solid #333;
border-radius:12px;
background:#222;
color:#aaa;
font-size:12px;
font-weight:600;
}

.day.selected{
border-color:#32d47a;
background:#32d47a;
color:#001b0d;
}

.text-input{
width:100%;
height:52px;
margin-top:15px;
padding:0 14px;
border:1px solid #333;
border-radius:15px;
outline:none;
background:#222;
color:#fff;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

.alarm-time{
font-size:48px;
}

.clock-time{
font-size:64px;
}

.big-number,
.timer-display{
font-size:56px;
}

.day{
font-size:10px;
}

}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div id="subtitle" class="subtitle">Vos alarmes</div>
</header>

<!-- =========================
     REVEILS
========================= -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button class="add" type="button" onclick="openAlarm()">+</button>

<div class="add-label">Ajouter un réveil</div>

</section>

<!-- =========================
     HORLOGE
========================= -->

<section id="clock" class="page">

<div class="clock">
<div id="clockTime" class="clock-time">00:00:00</div>
<div id="clockDate" class="clock-date"></div>
</div>

</section>

<!-- =========================
     CHRONO
========================= -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">00:00.00</div>

<div class="two-buttons">

<button type="button" class="dark" onclick="lap()">
Tour
</button>

<button id="chronoStart" type="button" class="green" onclick="startChrono()">
Démarrer
</button>

</div>

<button type="button" class="dark full" onclick="resetChrono()">
Réinitialiser
</button>

<div id="laps"></div>

</section>

<!-- =========================
     MINUTEUR
========================= -->

<section id="timer" class="page">

<div id="timerDisplay" class="timer-display">00:05:00</div>

<div class="timer-editor">

<div class="timer-field">
<input
id="hours"
type="number"
min="0"
max="99"
value="0"
inputmode="numeric">
<label>HEURES</label>
</div>

<div class="timer-field">
<input
id="minutes"
type="number"
min="0"
max="59"
value="5"
inputmode="numeric">
<label>MINUTES</label>
</div>

<div class="timer-field">
<input
id="seconds"
type="number"
min="0"
max="59"
value="0"
inputmode="numeric">
<label>SECONDES</label>
</div>

</div>

<button id="timerStart" type="button" class="green full" onclick="startTimer()">
Démarrer
</button>

<button type="button" class="dark full" onclick="resetTimer()">
Réinitialiser
</button>

</section>

<!-- =========================
     NAVIGATION
========================= -->

<nav>

<button id="navAlarms" class="active" type="button" onclick="showPage('alarms')">
<span class="icon">
<svg viewBox="0 0 24 24">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>
</span>
Réveils
</button>

<button id="navClock" type="button" onclick="showPage('clock')">
<span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</span>
Horloge
</button>

<button id="navChrono" type="button" onclick="showPage('chrono')">
<span class="icon">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="13" r="8"/>
<path d="M9 3h6"/>
<path d="M12 13V9"/>
<path d="M12 13l3 2"/>
<path d="M17 5l2 2"/>
</svg>
</span>
Chrono
</button>

<button id="navTimer" type="button" onclick="showPage('timer')">
<span class="icon">
<svg viewBox="0 0 24 24">
<path d="M9 3h6"/>
<path d="M12 3v3"/>
<path d="M7 7l-2-2"/>
<path d="M17 7l2-2"/>
<circle cx="12" cy="13" r="7"/>
<path d="M12 9v4l2 1"/>
</svg>
</span>
Minuteur
</button>

</nav>

</div>

<!-- =========================
     MODAL REVEIL
========================= -->

<div id="alarmModal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input
id="alarmTime"
class="time-input"
type="time"
value="07:00">

<div class="modal-label">
Répéter
</div>

<div class="days">

<button class="day" type="button" data-day="1">Lun</button>
<button class="day" type="button" data-day="2">Mar</button>
<button class="day" type="button" data-day="3">Mer</button>
<button class="day" type="button" data-day="4">Jeu</button>
<button class="day" type="button" data-day="5">Ven</button>
<button class="day" type="button" data-day="6">Sam</button>
<button class="day" type="button" data-day="0">Dim</button>

</div>

<input
id="youtube"
class="text-input"
type="text"
placeholder="Lien YouTube de la musique (facultatif)">

<div class="modal-buttons">

<button type="button" class="dark" onclick="closeAlarm()">
Annuler
</button>

<button type="button" class="green" onclick="createAlarm()">
Ajouter
</button>

</div>

</div>

</div>

<script>

/* =====================================================
   NAVIGATION
===================================================== */

const pageData={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function showPage(name){

const page=document.getElementById(name);

if(!page)return;

document.querySelectorAll(".page").forEach(function(p){
p.classList.remove("active");
});

page.classList.add("active");

document.querySelectorAll("nav button").forEach(function(btn){
btn.classList.remove("active");
});

const nav=document.getElementById(
"nav"+name.charAt(0).toUpperCase()+name.slice(1)
);

if(nav){
nav.classList.add("active");
}

document.getElementById("title").textContent=pageData[name][0];
document.getElementById("subtitle").textContent=pageData[name][1];

try{
localStorage.setItem("lastPage",name);
}catch(e){}

}

/* =====================================================
   HORLOGE
===================================================== */

function updateClock(){

const now=new Date();

document.getElementById("clockTime").textContent=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0");

let date=now.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

document.getElementById("clockDate").textContent=
date.charAt(0).toUpperCase()+date.slice(1);

}

updateClock();
setInterval(updateClock,1000);

/* =====================================================
   REVEILS
===================================================== */

let alarms=[];

try{

const stored=localStorage.getItem("alarms");

if(stored){
alarms=JSON.parse(stored);
}

if(!Array.isArray(alarms)){
alarms=[];
}

}catch(e){
alarms=[];
}

function saveAlarms(){

try{
localStorage.setItem("alarms",JSON.stringify(alarms));
}catch(e){}

}

let selectedDays=[];

document.querySelectorAll(".day").forEach(function(button){

button.addEventListener("click",function(){

const day=Number(button.dataset.day);

if(selectedDays.includes(day)){

selectedDays=selectedDays.filter(function(d){
return d!==day;
});

button.classList.remove("selected");

}else{

selectedDays.push(day);
button.classList.add("selected");

}

});

});

function resetDays(){

selectedDays=[];

document.querySelectorAll(".day").forEach(function(button){
button.classList.remove("selected");
});

}

function openAlarm(){

resetDays();

document.getElementById("alarmTime").value="07:00";
document.getElementById("youtube").value="";

document.getElementById("alarmModal").classList.add("show");

}

function closeAlarm(){

document.getElementById("alarmModal").classList.remove("show");

resetDays();

}

function createAlarm(){

const time=document.getElementById("alarmTime").value;

if(!time)return;

const youtube=document.getElementById("youtube").value.trim();

alarms.push({
id:Date.now(),
time:time,
days:selectedDays.slice(),
enabled:true,
youtube:youtube,
lastRing:""
});

saveAlarms();
renderAlarms();
closeAlarm();

}

function deleteAlarm(id){

alarms=alarms.filter(function(alarm){
return alarm.id!==id;
});

saveAlarms();
renderAlarms();

}

function toggleAlarm(id){

const alarm=alarms.find(function(a){
return a.id===id;
});

if(!alarm)return;

alarm.enabled=!alarm.enabled;

saveAlarms();
renderAlarms();

}

const dayNames={
0:"Dim",
1:"Lun",
2:"Mar",
3:"Mer",
4:"Jeu",
5:"Ven",
6:"Sam"
};

function getDaysText(days){

if(!Array.isArray(days)||days.length===0){
return "Tous les jours";
}

const order=[1,2,3,4,5,6,0];

return order
.filter(function(day){
return days.includes(day);
})
.map(function(day){
return dayNames[day];
})
.join(" · ");

}

function renderAlarms(){

const list=document.getElementById("alarmList");

list.innerHTML="";

if(alarms.length===0){

list.innerHTML=
'<div class="empty">Aucun réveil<br><br>Appuie sur + pour créer ton premier réveil.</div>';

return;

}

alarms.sort(function(a,b){
return a.time.localeCompare(b.time);
});

alarms.forEach(function(alarm){

const card=document.createElement("div");

card.className="alarm";

const musicButton=alarm.youtube
?
'<button class="music" type="button" onclick="openMusic(\''+
escapeForAttribute(alarm.youtube)+
'\')">Tester la musique</button>'
:
'<div></div>';

card.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">${alarm.time}</div>

<div class="alarm-info">
${alarm.enabled?"Réveil activé":"Réveil désactivé"}
</div>

<div class="alarm-days">
${getDaysText(alarm.days)}
</div>

</div>

<label class="switch">

<input
type="checkbox"
${alarm.enabled?"checked":""}
onchange="toggleAlarm(${alarm.id})">

<span class="slider"></span>

</label>

</div>

<div class="alarm-actions">

${musicButton}

<button
class="delete"
type="button"
onclick="deleteAlarm(${alarm.id})">
Supprimer
</button>

</div>
`;

list.appendChild(card);

});

}

function escapeForAttribute(text){

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}

renderAlarms();

/* =====================================================
   SON
===================================================== */

let audioContext=null;

function ring(){

try{

audioContext=
audioContext||
new(window.AudioContext||window.webkitAudioContext)();

if(audioContext.state==="suspended"){
audioContext.resume();
}

const start=audioContext.currentTime;

for(let i=0;i<6;i++){

const oscillator=audioContext.createOscillator();
const gain=audioContext.createGain();

oscillator.type="sine";
oscillator.frequency.value=i%2===0?880:660;

gain.gain.setValueAtTime(.001,start+i*.35);

gain.gain.exponentialRampToValueAtTime(
.4,
start+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
start+i*.35+.3
);

oscillator.connect(gain);
gain.connect(audioContext.destination);

oscillator.start(start+i*.35);
oscillator.stop(start+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700
]);

}

}

/* =====================================================
   NOTIFICATION
===================================================== */

function notify(title,text){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(title,{
body:text,
requireInteraction:true
});

}catch(e){}

}

}

/* =====================================================
   YOUTUBE
===================================================== */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;

}

function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}

}

/* =====================================================
   VERIFICATION DES REVEILS
===================================================== */

setInterval(function(){

const now=new Date();

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0");

const today=now.getDay();

alarms.forEach(function(alarm){

if(!alarm.enabled)return;

const days=Array.isArray(alarm.days)?alarm.days:[];

const dayMatches=
days.length===0 ||
days.includes(today);

const ringKey=
now.getFullYear()+"-"+now.getMonth()+"-"+now.getDate()+
"-"+time;

if(
dayMatches &&
alarm.time===time &&
alarm.lastRing!==ringKey
){

alarm.lastRing=ringKey;

saveAlarms();

ring();

notify(
"⏰ Réveil",
"Il est "+time
);

if(alarm.youtube){

setTimeout(function(){
openMusic(alarm.youtube);
},1000);

}

}

});

},1000);

/* =====================================================
   CHRONOMETRE
   AUCUNE SAUVEGARDE
===================================================== */

let chronoRunning=false;
let chronoStart=0;
let chronoElapsed=0;
let chronoInterval=null;

function formatChrono(ms){

const minutes=Math.floor(ms/60000);
const seconds=Math.floor((ms%60000)/1000);
const centiseconds=Math.floor((ms%1000)/10);

return(
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0")+"."+
String(centiseconds).padStart(2,"0")
);

}

function updateChrono(){

let value=chronoElapsed;

if(chronoRunning){
value+=Date.now()-chronoStart;
}

document.getElementById("chronoDisplay").textContent=
formatChrono(value);

}

function startChrono(){

if(!chronoRunning){

chronoStart=Date.now();
chronoRunning=true;

document.getElementById("chronoStart").textContent="Pause";

}else{

chronoElapsed+=Date.now()-chronoStart;
chronoRunning=false;

document.getElementById("chronoStart").textContent="Démarrer";

}

clearInterval(chronoInterval);

if(chronoRunning){
chronoInterval=setInterval(updateChrono,30);
}

updateChrono();

}

function lap(){

if(!chronoRunning)return;

const value=
chronoElapsed+
Date.now()-chronoStart;

const row=document.createElement("div");

row.className="lap";

row.innerHTML=
"<span>Tour</span><span>"+
formatChrono(value)+
"</span>";

document.getElementById("laps").prepend(row);

}

function resetChrono(){

clearInterval(chronoInterval);

chronoRunning=false;
chronoStart=0;
chronoElapsed=0;

document.getElementById("chronoDisplay").textContent=
"00:00.00";

document.getElementById("chronoStart").textContent=
"Démarrer";

document.getElementById("laps").innerHTML="";

}

/* =====================================================
   MINUTEUR
   SAUVEGARDE SIMPLE ET ISOLEE
===================================================== */

let timerRunning=false;
let timerRemaining=300;
let timerEnd=0;
let timerInterval=null;

function formatTimer(seconds){

seconds=Math.max(0,Math.floor(seconds));

const h=Math.floor(seconds/3600);
const m=Math.floor((seconds%3600)/60);
const s=seconds%60;

return(
String(
