<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

body{
    touch-action:manipulation;
}

.app{
    position:relative;
    width:100%;
    height:100dvh;
    background:#000;
}

/* =====================================================
   PAGES
===================================================== */

.pages{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.page{
    position:absolute;
    inset:0;
    padding:42px 28px 125px;
    overflow-y:auto;
    overflow-x:hidden;
    display:none;
    background:#000;
}

.page.active{
    display:block;
}

.inner{
    width:100%;
    max-width:700px;
    margin:auto;
}

h1{
    margin:0;
    font-size:38px;
    line-height:1.1;
    font-weight:700;
    letter-spacing:-1px;
}

.subtitle{
    margin-top:10px;
    color:#777;
    font-size:18px;
}

/* =====================================================
   NAVIGATION
===================================================== */

.bottom-nav{
    position:fixed;
    z-index:9999;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:min(728px,100%);
    height:94px;

    background:#111;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    padding:7px 5px 6px;

    pointer-events:auto;

    border-top:1px solid #191919;
}

.nav-button{
    position:relative;

    appearance:none;
    border:0;
    outline:0;

    background:transparent;

    color:#696969;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;

    font-size:14px;
    font-weight:400;

    padding:0;
    margin:0;

    cursor:pointer;

    pointer-events:auto;

    -webkit-user-select:none;
    user-select:none;
}

.nav-button.active{
    color:#21e879;
}

.nav-button svg{
    width:31px;
    height:31px;

    display:block;

    stroke:currentColor;
    fill:none;

    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}

.nav-button span{
    pointer-events:none;
}

@media(max-width:600px){

    .bottom-nav{
        height:91px;
    }

    .nav-button{
        font-size:13px;
    }

    .nav-button svg{
        width:30px;
        height:30px;
    }
}

/* =====================================================
   RÉVEILS
===================================================== */

.alarm-empty{
    text-align:center;
    margin-top:76px;
}

.add-button{
    width:82px;
    height:82px;

    border:0;
    border-radius:50%;

    background:#21e879;
    color:#07170d;

    font-size:40px;
    font-weight:300;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;

    cursor:pointer;

    transition:transform .15s;
}

.add-button:active{
    transform:scale(.92);
}

.add-label{
    margin-top:14px;
    color:#777;
    font-size:20px;
}

.alarm-list{
    margin-top:30px;
}

.alarm{
    min-height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #191919;
}

.alarm-time{
    font-size:39px;
    font-weight:300;
}

.alarm-days{
    margin-top:4px;
    color:#777;
    font-size:14px;
}

.alarm-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.delete{
    background:transparent;
    color:#666;
    font-size:28px;
    padding:8px;
}

.switch{
    position:relative;

    width:51px;
    height:31px;

    border:0;
    border-radius:20px;

    background:#333;

    padding:0;
}

.switch::after{
    content:"";

    position:absolute;

    width:25px;
    height:25px;

    top:3px;
    left:3px;

    border-radius:50%;

    background:#aaa;

    transition:.18s;
}

.switch.on{
    background:#21e879;
}

.switch.on::after{
    left:23px;
    background:#06130b;
}

/* =====================================================
   HORLOGE
===================================================== */

.clock-page{
    text-align:center;
}

.clock-content{
    margin-top:105px;
}

.clock{
    font-size:clamp(54px,15vw,105px);
    font-weight:300;
    letter-spacing:1px;
    white-space:nowrap;
}

.clock .seconds{
    color:#21e879;
}

.date{
    color:#777;
    font-size:20px;
    margin-top:15px;
    text-transform:capitalize;
}

/* =====================================================
   CHRONOMÈTRE
===================================================== */

.tool-page{
    text-align:center;
}

.tool{
    margin-top:85px;
}

.tool-display{
    font-size:clamp(57px,15vw,100px);
    font-weight:300;
    font-variant-numeric:tabular-nums;
    letter-spacing:1px;
}

.tool-display .green{
    color:#21e879;
}

.buttons{
    margin-top:45px;

    display:flex;
    justify-content:center;
    gap:20px;
}

.round{
    width:78px;
    height:78px;

    border-radius:50%;
    border:0;

    background:#181818;
    color:#fff;

    font-size:15px;
}

.round.green{
    background:#21e879;
    color:#06130b;
    font-weight:700;
}

.round:active{
    transform:scale(.93);
}

.laps{
    max-width:420px;
    margin:35px auto 0;
    text-align:left;
    max-height:190px;
    overflow:auto;
}

.lap{
    display:flex;
    justify-content:space-between;

    padding:11px 4px;

    color:#aaa;

    border-bottom:1px solid #191919;
}

/* =====================================================
   MINUTEUR
===================================================== */

.timer{
    margin-top:65px;
}

.timer-display{
    font-size:clamp(58px,16vw,100px);
    font-weight:300;
    font-variant-numeric:tabular-nums;
}

.timer-inputs{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    margin-top:35px;
}

.timer-input{
    width:76px;
    height:58px;

    background:#111;
    color:#fff;

    border:1px solid #2a2a2a;
    border-radius:12px;

    text-align:center;

    font-size:25px;
    outline:none;
}

.timer-input:focus{
    border-color:#21e879;
}

.timer-input:disabled{
    opacity:.5;
}

.colon{
    color:#777;
    font-size:25px;
}

/* =====================================================
   MODALE RÉVEIL
===================================================== */

.modal{
    position:fixed;
    z-index:10000;

    inset:0;

    background:rgba(0,0,0,.72);

    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(600px,100%);

    background:#151515;

    border-radius:25px 25px 0 0;

    padding:25px 22px 32px;
}

.modal-title{
    text-align:center;
    font-size:22px;
    margin-bottom:22px;
}

.alarm-picker{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

.alarm-picker input{
    width:105px;
    height:70px;

    background:#080808;
    color:#fff;

    border:1px solid #333;
    border-radius:15px;

    text-align:center;

    font-size:38px;
    outline:none;
}

.alarm-picker input:focus{
    border-color:#21e879;
}

.day-picker{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;

    margin:25px 0;
}

.day{
    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    background:#252525;
    color:#aaa;
}

.day.selected{
    background:#21e879;
    color:#06130b;
    font-weight:bold;
}

.modal-actions{
    display:flex;
    gap:12px;
}

.modal-actions button{
    flex:1;
    height:52px;
    border:0;
    border-radius:30px;
    font-size:16px;
}

.cancel{
    background:#292929;
    color:#fff;
}

.save{
    background:#21e879;
    color:#06130b;
    font-weight:bold;
}

/* =====================================================
   ALARME
===================================================== */

.ringing{
    position:fixed;
    z-index:20000;

    inset:0;

    background:#000;

    display:none;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.ringing.show{
    display:flex;
}

.ringing h2{
    font-size:40px;
    margin:0 0 15px;
}

.ringing-time{
    color:#21e879;
    font-size:70px;
    margin-bottom:40px;
}

.stop{
    border:0;
    background:#21e879;
    color:#06130b;

    padding:17px 45px;

    border-radius:40px;

    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<div class="pages">

<!-- ===================================================
     RÉVEILS
=================================================== -->

<section class="page active" id="page-alarms">

<div class="inner">

<h1>Réveils</h1>
<div class="subtitle">Vos alarmes</div>

<div id="alarmList" class="alarm-list"></div>

<div id="emptyAlarm" class="alarm-empty">

<button class="add-button" id="addAlarm">+</button>

<div class="add-label">Ajouter un réveil</div>

</div>

</div>

</section>


<!-- ===================================================
     HORLOGE
=================================================== -->

<section class="page clock-page" id="page-clock">

<div class="inner">

<h1>Horloge</h1>
<div class="subtitle">Heure actuelle</div>

<div class="clock-content">

<div class="clock">
<span id="hours">00</span>:<span id="minutes">00</span>:<span class="seconds" id="seconds">00</span>
</div>

<div class="date" id="date"></div>

</div>

</div>

</section>


<!-- ===================================================
     CHRONO
=================================================== -->

<section class="page tool-page" id="page-chrono">

<div class="inner">

<h1>Chrono</h1>
<div class="subtitle">Chronomètre</div>

<div class="tool">

<div class="tool-display">
<span id="chronoMin">00</span>:<span id="chronoSec">00</span><span class="green">.<span id="chronoMs">00</span></span>
</div>

<div class="buttons">

<button class="round" id="chronoReset">
Reset
</button>

<button class="round green" id="chronoStart">
Démarrer
</button>

<button class="round" id="chronoLap">
Tour
</button>

</div>

<div class="laps" id="laps"></div>

</div>

</div>

</section>


<!-- ===================================================
     MINUTEUR
=================================================== -->

<section class="page tool-page" id="page-timer">

<div class="inner">

<h1>Minuteur</h1>
<div class="subtitle">Compte à rebours</div>

<div class="timer">

<div class="timer-display" id="timerDisplay">
00:00:00
</div>

<div class="timer-inputs">

<input
class="timer-input"
id="timerH"
type="number"
min="0"
max="99"
value="0"
inputmode="numeric">

<span class="colon">:</span>

<input
class="timer-input"
id="timerM"
type="number"
min="0"
max="59"
value="5"
inputmode="numeric">

<span class="colon">:</span>

<input
class="timer-input"
id="timerS"
type="number"
min="0"
max="59"
value="0"
inputmode="numeric">

</div>

<div class="buttons">

<button class="round" id="timerReset">
Reset
</button>

<button class="round green" id="timerStart">
Démarrer
</button>

</div>

</div>

</div>

</section>

</div>


<!-- ===================================================
     NAVIGATION
=================================================== -->

<nav class="bottom-nav" id="bottomNav">

<!-- RÉVEILS -->

<button class="nav-button active" data-page="alarms">

<svg viewBox="0 0 32 32">
<path d="M9 21.5h14"/>
<path d="M10 21.5v-8a6 6 0 0 1 12 0v8"/>
<path d="M7.5 21.5h17"/>
<path d="M13 25h6"/>
<path d="M16 7V5"/>
</svg>

<span>Réveils</span>

</button>


<!-- HORLOGE -->

<button class="nav-button" data-page="clock">

<svg viewBox="0 0 32 32">
<circle cx="16" cy="16" r="12"/>
<path d="M16 9v7l5 3"/>
</svg>

<span>Horloge</span>

</button>


<!-- CHRONO -->

<button class="nav-button" data-page="chrono">

<svg viewBox="0 0 32 32">
<circle cx="16" cy="18" r="9.5"/>
<path d="M13 5h6"/>

<path d="M12 8l-2-2"/>
<path d="M20 8l2-2"/>
<path d="M16 12v6l4 2"/>
</svg>

<span>Chrono</span>

</button>


<!-- MINUTEUR -->

<svg viewBox="0 0 32 32">
<circle cx="16" cy="18" r="9.5"/>
<path d="M13 5h6"/>

<path d="M11 9L8.5 6.5"/>

</svg>

<span>Minuteur</span>

</nav>

</div>


<!-- ===================================================
     MODALE
=================================================== -->

<div class="modal" id="alarmModal">

<div class="modal-box">

<div class="modal-title">
Nouveau réveil
</div>

<div class="alarm-picker">

<input id="alarmHour" type="number" min="0" max="23" value="07">

<span class="colon">:</span>

<input id="alarmMinute" type="number" min="0" max="59" value="00">

</div>

<div class="day-picker">

<button class="day" data-day="1">Lun</button>
<button class="day" data-day="2">Mar</button>
<button class="day" data-day="3">Mer</button>
<button class="day" data-day="4">Jeu</button>
<button class="day" data-day="5">Ven</button>
<button class="day" data-day="6">Sam</button>
<button class="day" data-day="0">Dim</button>

</div>

<div class="modal-actions">

<button class="cancel" id="cancelAlarm">
Annuler
</button>

<button class="save" id="saveAlarm">
Enregistrer
</button>

</div>

</div>

</div>


<!-- ===================================================
     ALARME
=================================================== -->

<div class="ringing" id="ringing">

<div>

<h2>Réveil</h2>

<div class="ringing-time" id="ringingTime">
00:00
</div>

<button class="stop" id="stopRinging">
Arrêter
</button>

</div>

</div>


<script>

/* =====================================================
   NAVIGATION
   VERSION ROBUSTE POUR TÉLÉPHONE
===================================================== */

const navButtons =
document.querySelectorAll(".nav-button");

const pages =
document.querySelectorAll(".page");

function openPage(name){

    pages.forEach(page=>{
        page.classList.remove("active");
    });

    const target =
    document.getElementById("page-" + name);

    if(target){
        target.classList.add("active");
    }

    navButtons.forEach(button=>{
        button.classList.toggle(
            "active",
            button.dataset.page === name
        );
    });

    /*
       Retour en haut de la page.
    */

    if(target){
        target.scrollTop = 0;
    }
}


/*
   On utilise pointerdown + click.
   Cela rend les boutons fiables sur Android.
*/

navButtons.forEach(button=>{

    button.addEventListener("pointerdown",function(e){
        e.preventDefault();
        openPage(this.dataset.page);
    });

});


/* =====================================================
   HORLOGE
===================================================== */

const dayNames = [
"dimanche",
"lundi",
"mardi",
"mercredi",
"jeudi",
"vendredi",
"samedi"
];

const monthNames = [
"janvier",
"février",
"mars",
"avril",
"mai",
"juin",
"juillet",
"août",
"septembre",
"octobre",
"novembre",
"décembre"
];

function pad(number){
    return String(number).padStart(2,"0");
}

function updateClock(){

    const now = new Date();

    document.getElementById("hours").textContent =
        pad(now.getHours());

    document.getElementById("minutes").textContent =
        pad(now.getMinutes());

    document.getElementById("seconds").textContent =
        pad(now.getSeconds());

    document.getElementById("date").textContent =
        dayNames[now.getDay()]
        + " "
        + now.getDate()
        + " "
        + monthNames[now.getMonth()]
        + " "
        + now.getFullYear();

    checkAlarms();
}

setInterval(updateClock,1000);

updateClock();


/* =====================================================
   RÉVEILS
===================================================== */

let alarms = [];

try{
    alarms =
    JSON.parse(
        localStorage.getItem("horloge_alarms")
    ) || [];
}catch(e){
    alarms = [];
}

let selectedDays = [];

const alarmModal =
document.getElementById("alarmModal");

document.getElementById("addAlarm")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    selectedDays = [];

    document.querySelectorAll(".day")
    .forEach(day=>{
        day.classList.remove("selected");
    });

    alarmModal.classList.add("open");

});


document.getElementById("cancelAlarm")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    alarmModal.classList.remove("open");

});


document.querySelectorAll(".day")
.forEach(day=>{

    day.addEventListener("pointerdown",function(e){

        e.preventDefault();

        const value =
        Number(this.dataset.day);

        if(selectedDays.includes(value)){

            selectedDays =
            selectedDays.filter(
                d=>d !== value
            );

            this.classList.remove("selected");

        }else{

            selectedDays.push(value);

            this.classList.add("selected");
        }

    });

});


document.getElementById("saveAlarm")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    let hour =
    Number(
        document.getElementById("alarmHour").value
    );

    let minute =
    Number(
        document.getElementById("alarmMinute").value
    );

    hour = Math.max(0,Math.min(23,hour));
    minute = Math.max(0,Math.min(59,minute));

    alarms.push({

        id:Date.now(),

        hour:hour,

        minute:minute,

        days:[...selectedDays],

        enabled:true,

        last:""

    });

    saveAlarms();

    renderAlarms();

    alarmModal.classList.remove("open");

});


function saveAlarms(){

    localStorage.setItem(
        "horloge_alarms",
        JSON.stringify(alarms)
    );

}


function renderAlarms(){

    const list =
    document.getElementById("alarmList");

    const empty =
    document.getElementById("emptyAlarm");

    list.innerHTML = "";

    empty.style.display =
    alarms.length === 0
    ? "block"
    : "none";

    const names = {
        1:"Lun",
        2:"Mar",
        3:"Mer",
        4:"Jeu",
        5:"Ven",
        6:"Sam",
        0:"Dim"
    };

    alarms.forEach(alarm=>{

        let daysText = "Tous les jours";

        if(alarm.days.length){

            daysText =
            alarm.days
            .map(day=>names[day])
            .join(" • ");

        }

        const row =
        document.createElement("div");

        row.className = "alarm";

        row.innerHTML = `

            <div>

                <div class="alarm-time">
                    ${pad(alarm.hour)}:${pad(alarm.minute)}
                </div>

                <div class="alarm-days">
                    ${daysText}
                </div>

            </div>

            <div class="alarm-right">

                <button
                    class="delete"
                    data-delete="${alarm.id}">
                    ×
                </button>

                <button
                    class="switch ${alarm.enabled ? "on" : ""}"
                    data-switch="${alarm.id}">
                </button>

            </div>
        `;

        list.appendChild(row);

    });


    document.querySelectorAll("[data-delete]")
    .forEach(button=>{

        button.addEventListener("pointerdown",function(e){

            e.preventDefault();

            const id =
            Number(this.dataset.delete);

            alarms =
            alarms.filter(
                alarm=>alarm.id !== id
            );

            saveAlarms();

            renderAlarms();

        });

    });


    document.querySelectorAll("[data-switch]")
    .forEach(button=>{

        button.addEventListener("pointerdown",function(e){

            e.preventDefault();

            const id =
            Number(this.dataset.switch);

            const alarm =
            alarms.find(
                a=>a.id === id
            );
