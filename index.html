<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">
  <title>Waveify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <span class="brand-mark">W</span>
        <span>Waveify</span>
      </div>

      <nav class="nav-main">

        <button class="nav-link active" data-route="home">
          <span>⌂</span>
          <span>Accueil</span>
        </button>

        <button class="nav-link" data-route="recommendations">
          <span>✦</span>
          <span>Recommandations</span>
        </button>

        <button class="nav-link" data-route="liked">
          <span>♥</span>
          <span>J’aime</span>
          <span class="nav-count" id="likedCount">0</span>
        </button>

        <button class="nav-link" data-route="disliked">
          <span>♥̸</span>
          <span>Pas aimé</span>
          <span class="nav-count" id="dislikedCount">0</span>
        </button>

        <button class="nav-link" data-route="playlist">
          <span>＋</span>
          <span>Ma playlist</span>
          <span class="nav-count" id="playlistCount">0</span>
        </button>

      </nav>

      <div class="sidebar-bottom">
        <button class="nav-link" id="clearData">
          <span>↺</span>
          <span>Réinitialiser</span>
        </button>
      </div>

    </aside>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- CONTENU -->
    <main class="main-area">

      <header class="topbar">

        <button
          class="icon-button mobile-menu"
          id="mobileMenu"
          aria-label="Menu">
          ☰
        </button>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Rechercher une musique..."
            autocomplete="off">

          <button
            class="clear-search"
            id="clearSearch"
            aria-label="Effacer">
            ×
          </button>
        </div>

        <div class="top-actions">
          <button class="ghost-button" id="topPlay">
            ▶ Tout lire
          </button>
        </div>

      </header>

      <section class="content">

        <div id="pageHome" class="page active-page"></div>

        <div id="pageRecommendations" class="page"></div>

        <div id="pageLiked" class="page"></div>

        <div id="pageDisliked" class="page"></div>

        <div id="pagePlaylist" class="page"></div>

        <div id="pageSearch" class="page"></div>

      </section>

    </main>

  </div>


  <!-- LECTEUR DU BAS -->
  <section class="player" id="playerBar">

    <div class="player-left">

      <img
        id="playerCover"
        class="player-cover"
        src="https://i.ytimg.com/vi/Pl1d5YSEg2w/hqdefault.jpg"
        alt="Pochette">

      <div class="now-playing">

        <strong id="playerTitle">
          Aucune musique
        </strong>

        <span id="playerSubtitle">
          Choisis une musique
        </span>

      </div>

      <button
        class="player-like"
        id="playerLike"
        title="J’aime">
        ♡
      </button>

    </div>


    <div class="player-center">

      <div class="player-controls">

        <button
          class="player-control small"
          id="shuffleBtn"
          title="Aléatoire">
          🔀
        </button>

        <button
          class="player-control"
          id="prevBtn"
          title="Précédent">
          ⏮
        </button>

        <button
          class="play-main"
          id="playPauseBtn"
          title="Lecture / pause">
          ▶
        </button>

        <button
          class="player-control"
          id="nextBtn"
          title="Suivant">
          ⏭
        </button>

        <button
          class="player-control small"
          id="repeatBtn"
          title="Répéter">
          ↻
        </button>

      </div>

      <div class="progress-row">

        <span id="currentTime">0:00</span>

        <input
          id="progressBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1">

        <span id="duration">0:00</span>

      </div>

    </div>


    <div class="player-right">

      <button
        class="mode-button"
        id="infiniteBtn"
        title="Mode infini">
        ♾ <span>Infini</span>
      </button>

      <span class="volume-icon">🔊</span>

      <input
        id="volumeBar"
        type="range"
        min="0"
        max="100"
        value="80">

    </div>

  </section>


  <!-- Lecteur YouTube invisible -->
  <div
    id="youtubePlayer"
    class="youtube-player"
    aria-hidden="true">
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>


  <!-- IMPORTANT : YouTube avant script.js -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>

</body>
</html>
