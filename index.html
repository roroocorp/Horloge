<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Horloge</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
padding-bottom:100px;
}

header{
padding:30px 24px 15px;
}

h1{
font-size:34px;
margin:0;
font-weight:700;
}

.subtitle{
color:#777;
margin-top:5px;
}

.page{
display:none;
padding:15px 20px;
}

.page.active{
display:block;
}

/* ================= REVEILS ================= */

.alarm{
background:#171717;
border-radius:22px;
padding:20px;
margin-bottom:12px;
}

.alarm-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.alarm-time{
font-size:54px;
font-weight:300;
letter-spacing:-2px;
}

.alarm-name{
color:#888;
font-size:14px;
margin-top:4px;
}

.alarm-days{
color:#666;
font-size:13px;
margin-top:5px;
}

.switch{
width:54px;
height:32px;
position:relative;
display:inline-block;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#444;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
width:26px;
height:26px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#32d47a;
}

.switch input:checked+.slider:before{
transform:translateX(22px);
}

.alarm-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.delete{
border:0;
background:none;
color:#ff5555;
font-size:14px;
}

.add{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#32d47a;
font-size:34px;
color:#001b0d;
display:block;
margin:25px auto 5px;
}

.empty{
text-align:center;
color:#666;
padding:60px 20px;
}

/* ================= HORLOGE ================= */

.clock{
text-align:center;
padding-top:70px;
}

.clock-time{
font-size:78px;
font-weight:200;
letter-spacing:-5px;
}

.clock-date{
font-size:18px;
color:#888;
margin-top:8px;
}

/* ================= CHRONO ================= */

.big-number{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:75px 0 50px;
font-variant-numeric:tabular-nums;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.green{
background:#32d47a;
color:#001b0d;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:700;
}

.dark{
background:#202020;
color:#fff;
border:0;
border-radius:18px;
height:58px;
font-size:17px;
font-weight:600;
}

.full{
width:100%;
margin-top:12px;
}

/* ================= MINUTEUR ================= */

.timer-title{
text-align:center;
color:#888;
font-size:15px;
margin-top:25px;
}

.timer-picker{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin:25px 0 35px;
}

.timer-column{
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
}

.timer-column button{
width:100%;
height:42px;
background:#171717;
border:0;
border-radius:14px;
color:#aaa;
font-size:22px;
}

.timer-value{
width:100%;
height:75px;
background:#202020;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:43px;
font-weight:300;
font-variant-numeric:tabular-nums;
}

.timer-label{
font-size:11px;
color:#666;
}

.timer-display{
font-size:68px;
font-weight:200;
text-align:center;
letter-spacing:-4px;
margin:65px 0 45px;
font-variant-numeric:tabular-nums;
}

/* ================= NAV ================= */

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:82px;
background:#111;
border-top:1px solid #222;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

nav button{
background:none;
border:0;
color:#777;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
}

nav button.active{
color:#32d47a;
}

.icon{
font-size:25px;
}

/* ================= MODAL ================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:520px;
margin:auto;
background:#171717;
border-radius:28px 28px 0 0;
padding:25px 20px 35px;
max-height:90vh;
overflow-y:auto;
}

.modal-box h2{
margin:0 0 20px;
}

.modal-box input[type=time]{
width:100%;
height:75px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:18px;
font-size:40px;
text-align:center;
color-scheme:dark;
}

.modal-box input[type=text]{
width:100%;
height:52px;
margin-top:12px;
background:#222;
color:#fff;
border:1px solid #333;
border-radius:15px;
padding:0 14px;
outline:none;
}

/* JOURS */

.days-title{
font-size:14px;
color:#888;
margin:20px 0 10px;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}

.day{
height:42px;
border:0;
border-radius:13px;
background:#252525;
color:#888;
font-size:12px;
font-weight:600;
}

.day.selected{
background:#32d47a;
color:#001b0d;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1 id="title">Réveils</h1>
<div class="subtitle" id="subtitle">Vos alarmes</div>
</header>

<!-- ================= REVEILS ================= -->

<section id="alarms" class="page active">

<div id="alarmList"></div>

<button class="add" id="addAlarm">+</button>

<div style="text-align:center;color:#777">
Ajouter un réveil
</div>

</section>

<!-- ================= HORLOGE ================= -->

<section id="clock" class="page">

<div class="clock">
<div id="clockTime" class="clock-time">00:00:00</div>
<div id="clockDate" class="clock-date"></div>
</div>

</section>

<!-- ================= CHRONO ================= -->

<section id="chrono" class="page">

<div id="chronoDisplay" class="big-number">
00:00.00
</div>

<div class="buttons">

<button class="dark" id="lapButton">
Tour
</button>

<button id="chronoStart" class="green">
Démarrer
</button>

</div>

<button class="dark full" id="chronoReset">
Réinitialiser
</button>

<div id="laps"></div>

</section>

<!-- ================= MINUTEUR ================= -->

<section id="timer" class="page">

<div class="timer-display" id="timerDisplay">
00:05:00
</div>

<div class="timer-picker">

<div class="timer-column">

<button id="hourUp">▲</button>

<div class="timer-value" id="hourValue">00</div>

<button id="hourDown">▼</button>

<div class="timer-label">HEURES</div>

</div>

<div class="timer-column">

<button id="minuteUp">▲</button>

<div class="timer-value" id="minuteValue">05</div>

<button id="minuteDown">▼</button>

<div class="timer-label">MINUTES</div>

</div>

<div class="timer-column">

<button id="secondUp">▲</button>

<div class="timer-value" id="secondValue">00</div>

<button id="secondDown">▼</button>

<div class="timer-label">SECONDES</div>

</div>

</div>

<button id="timerStart" class="green full">
Démarrer
</button>

<button id="timerReset" class="dark full">
Réinitialiser
</button>

</section>

<!-- ================= NAVIGATION ================= -->

<nav>

<button id="navAlarms" class="active">
<span class="icon">⏰</span>
Réveils
</button>

<button id="navClock">
<span class="icon">🕐</span>
Horloge
</button>

<button id="navChrono">
<span class="icon">⏱️</span>
Chrono
</button>

<button id="navTimer">
<span class="icon">⌛</span>
Minuteur
</button>

</nav>

</div>

<!-- ================= MODAL REVEIL ================= -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Nouveau réveil</h2>

<input id="alarmTime" type="time" value="07:00">

<div class="days-title">
Répéter les jours
</div>

<div class="days">

<button class="day" data-day="L">L</button>
<button class="day" data-day="M">M</button>
<button class="day" data-day="Me">M</button>
<button class="day" data-day="J">J</button>
<button class="day" data-day="V">V</button>
<button class="day" data-day="S">S</button>
<button class="day" data-day="D">D</button>

</div>

<input
id="youtube"
type="text"
placeholder="Lien YouTube de la musique (facultatif)"
>

<div class="modal-buttons">

<button class="dark" id="cancelAlarm">
Annuler
</button>

<button class="green" id="createAlarmButton">
Ajouter
</button>

</div>

</div>

</div>

<script>

/* =====================================================
   NAVIGATION
   AUCUNE SAUVEGARDE
===================================================== */

const pageNames={
alarms:["Réveils","Vos alarmes"],
clock:["Horloge","Heure locale"],
chrono:["Chronomètre","Mesure du temps"],
timer:["Minuteur","Compte à rebours"]
};

function showPage(name){

document.querySelectorAll(".page").forEach(function(section){
section.classList.remove("active");
});

const target=document.getElementById(name);

if(target){
target.classList.add("active");
}

document.querySelectorAll("nav button").forEach(function(button){
button.classList.remove("active");
});

const navButton=document.getElementById(
"nav"+name.charAt(0).toUpperCase()+name.slice(1)
);

if(navButton){
navButton.classList.add("active");
}

document.getElementById("title").textContent=pageNames[name][0];
document.getElementById("subtitle").textContent=pageNames[name][1];
}

document.getElementById("navAlarms").onclick=function(){
showPage("alarms");
};

document.getElementById("navClock").onclick=function(){
showPage("clock");
};

document.getElementById("navChrono").onclick=function(){
showPage("chrono");
};

document.getElementById("navTimer").onclick=function(){
showPage("timer");
};


/* =====================================================
   HORLOGE
===================================================== */

function updateClock(){

const d=new Date();

document.getElementById("clockTime").textContent=
String(d.getHours()).padStart(2,"0")+":"+
String(d.getMinutes()).padStart(2,"0")+":"+
String(d.getSeconds()).padStart(2,"0");

let date=d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

document.getElementById("clockDate").textContent=
date.charAt(0).toUpperCase()+date.slice(1);
}

updateClock();
setInterval(updateClock,1000);


/* =====================================================
   REVEILS
===================================================== */

let alarms=[];

const modal=document.getElementById("modal");

document.getElementById("addAlarm").onclick=function(){

modal.classList.add("show");

document.querySelectorAll(".day").forEach(function(day){
day.classList.remove("selected");
});

if("Notification" in window &&
Notification.permission==="default"){

Notification.requestPermission().catch(function(){});

}
};

document.getElementById("cancelAlarm").onclick=function(){
modal.classList.remove("show");
};

document.querySelectorAll(".day").forEach(function(day){

day.onclick=function(){

day.classList.toggle("selected");

};

});

function createAlarm(){

const time=document.getElementById("alarmTime").value;

if(!time){
return;
}

const selectedDays=[];

document.querySelectorAll(".day.selected").forEach(function(day){
selectedDays.push(day.dataset.day);
});

const youtube=document.getElementById("youtube").value.trim();

alarms.push({
id:Date.now(),
time:time,
days:selectedDays,
enabled:true,
youtube:youtube,
lastRing:""
});

renderAlarms();

document.getElementById("youtube").value="";

modal.classList.remove("show");
}

document.getElementById("createAlarmButton").onclick=createAlarm;


function removeAlarm(id){

alarms=alarms.filter(function(alarm){
return alarm.id!==id;
});

renderAlarms();
}


function toggleAlarm(id){

const alarm=alarms.find(function(a){
return a.id===id;
});

if(!alarm)return;

alarm.enabled=!alarm.enabled;

renderAlarms();
}


function daysText(days){

if(!days || days.length===0){
return "Une seule fois";
}

if(days.length===7){
return "Tous les jours";
}

const names={
L:"Lun",
M:"Mar",
Me:"Mer",
J:"Jeu",
V:"Ven",
S:"Sam",
D:"Dim"
};

return days.map(function(day){
return names[day]||day;
}).join(" · ");
}


function renderAlarms(){

const box=document.getElementById("alarmList");

box.innerHTML="";

if(alarms.length===0){

box.innerHTML=`
<div class="empty">
Aucun réveil<br><br>
Appuie sur + pour créer ton premier réveil.
</div>`;

return;
}

alarms.sort(function(a,b){
return a.time.localeCompare(b.time);
});

alarms.forEach(function(alarm){

const div=document.createElement("div");

div.className="alarm";

div.innerHTML=`

<div class="alarm-top">

<div>

<div class="alarm-time">
${alarm.time}
</div>

<div class="alarm-name">
${alarm.enabled ? "Réveil activé" : "Réveil désactivé"}
${alarm.youtube ? " · 🎵 Musique" : ""}
</div>

<div class="alarm-days">
${daysText(alarm.days)}
</div>

</div>

<label class="switch">

<input type="checkbox"
${alarm.enabled ? "checked" : ""}>

<span class="slider"></span>

</label>

</div>

<div class="alarm-actions">

${
alarm.youtube
?
`<button class="dark musicButton"
style="height:40px;padding:0 15px">
🎵 Tester la musique
</button>`
:
""
}

<button class="delete">
Supprimer
</button>

</div>
`;

const checkbox=div.querySelector("input");

checkbox.onchange=function(){
toggleAlarm(alarm.id);
};

const deleteButton=div.querySelector(".delete");

deleteButton.onclick=function(){
removeAlarm(alarm.id);
};

const musicButton=div.querySelector(".musicButton");

if(musicButton){

musicButton.onclick=function(){
openMusic(alarm.youtube);
};

}

box.appendChild(div);

});

}

renderAlarms();


/* =====================================================
   MUSIQUE YOUTUBE
===================================================== */

function getYoutubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be")){
return u.pathname.substring(1);
}

if(u.hostname.includes("youtube.com")){
return u.searchParams.get("v");
}

}catch(e){}

return null;
}

function openMusic(url){

const id=getYoutubeId(url);

if(id){

window.open(
"https://www.youtube.com/watch?v="+id,
"_blank"
);

}
}


/* =====================================================
   SON
===================================================== */

let audioCtx=null;

function ring(){

try{

audioCtx=
audioCtx ||
new (window.AudioContext || window.webkitAudioContext)();

const now=audioCtx.currentTime;

for(let i=0;i<6;i++){

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=i%2===0?880:660;
osc.type="sine";

gain.gain.setValueAtTime(
.001,
now+i*.35
);

gain.gain.exponentialRampToValueAtTime(
.45,
now+i*.35+.03
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+i*.35+.3
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(now+i*.35);
osc.stop(now+i*.35+.32);

}

}catch(e){}

if(navigator.vibrate){

navigator.vibrate([
500,300,500,300,700,
300,500
]);

}

}


function notify(title,text){

if(
"Notification" in window &&
Notification.permission==="granted"
){

try{

new Notification(title,{
body:text,
requireInteraction:true
});

}catch(e){}

}

}


/* =====================================================
   VERIFICATION DES REVEILS
===================================================== */

setInterval(function(){

const now=new Date();

const hh=String(now.getHours()).padStart(2,"0");
const mm=String(now.getMinutes()).padStart(2,"0");

const current=hh+":"+mm;

const dayIndex=now.getDay();

const dayCodes=[
"D","L","M","Me","J","V","S"
];

const today=dayCodes[dayIndex];

alarms.forEach(function(alarm){

const correctDay=
!alarm.days ||
alarm.days.length===0 ||
alarm.days.includes(today);

if(
alarm.enabled &&
alarm.time===current &&
alarm.lastRing!==current &&
correctDay
){

alarm.lastRing=current;

ring();

notify(
"⏰ Réveil",
"Il est "+current
);

if(alarm.youtube){

setTimeout(function(){
openMusic(alarm.youtube);
},1000);

}

}

});

},1000);


/* =====================================================
   CHRONOMETRE
   PAS DE SAUVEGARDE
===================================================== */

let chronoRunning=false;
let chronoStartTime=0;
let chronoElapsed=0;
let chronoInterval=null;

function chronoFormat(ms){

const m=Math.floor(ms/60000);
const s=Math.floor((ms%60000)/1000);
const c=Math.floor((ms%1000)/10);

return(
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")+"."+
String(c).padStart(2,"0")
);

}

function updateChrono(){

let value=chronoElapsed;

if(chronoRunning){
value+=Date.now()-chronoStartTime;
}

document.getElementById("chronoDisplay").textContent=
chronoFormat(value);

}

document.getElementById("chronoStart").onclick=function(){

if(!chronoRunning){

chronoStartTime=Date.now();
chronoRunning=true;

document.getElementById("chronoStart").textContent="Pause";

chronoInterval=setInterval(updateChrono,30);

}else{

chronoElapsed+=Date.now()-chronoStartTime;
chronoRunning=false;

clearInterval(chronoInterval);

document.getElementById("chronoStart").textContent="Démarrer";

}

updateChrono();

};


document.getElementById("lapButton").onclick=function(){

if(!chronoRunning)return;

const value=
chronoElapsed+
Date.now()-
chronoStartTime;

const div=document.createElement("div");

div.style.cssText=
"padding:13px 5px;border-bottom:1px solid #222;display:flex;justify-content:space-between;color:#aaa";

div.innerHTML=
"<span>Tour</span><span>"+
chronoFormat(value)+
"</span>";

document.getElementById("laps").prepend(div);

};


document.getElementById("chronoReset").onclick=function(){

clearInterval(chronoInterval);

chronoRunning=false;
chronoElapsed=0;
chronoStartTime=0;

document.getElementById("chronoDisplay").textContent=
"00:00.00";

document.getElementById("chronoStart").textContent=
"Démarrer";

document.getElementById("laps").innerHTML="";

};


/* =====================================================
   MINUTEUR
   PAS DE SAUVEGARDE
===================================================== */

let timerRunning=false;
let timerRemaining=300;
let timerEnd=0;
let timerInterval=null;

let timerHours=0;
let timerMinutes=5;
let timerSeconds=0;


function updateTimerValues(){

document.getElementById("hourValue").textContent=
String(timerHours).padStart(2,"0");

document.getElementById("minuteValue").textContent=
String(timerMinutes).padStart(2,"0");

document.getElementById("secondValue").textContent=
String(timerSeconds).padStart(2,"0");

}


function updateTimerDisplay(){

const h=Math.floor(timerRemaining/3600);
const m=Math.floor((timerRemaining%3600)/60);
const s=timerRemaining%60;

document.getElementById("timerDisplay").textContent=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}


function setTimerFromPicker(){

timerRemaining=
timerHours*3600+
timerMinutes*60+
timerSeconds;

updateTimerDisplay();

}


function changeHours(amount){

if(timerRunning)return;

timerHours=Math.max(
0,
Math.min(99,timerHours+amount)
);

setTimerFromPicker();
updateTimerValues();

}


function changeMinutes(amount){

if(timerRunning)return;

timerMinutes+=amount;

if(timerMinutes>59){
timerMinutes=0;
}

if(timerMinutes<0){
timerMinutes=59;
}

setTimerFromPicker();
updateTimerValues();

}


function changeSeconds(amount){

if(timerRunning)return;

timerSeconds+=amount;

if(timerSeconds>59){
timerSeconds=0;
}

if(timerSeconds<0){
timerSeconds=59;
}

setTimerFromPicker();
updateTimerValues();

}


document.getElementById("hourUp").onclick=function(){
changeHours(1);
};

document.getElementById("hourDown").onclick=function(){
changeHours(-1);
};

document.getElementById("minuteUp").onclick=function(){
changeMinutes(1);
};

document.getElementById("minuteDown").onclick=function(){
changeMinutes(-1);
};

document.getElementById("secondUp").onclick=function(){
changeSeconds(1);
};

document.getElementById("secondDown").onclick=function(){
changeSeconds(-1);
};


function updateRunningTimer(){

if(!timerRunning)return;

timerRemaining=Math.max(
0,
Math.ceil((timerEnd-Date.now())/1000)
);

updateTimerDisplay();

if(ti
